[project]
name = "opennvr-app-__APP_ID__"
version = "0.1.0"
description = "__APP_NAME__ — an OpenNVR Detector app"
requires-python = ">=3.11"
license = { text = "__LICENSE__" }

# The SDK owns the runtime stack (NATS loop, alert fan-out, the platform
# client, the contract server). What's left in your app is the rule.
dependencies = [
    "__SDK_REQUIREMENT__",
]
__UV_SOURCES__
[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23"]

# Mirrors optional-dependencies so a plain ``uv sync`` is test-ready.
[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23"]

[project.scripts]
__APP_ID__ = "__APP_MODULE__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
