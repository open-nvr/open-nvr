# ==========================================
# OpenNVR — camera-agent overlay
# ==========================================
#
# The camera-agent in two ways to run, same app:
#
#   * camera-agent        VOICE — ask out loud, hear the answer spoken back.
#                         Pipecat + Silero VAD + Whisper STT + Ollama LLM +
#                         Piper TTS + YOLOv8/BLIP vision. The flagship.
#   * camera-agent-chat   CHAT — type your question, read the answer. Same
#                         tools and scene description (YOLOv8 + BLIP), no
#                         microphone/speaker, so it's lighter (no Whisper/Piper).
#
# Both run a small local LLM by default. To use a cloud / bring-your-own brain
# instead (OpenAI-compatible), see examples/camera-agent/config.cloud.yml.
#
# Quickstart (from the repo root):
#
#     examples/camera-agent/quickstart.sh          # voice (default)
#     examples/camera-agent/quickstart.sh --chat   # text chat
#     examples/camera-agent/quickstart.sh --down   # stop
#
# Or drive Compose directly:
#
#     docker compose -f docker-compose.yml \
#                    -f docker-compose.camera-agent.yml \
#                    --profile camera-agent up -d      # or --profile camera-agent-chat
#
# The Ollama model is pulled automatically on first ``up``. Open
# https://localhost:9100/demo.
#
# ── A note on packaging maturity ───────────────────────────────
#
# v0.1 ships the camera-agent service ``build:``-from-source. The speech and
# vision adapters are already published as per-adapter GHCR images, matching
# standard stack's pull-first posture. The LLM path talks directly to the local Ollama
# service until a dedicated ghcr.io/open-nvr/ollama-adapter image is published.
# ==========================================

# Bounded per-container logs (see docs/OBSERVABILITY.md "Logs"): every
# service keeps a rolling ~30MB of its own history (3 x 10MB json files), so
# `docker logs --since 1h <name>` always has the recent story after an
# incident, and a chatty container can never fill the disk. Opt-in central
# viewer: `COMPOSE_PROFILES=logs` adds a localhost-only Dozzle at :9999.
x-default-logging: &svc-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ──────────────────────────────────────────────────────────────
  # Whisper STT — VOICE only. Pulled from GHCR. The image eagerly loads the
  # selected model on boot; first run may download faster-whisper weights into
  # the persisted cache, then later boots reuse them.
  # The speech-to-text adapter (whisper-adapter) moved to
  # docker-compose.apps.yml (2026-11-14): voice search on the search page
  # needs it whether or not anyone runs the agent, so it starts from that
  # file's `voice` profile as well as from `camera-agent`. The voice agent
  # still depends on it; start.sh adds the apps file whenever this one is
  # in the set.

  # ──────────────────────────────────────────────────────────────
  # Piper TTS — VOICE only. Pulled from GHCR. The default voice files live in
  # the sibling ai-adapter checkout and are mounted where the current
  # PiperService resolves MODEL_WEIGHTS_DIR/piper.
  # ──────────────────────────────────────────────────────────────
  # One-shot: fetch the Piper voice into a named volume on first up.
  # The piper image ships NO voice (voices are large and interchangeable),
  # and the old bind mount (../ai-adapter/model_weights/piper) silently
  # expected the operator to have the ai-adapter repo checked out as a
  # sibling AND to have manually downloaded the voice — nobody is told to,
  # so on a stock install the adapter booted healthy and then 503'd every
  # synthesis forever ("voice replies unavailable"). Same init pattern as
  # yolov8-weights-init: idempotent (skips when the files are present and
  # non-empty), so restarts cost nothing. Needs internet on FIRST up only
  # (huggingface.co, like the Ollama model pull); air-gapped installs
  # pre-place the two files in the opennvr_piper_voices volume instead.
  piper-voices-init:
    profiles: [camera-agent]
    image: curlimages/curl:8.10.1
    container_name: opennvr_piper_voices_init
    logging: *svc-logs
    restart: "no"
    # The curl image runs as a non-root user, but a fresh named volume is
    # root-owned — without this the very first download fails on a
    # permission error.
    user: "0:0"
    # BEST-EFFORT by design: this init must ALWAYS exit 0. The adapter
    # (and the whole voice profile behind it) depends_on this completing —
    # if a download failure propagated, a machine without internet on
    # first up would lose the entire voice stack instead of just the
    # voice. On failure the adapter boots voiceless-but-healthy (exactly
    # the pre-init behavior, with a clear log) and the next
    # ``docker compose up`` retries the download.
    # List-form command (see yolov8-weights-init's NOTE): a string command
    # gets word-split and only the first token runs.
    entrypoint: ["sh", "-c"]
    command:
      - |
        # PIPER_VOICE (.env) names any voice from rhasspy/piper-voices as
        # <lang>_<REGION>-<name>-<quality>; the download path follows from
        # it. The default is a MEDIUM voice on purpose: on CPU the quality
        # tier is the cost — libritts-high took ~4 cores and 25 s for two
        # sentences on the field box; medium is 2-3x cheaper and as clear.
        # The agent asks for this voice per request (AppConfig.piper_voice).
        VOICE=${PIPER_VOICE:-en_US-lessac-medium}
        LANG_REGION=$${VOICE%%-*}; REST=$${VOICE#*-}
        NAME=$${REST%-*}; QUALITY=$${REST##*-}; LANG_CODE=$${LANG_REGION%%_*}
        BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/$$LANG_CODE/$$LANG_REGION/$$NAME/$$QUALITY
        cd /voices || exit 0
        for f in "$$VOICE.onnx" "$$VOICE.onnx.json"; do
          if [ -s "$$f" ]; then
            echo "$$f already present ($$(wc -c < "$$f") bytes); skipping."
            continue
          fi
          echo "Downloading $$f ..."
          if curl -fSL --retry 3 -o "$$f.part" "$$BASE/$$f"; then
            mv "$$f.part" "$$f"
            echo "Wrote $$(wc -c < "$$f") bytes to /voices/$$f."
          else
            rm -f "$$f.part"
            echo "WARNING: could not download $$f (no internet?). Voice replies"
            echo "stay text-only until it succeeds — re-run 'docker compose up'"
            echo "with internet, or place the file in the opennvr_piper_voices"
            echo "volume manually."
          fi
        done
        exit 0
    volumes:
      - opennvr_piper_voices:/voices

  piper-adapter:
    profiles: [camera-agent]
    image: ghcr.io/open-nvr/piper-adapter:${ADAPTER_TAG:-latest}
    container_name: opennvr_piper_adapter
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      piper-voices-init:
        condition: service_completed_successfully
    environment:
      - OPENNVR_ADAPTER_TOKEN=${INTERNAL_API_KEY}
      # The voice used when a request names none (the agent names one),
      # and the ONNX thread cap per synthesis: one utterance fanning
      # across every core is what starved the detector on a 4-core box.
      # Both honoured by adapter releases from 1.0.1 on.
      - OPENNVR_PIPER_VOICE=${PIPER_VOICE:-en_US-lessac-medium}
      - OPENNVR_PIPER_THREADS=${PIPER_THREADS:-2}
    volumes:
      # The adapter resolves MODEL_WEIGHTS_DIR/piper -> /app/model_weights/piper.
      # Custom/extra voices: drop .onnx + .onnx.json pairs into the
      # opennvr_piper_voices volume (or override this mount with a bind).
      - opennvr_piper_voices:/app/model_weights/piper:ro
      - opennvr_piper_audio:/app/audio
    networks:
      - opennvr_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, sys; sys.exit(0 if httpx.get('http://127.0.0.1:9001/health', timeout=2).status_code == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10

  # The captioner (caption-adapter) and its registration job moved to
  # docker-compose.apps.yml: core's visit descriptions need it whether or
  # not anyone runs the agent, and an install without this file had no
  # captioner at all (Ventuno Q handover install, 2026-11-13). The agent
  # still depends on it, so start.sh adds the apps file whenever this one
  # is in the set. The agent's LLM on the qualcomm flavour is that same
  # container (LLM_BASE_URL=http://caption-adapter:9006).

  # Register piper with KAI-C too (whisper has its own job beside it in
  # docker-compose.apps.yml). The camera agent calls whisper/piper
  # DIRECTLY (not through KAI-C), so this registration is purely for
  # OBSERVABILITY: registered adapters get the 60 s health + /metrics
  # poll, show on the AI Adapters page (up/down, p95, domain series like
  # audio realtime-factor), and count in kaic_adapter_up — a
  # silently-503ing piper becomes a red row instead of a mystery.
  voice-adapters-register:
    profiles: [camera-agent]
    image: alpine:3.20
    container_name: opennvr_voice_register
    logging: *svc-logs
    restart: "no"
    depends_on:
      opennvr-core:
        condition: service_healthy
      piper-adapter:
        condition: service_healthy
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command:
      - sh
      - -c
      - |
        set -e
        register() {
          name="$$1"; url="$$2"; i=0
          while [ $$i -lt 30 ]; do
            if wget -q -O- \
                 --header="Content-Type: application/json" \
                 --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
                 --post-data="{\"name\":\"$$name\",\"url\":\"$$url\"}" \
                 http://opennvr-core:8100/api/v1/adapters/register >/dev/null 2>&1; then
              echo "Registered '$$name' -> $$url with KAI-C."; return 0
            fi
            i=$$((i+1)); echo "register '$$name' attempt $$i/30 failed; retry in 5s"; sleep 5
          done
          echo "WARN: could not register '$$name' — it won't appear on the AI health panel." >&2
          return 0
        }
        register piper http://piper-adapter:9001
    networks:
      - opennvr_internal

  # ──────────────────────────────────────────────────────────────
  # Ollama — local LLM runtime (VOICE + CHAT). Official upstream image: stable,
  # well-maintained, identical to what developers run on their laptops today.
  # ──────────────────────────────────────────────────────────────
  ollama:
    profiles: [camera-agent, camera-agent-chat]
    image: ollama/ollama:0.21.2
    container_name: opennvr_ollama
    logging: *svc-logs
    restart: unless-stopped
    environment:
      # Keep the model resident in RAM indefinitely. Without this Ollama
      # unloads after 5 min idle, so the next turn pays a cold reload +
      # full prompt prefill and can blow past the request timeout. Warm,
      # turns return in seconds instead of ~a minute. On a VERY RAM-limited
      # box, set OLLAMA_KEEP_ALIVE=5m in .env to free the model's RAM when
      # idle (at the cost of a cold reload on the next turn).
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      # Limited-hardware guards: load one model, serve one request at a time so
      # a weak CPU box isn't oversubscribed. Raise on bigger machines.
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - opennvr_ollama_models:/root/.ollama
    networks:
      - opennvr_internal
      # footage-search (docker-compose.apps.yml) calls ollama from the
      # internal apps network.
      - opennvr_apps
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ──────────────────────────────────────────────────────────────
  # Ollama model pull — one-shot (VOICE + CHAT). Runs AUTOMATICALLY on ``up``
  # because the agent depends_on it (service_completed_successfully), so the
  # model is present before the agent starts. Pulls OLLAMA_MODEL (the LLM
  # brain) and, when CAPTION_ADAPTER=ollamavlm, OLLAMA_VLM_MODEL (the eyes)
  # — previously only the LLM was pre-pulled, so the FIRST describe question
  # cold-pulled the VLM through the adapter: fine-ish for moondream (1.7GB),
  # but a picked gemma3:4b / qwen2.5vl meant minutes of 503s that read as
  # "the vision model doesn't work". The VLM pull is best-effort: a typo'd
  # model name must not take down the whole agent profile — the adapter's
  # auto-pull remains the fallback and the failure is named in the log.
  # ──────────────────────────────────────────────────────────────
  ollama-model-pull:
    profiles: [camera-agent, camera-agent-chat]
    image: ollama/ollama:0.21.2
    container_name: opennvr_ollama_pull
    logging: *svc-logs
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        set -e
        MODEL="$${OLLAMA_MODEL:-granite4:micro}"
        echo "Pulling Ollama model: $$MODEL"
        OLLAMA_HOST=http://ollama:11434 ollama pull "$$MODEL"
        echo "LLM model ready."
        if [ "$${CAPTION_ADAPTER}" = "ollamavlm" ] && [ -n "$${OLLAMA_VLM_MODEL}" ]; then
          echo "Pulling vision model: $${OLLAMA_VLM_MODEL}"
          if OLLAMA_HOST=http://ollama:11434 ollama pull "$${OLLAMA_VLM_MODEL}"; then
            echo "Vision model ready."
          else
            echo "WARN: could not pull vision model '$${OLLAMA_VLM_MODEL}' —" >&2
            echo "describe answers stay degraded until the adapter's auto-pull succeeds" >&2
            echo "or you pull it manually (ollama pull $${OLLAMA_VLM_MODEL})." >&2
          fi
        fi
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-granite4:micro}
      - OLLAMA_VLM_MODEL=${OLLAMA_VLM_MODEL:-moondream}
      - CAPTION_ADAPTER=${CAPTION_ADAPTER:-moondream}
    volumes:
      - opennvr_ollama_models:/root/.ollama
    networks:
      - opennvr_internal

  # ──────────────────────────────────────────────────────────────
  # VOICE — the hands-free agent. Built from local source for v0.1.
  # config.yml is generated from config.docker.yml by the init container so
  # secrets come from .env, not the repo.
  # ──────────────────────────────────────────────────────────────
  # ──────────────────────────────────────────────────────────────
  # Self-signed TLS pair for the agent's LAN-exposed listener — the exact
  # mediamtx-certs-init pattern. Shared by the voice and chat variants
  # (both profiles, one cert dir; they never run simultaneously on 9100).
  # ──────────────────────────────────────────────────────────────
  camera-agent-certs-init:
    profiles: [camera-agent, camera-agent-chat]
    image: alpine/openssl:3.3.2
    entrypoint: []
    container_name: opennvr_camera_agent_certs_init
    logging: *svc-logs
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        if [ -f /certs/server.crt ] && [ -f /certs/server.key ]; then
          echo "camera-agent certs already present; skipping."
          exit 0
        fi
        umask 077
        SAN="DNS:localhost,DNS:camera-agent,DNS:camera-agent-chat,DNS:opennvr.local,IP:127.0.0.1,IP:::1"
        if [ -n "$${OPENNVR_HOST_IP}" ]; then
          SAN="$${SAN},IP:$${OPENNVR_HOST_IP}"
        fi
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
          -keyout /certs/server.key -out /certs/server.crt \
          -subj "/CN=opennvr-camera-agent" \
          -addext "subjectAltName=$${SAN}" \
          -addext "basicConstraints=critical,CA:FALSE" \
          -addext "keyUsage=critical,digitalSignature,keyEncipherment" \
          -addext "extendedKeyUsage=serverAuth"
        chmod 0644 /certs/server.crt
        echo "Wrote /certs/server.{crt,key} with SAN=$${SAN}"
    environment:
      - OPENNVR_HOST_IP=${OPENNVR_HOST_IP:-}
    volumes:
      - ./agent-certs/camera-agent:/certs

  camera-agent-config-init:
    profiles: [camera-agent]
    image: alpine:3.20
    container_name: opennvr_camera_agent_config_init
    logging: *svc-logs
    command:
      - sh
      - -c
      - |
        set -e
        # busybox sed substitutes only the named variables below, leaving other
        # ``$`` sigils in YAML multiline strings untouched (no envsubst / apk fetch,
        # which some operator ISPs filter).
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        lhost=$$(sed_esc "$${CAMERA_AGENT_LISTEN_HOST}")
        omodel=$$(sed_esc "$${OLLAMA_MODEL}")
        ourl=$$(sed_esc "$${OLLAMA_URL}")
        cadapter=$$(sed_esc "$${CAPTION_ADAPTER}")
        ouiurl=$$(sed_esc "$${OPENNVR_UI_URL}")
        lprewarm=$$(sed_esc "$${LLM_PREWARM:-true}")
        lprov=$$(sed_esc "$${LLM_PROVIDER:-ollama}")
        lburl=$$(sed_esc "$${LLM_BASE_URL}")
        lmodel=$$(sed_esc "$${LLM_MODEL:-$${OLLAMA_MODEL}}")
        lwin=$$(sed_esc "$${LLM_WINDOW_TOKENS:-0}")
        lfurl=$$(sed_esc "$${LLM_FALLBACK_URL}")
        lfmodel=$$(sed_esc "$${LLM_FALLBACK_MODEL:-granite4:micro}")
        # The NPU adapter's chat endpoint sits behind the stack's own
        # token; a cloud provider's key is LLM_API_KEY in .env.
        lkey="$${LLM_API_KEY}"
        case "$${LLM_BASE_URL}" in http://caption-adapter:*) [ -n "$$lkey" ] || lkey="$${INTERNAL_API_KEY}" ;; esac
        lkey=$$(sed_esc "$$lkey")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            -e "s/[$$][{]CAMERA_AGENT_LISTEN_HOST[}]/$$lhost/g" \
            -e "s/[$$][{]OLLAMA_MODEL[}]/$$omodel/g" \
            -e "s/[$$][{]OLLAMA_URL[}]/$$ourl/g" \
            -e "s/[$$][{]CAPTION_ADAPTER[}]/$$cadapter/g" \
            -e "s/[$$][{]OPENNVR_UI_URL[}]/$$ouiurl/g" \
            -e "s/[$$][{]LLM_PREWARM[}]/$$lprewarm/g" \
            -e "s/[$$][{]LLM_PROVIDER[}]/$$lprov/g" \
            -e "s/[$$][{]LLM_BASE_URL[}]/$$lburl/g" \
            -e "s/[$$][{]LLM_API_KEY[}]/$$lkey/g" \
            -e "s/[$$][{]LLM_MODEL[}]/$$lmodel/g" \
            -e "s/[$$][{]LLM_WINDOW_TOKENS[}]/$$lwin/g" \
            -e "s/[$$][{]LLM_FALLBACK_URL[}]/$$lfurl/g" \
            -e "s/[$$][{]LLM_FALLBACK_MODEL[}]/$$lfmodel/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (voice) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CAMERA_AGENT_LISTEN_HOST=0.0.0.0
      - OLLAMA_MODEL=${OLLAMA_MODEL:-granite4:micro}
      - LLM_PREWARM=${LLM_PREWARM:-true}
      # The LLM provider (.env): ollama, or openai for any OpenAI-compatible
      # endpoint — on the qualcomm flavour start.sh points it at the NPU
      # caption adapter's /v1/chat/completions.
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_WINDOW_TOKENS=${LLM_WINDOW_TOKENS:-0}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL:-}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-granite4:micro}
      # Where the agent reaches the LLM runtime. Default: the bundled
      # ollama container. Set OLLAMA_EXTERNAL_URL in .env (e.g.
      # http://host.docker.internal:11434 for native Ollama on the host
      # — the Metal/GPU path on macOS/Windows) and start with the
      # docker-compose.camera-agent.external-llm.yml overlay to skip
      # the bundled container entirely.
      - OLLAMA_URL=${OLLAMA_EXTERNAL_URL:-http://ollama:11434}
      - CAPTION_ADAPTER=${CAPTION_ADAPTER:-moondream}
      # Host origin the operator's browser reaches OpenNVR at (opennvr-core is
      # published on 127.0.0.1:8000). Drives the skills-panel "Enable →" /
      # "install the <App> app" deep-links. Override for LAN/remote installs,
      # e.g. OPENNVR_UI_URL=https://nvr.example in .env.
      - OPENNVR_UI_URL=${OPENNVR_UI_URL:-http://localhost:8000}
    volumes:
      - ./examples/camera-agent:/template:ro
      - opennvr_camera_agent_config:/generated

  camera-agent:
    profiles: [camera-agent]
    # Same repo + release cadence as opennvr-core, so it shares CORE_TAG.
    image: ghcr.io/open-nvr/camera-agent:${CORE_TAG:-latest}
    container_name: opennvr_camera_agent
    # The hostname the agent sees itself as = the service name other
    # containers resolve and the certificate's SAN (default would be the
    # bare container id, which neither resolves nor matches the cert).
    hostname: camera-agent
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      camera-agent-config-init:
        condition: service_completed_successfully
      camera-agent-certs-init:
        condition: service_completed_successfully
      whisper-adapter:
        condition: service_healthy
      piper-adapter:
        condition: service_healthy
      caption-adapter:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
      opennvr-core:
        condition: service_healthy
    ports:
      # LAN edge (https) — bind host follows nginx; auth: OpenNVR login +
      # device firewall (auth_mode: opennvr in config.docker.yml).
      - "${NGINX_BIND_HOST:-0.0.0.0}:9100:9100"
    environment:
      # Alarm / watch / report time windows are times of DAY ("after
      # 12:10 pm") compared against THIS container's clock. Without TZ the
      # container runs UTC and every spoken window fires hours off — an
      # "after 12:10 pm" alarm on an IST site stayed dormant until
      # 12:10 UTC (= 5:40 pm local). Must match the mediamtx/core TZ.
      - TZ=${TZ:-UTC}
      # The Piper voice the agent asks for (see piper-voices-init).
      - PIPER_VOICE=${PIPER_VOICE:-en_US-lessac-medium}
    volumes:
      - opennvr_camera_agent_config:/app/config:ro
      - ./agent-certs/camera-agent:/certs:ro
    command:
      - --config
      - /app/config/config.yml
    networks:
      - opennvr_internal

  # ──────────────────────────────────────────────────────────────
  # CHAT — the same agent in text mode (POST /ask): YOLOv8 + caption/VQA +
  # small LLM, NO Whisper/Piper. Lighter; type instead of speak. config.yml is
  # generated from config.docker.chat.yml by the init container below.
  # ──────────────────────────────────────────────────────────────
  camera-agent-config-init-chat:
    profiles: [camera-agent-chat]
    image: alpine:3.20
    container_name: opennvr_camera_agent_config_init_chat
    logging: *svc-logs
    command:
      - sh
      - -c
      - |
        set -e
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        lhost=$$(sed_esc "$${CAMERA_AGENT_LISTEN_HOST}")
        omodel=$$(sed_esc "$${OLLAMA_MODEL}")
        ourl=$$(sed_esc "$${OLLAMA_URL}")
        cadapter=$$(sed_esc "$${CAPTION_ADAPTER}")
        ouiurl=$$(sed_esc "$${OPENNVR_UI_URL}")
        lprewarm=$$(sed_esc "$${LLM_PREWARM:-true}")
        lprov=$$(sed_esc "$${LLM_PROVIDER:-ollama}")
        lburl=$$(sed_esc "$${LLM_BASE_URL}")
        lmodel=$$(sed_esc "$${LLM_MODEL:-$${OLLAMA_MODEL}}")
        lwin=$$(sed_esc "$${LLM_WINDOW_TOKENS:-0}")
        lfurl=$$(sed_esc "$${LLM_FALLBACK_URL}")
        lfmodel=$$(sed_esc "$${LLM_FALLBACK_MODEL:-granite4:micro}")
        # The NPU adapter's chat endpoint sits behind the stack's own
        # token; a cloud provider's key is LLM_API_KEY in .env.
        lkey="$${LLM_API_KEY}"
        case "$${LLM_BASE_URL}" in http://caption-adapter:*) [ -n "$$lkey" ] || lkey="$${INTERNAL_API_KEY}" ;; esac
        lkey=$$(sed_esc "$$lkey")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            -e "s/[$$][{]CAMERA_AGENT_LISTEN_HOST[}]/$$lhost/g" \
            -e "s/[$$][{]OLLAMA_MODEL[}]/$$omodel/g" \
            -e "s/[$$][{]OLLAMA_URL[}]/$$ourl/g" \
            -e "s/[$$][{]CAPTION_ADAPTER[}]/$$cadapter/g" \
            -e "s/[$$][{]OPENNVR_UI_URL[}]/$$ouiurl/g" \
            -e "s/[$$][{]LLM_PREWARM[}]/$$lprewarm/g" \
            -e "s/[$$][{]LLM_PROVIDER[}]/$$lprov/g" \
            -e "s/[$$][{]LLM_BASE_URL[}]/$$lburl/g" \
            -e "s/[$$][{]LLM_API_KEY[}]/$$lkey/g" \
            -e "s/[$$][{]LLM_MODEL[}]/$$lmodel/g" \
            -e "s/[$$][{]LLM_WINDOW_TOKENS[}]/$$lwin/g" \
            -e "s/[$$][{]LLM_FALLBACK_URL[}]/$$lfurl/g" \
            -e "s/[$$][{]LLM_FALLBACK_MODEL[}]/$$lfmodel/g" \
            < /template/config.docker.chat.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (chat) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CAMERA_AGENT_LISTEN_HOST=0.0.0.0
      - OLLAMA_MODEL=${OLLAMA_MODEL:-granite4:micro}
      - LLM_PREWARM=${LLM_PREWARM:-true}
      # The LLM provider (.env): ollama, or openai for any OpenAI-compatible
      # endpoint — on the qualcomm flavour start.sh points it at the NPU
      # caption adapter's /v1/chat/completions.
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_WINDOW_TOKENS=${LLM_WINDOW_TOKENS:-0}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL:-}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-granite4:micro}
      # See the voice config-init: bundled ollama by default, or the
      # operator's external runtime via OLLAMA_EXTERNAL_URL in .env.
      - OLLAMA_URL=${OLLAMA_EXTERNAL_URL:-http://ollama:11434}
      - CAPTION_ADAPTER=${CAPTION_ADAPTER:-moondream}
      # Host origin the operator's browser reaches OpenNVR at (opennvr-core is
      # published on 127.0.0.1:8000). Drives the skills-panel "Enable →" /
      # "install the <App> app" deep-links. Override for LAN/remote installs,
      # e.g. OPENNVR_UI_URL=https://nvr.example in .env.
      - OPENNVR_UI_URL=${OPENNVR_UI_URL:-http://localhost:8000}
    volumes:
      - ./examples/camera-agent:/template:ro
      - opennvr_camera_agent_config_chat:/generated

  camera-agent-chat:
    profiles: [camera-agent-chat]
    build:
      context: .
      dockerfile: examples/camera-agent/Dockerfile
    image: opennvr/camera-agent:local-build
    pull_policy: ${APPS_PULL_POLICY:-build}
    container_name: opennvr_camera_agent_chat
    hostname: camera-agent-chat
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      camera-agent-config-init-chat:
        condition: service_completed_successfully
      camera-agent-certs-init:
        condition: service_completed_successfully
      # Wait for the selected caption/VQA adapter to be healthy and
      # registered before the first turn (else describe_camera falls back to the
      # detector until the selected adapter comes up).
      caption-adapter:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
      opennvr-core:
        condition: service_healthy
    ports:
      # LAN edge (https) — see the voice variant's comment.
      - "${NGINX_BIND_HOST:-0.0.0.0}:9100:9100"
    environment:
      # Same rule as the voice agent: time windows tick in the site's zone.
      - TZ=${TZ:-UTC}
    volumes:
      - opennvr_camera_agent_config_chat:/app/config:ro
      - ./agent-certs/camera-agent:/certs:ro
    command:
      - --config
      - /app/config/config.yml
    networks:
      - opennvr_internal

  # Core calls the agent's contract (/health, /state) over https — the
  # agent terminates TLS itself with the self-signed certificate above.
  # Mounting the certificate directory read-only under core's app-certs
  # trust directory (services/app_tls.py) lets core verify it; the
  # hostname must still match the SAN, hence the service name above.
  # The key inside is 0600 root: unreadable to core's user, and unneeded.
  opennvr-core:
    volumes:
      - ./agent-certs/camera-agent:/etc/opennvr/app-certs/camera-agent:ro

volumes:
  # opennvr_footage_search_data is gone. It carried footage-search's
  # SQLite index, mounted read-only here so the agent's search_footage
  # tool could fall back to it during an outage. footage-search 2.0.0
  # deleted that index, so nothing writes the file: a fallback would
  # have served whatever was true on the day of the upgrade, during an
  # outage, when nobody is positioned to notice the dates are months
  # old. search_footage is answered from the event store and says so
  # plainly when it cannot be reached. An upgraded install can reclaim
  # the old volume with `docker volume rm opennvr_footage_search_data`.
  # Ollama model store — persisted so the LLM survives ``compose down``.
  opennvr_ollama_models:
  # Piper writes generated WAVs here before optionally returning inline
  # base64 audio to the camera-agent.
  # Piper voice files, fetched once by piper-voices-init.
  opennvr_piper_voices:
  opennvr_piper_audio:
  # Generated voice config.yml (mounted read-only by the camera-agent).
  opennvr_camera_agent_config:
  # Generated chat config.yml for the camera-agent-chat profile.
  opennvr_camera_agent_config_chat:
