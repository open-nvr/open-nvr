# ─────────────────────────────────────────────────────────────────────
# OpenNVR AI Adapters — the curated index of installable models.
#
# Apps have had a catalog since the beginning; adapters had none, so a
# third party with a working model had nowhere to be listed and an
# operator had no way to find one. This is that catalog, served at
# GET /api/v1/adapters/index.
#
# AN APP ASKS FOR A TASK, NEVER FOR AN ADAPTER BY NAME. `requires_tasks`
# in an AppManifest names a task convention (§5.x); any adapter that
# advertises it can satisfy it. That is the whole point of the contract:
# a better plate reader is a drop-in for the shipped one, and an
# operator swaps it without touching a single app.
#
# EVERY FIELD BELOW THE HEADER IS READ FROM THE ADAPTER'S OWN
# /capabilities. Generate an entry rather than writing one:
#
#     opennvr-adapter listing . --image ghcr.io/you/my-model:1.0.0
#
# That way a listing cannot claim a task the adapter does not advertise,
# a permission it does not request, or a fingerprint it does not
# compute. scripts/validate_adapters_index.py enforces the shape; see
# docs/CONTRIBUTING_ADAPTERS.md for the review a listing gets.
#
# `tier` records the relationship, not the quality:
#   first_party — built and published by OpenNVR from the ai-adapter
#                 repository; supported with the platform.
#   community   — built by somebody else, reviewed and listed here. The
#                 image is theirs; the contract is what we check.

- id: yolov8-object-detection
  name: YOLOv8 Object Detection
  summary: General object detection — people, vehicles, animals and the rest of COCO. The default detector most apps ride.
  version: "1.0.0"
  tier: first_party
  image: ghcr.io/open-nvr/yolov8-adapter:latest
  tasks_advertised: [object_detection]
  model:
    framework: onnxruntime
    modalities_in: [image]
    modalities_out: [bbox_classes]
    fingerprinted: true
  permissions:
    gpu: false
    network_egress: []
    host_filesystem: []
  scheduling: { max_inflight: 1, fair_queuing: per_camera }
  supports_stream: true
  license: AGPL-3.0
  vendor: open-nvr
  model_card_url: https://github.com/ultralytics/ultralytics
  docs_url: https://github.com/open-nvr/ai-adapter/blob/main/adapters/yolov8/README.md
  source: https://github.com/open-nvr/ai-adapter/tree/main/adapters/yolov8
  contact: https://github.com/open-nvr/ai-adapter/issues

