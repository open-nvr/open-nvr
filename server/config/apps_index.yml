- id: license-plate-recognition
  # ANPR leads: it is the name most of the world uses for this (UK, EU,
  # India, AU), with the spelled-out term kept for newcomers and for US
  # readers who know it as LPR/ALPR. The nav page carries the same token
  # ("Vehicles (ANPR)") so the app and the surface it lights up read as
  # one thing. The id is unchanged — it is a key, not a label.
  name: ANPR — License Plate Recognition
  summary: Reads license plates via a YOLOv8 to crop to fast-plate-ocr chain and routes severity through allow/deny watchlists.
  category: vehicle
  version: "1.0.0"
  image: ghcr.io/open-nvr/license-plate-recognition:latest
  build_context: examples/license-plate-recognition
  requires_tasks: [object_detection, license_plate_recognition]
  # RFC-0002 Phase 3 (decision 7): adapters that must be provisioned
  # WITH the app. The overlay ships fast-plate-ocr-adapter + its
  # register sidecar; the one-click reconciler ups it alongside the app
  # and refcounts it across apps on uninstall. yolov8 = standard stack.
  requires_adapters: [fast_plate_ocr]
  emits: [plate_read, plate_expected, plate_watchlist]
  docs_url: https://github.com/open-nvr/open-nvr/blob/main/examples/license-plate-recognition/README.md
  author: OpenNVR
  contact: https://github.com/open-nvr/open-nvr/issues
  source: https://github.com/open-nvr/open-nvr/tree/main/examples/license-plate-recognition
  network_egress: []
  install:
    compose: |
      # INFORMATIONAL — this service already ships in
      # docker-compose.apps.yml (with its config-init companion and
      # named config volume); you do NOT paste this anywhere. Run the
      # command below and compose brings it up from the shipped overlay.
      services:
        license-plate-recognition:
          profiles: [apps]
          image: ${LICENSE_PLATE_RECOGNITION_IMAGE:-opennvr/license-plate-recognition:local-build}
          restart: unless-stopped
          environment:
            - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
            - NATS_URL=nats://nats:4222
            - OPENNVR_URL=http://opennvr-core:8000
          expose:
            - "9205"
          networks:
            - opennvr_internal
    command: docker compose -f docker-compose.yml -f docker-compose.apps.yml --profile apps up -d license-plate-recognition

- id: gate-controller
  name: Gate Controller
  summary: Opens the barrier for allowed vehicles. Drives dry contact (GPIO), an IP relay (Shelly, Tasmota, ESPHome), Modbus or an ONVIF Profile C door controller from the LPR app's access.decided.v1 allow decisions; deny and unknown fail closed. Live gate state, hold-open schedules, manual control and a line for every decision.
  category: automation
  version: "1.1.0"
  image: ghcr.io/open-nvr/gate-controller:latest
  build_context: examples/gate-controller
  # No inference and no adapters — this app is bus + wiring only. Pair
  # it with license-plate-recognition (barrier_mode: registered).
  requires_tasks: []
  emits: [barrier_opened, barrier_fault, barrier_held_open, barrier_refused]
  docs_url: https://github.com/open-nvr/open-nvr/blob/main/examples/gate-controller/README.md
  author: OpenNVR
  contact: https://github.com/open-nvr/open-nvr/issues
  source: https://github.com/open-nvr/open-nvr/tree/main/examples/gate-controller
  # The wiring reaches the site's own barrier hardware on the LAN, which
  # is not internet egress: the transports talk to a relay, a PLC or a
  # door controller the operator already owns.
  network_egress: []
  install:
    compose: |
      # INFORMATIONAL — this service already ships in
      # docker-compose.apps.yml (with its config-init companion and
      # named config volume); you do NOT paste this anywhere. Run the
      # command below and compose brings it up from the shipped overlay.
      services:
        gate-controller:
          profiles: [apps]
          image: ${GATE_CONTROLLER_IMAGE:-opennvr/gate-controller:local-build}
          restart: unless-stopped
          environment:
            - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
            - NATS_URL=nats://nats:4222
            - OPENNVR_URL=http://opennvr-core:8000
          expose:
            - "9210"
          networks:
            - opennvr_internal
    command: docker compose -f docker-compose.yml -f docker-compose.apps.yml --profile apps up -d gate-controller

