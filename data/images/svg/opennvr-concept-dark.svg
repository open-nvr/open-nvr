<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="t d">
<title id="t">OpenNVR: swap the model, nothing else on the wire changes</title>
<desc id="d">Your cameras feed Records (always on, never gated), then Watches (a cheap always-on detector), then Events (one bus everything listens to), then Apps and the assistant. Watches asks KAI-C, the socket, for a task. A model adapter plugs into KAI-C and is checked (weights fingerprint, declared permissions, local-only policy) before it is trusted. The animation unplugs YOLOv8 and plugs in your own model: the AI wire pauses while recording continues, the new adapter is verified, then serving resumes.</desc>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/></filter>
</defs>
<style>
/*PALETTE*/svg{--card:#0d1117;--cardline:#232c3a;--box:#141c28;--boxline:#2a3648;--ink:#e6edf3;--muted:#9fb0c6;--faint:#7d8fa8;--wire:#45566e;--blue:#4fb3ff;--green:#3ee08f;--amber:#f5b544;--kaic:#172234;--kaicline:#3a4d68;--slot:#6f86a8;--chip:#172234;--chipline:#2c3b52;--ok:#0f2a20;--okline:#1f5f44;--oktext:#3ee08f;--warn:#2a2210;--warnline:#6b5420}/*END*/
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.cardbg{fill:var(--card);stroke:var(--cardline)}
.box{fill:var(--box);stroke:var(--boxline);stroke-width:1.5;filter:url(#sh)}
.boxhi{fill:var(--box);stroke:var(--blue);stroke-width:2;filter:url(#sh)}
.ico{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ink{fill:var(--ink)}.mut{fill:var(--muted)}.fnt{fill:var(--faint)}.blu{fill:var(--blue)}.grn{fill:var(--green)}.amb{fill:var(--amber)}.okt{fill:var(--oktext)}
.knock{fill:var(--card)}
.wire{fill:none;stroke:var(--wire);stroke-width:3}
.flow{fill:none;stroke:var(--blue);stroke-width:3;stroke-dasharray:10 22;animation:kDash 1.2s linear infinite}
.arrow{fill:var(--wire)}
.kaic{fill:var(--kaic);stroke:var(--kaicline);stroke-width:1.5}
.slot{fill:var(--slot)}.hole{fill:var(--kaic)}
.plug{fill:var(--box);stroke:var(--blue);stroke-width:2.5}
.prong{fill:var(--slot)}
.empty{fill:none;stroke:var(--boxline);stroke-width:1.5;stroke-dasharray:6 6}
.chip{fill:var(--chip);stroke:var(--chipline)}
.okc{fill:var(--ok);stroke:var(--okline)}
.wrn{fill:var(--warn);stroke:var(--warnline)}
.boxf{fill:var(--box)}.hollow{fill:none;stroke:var(--faint);stroke-width:1.8}.ringg{fill:none;stroke:var(--green);stroke-width:2}
@keyframes kDash{to{stroke-dashoffset:-32}}
.tl{animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:ease;animation-fill-mode:both}
.aion{animation-name:kAiOn}@keyframes kAiOn{0%,23%{opacity:1}24.5%,38%{opacity:0}39.5%,73%{opacity:1}74.5%,88%{opacity:0}89.5%,100%{opacity:1}}
.mA{animation-name:kA}@keyframes kA{0%,23%{opacity:1;transform:none}26.5%,79%{opacity:0;transform:translateX(70px)}83%,100%{opacity:1;transform:none}}
.mB{animation-name:kB}@keyframes kB{0%,29%{opacity:0;transform:translateX(70px)}33%,73%{opacity:1;transform:none}76.5%,100%{opacity:0;transform:translateX(70px)}}
.serv{animation-name:kServ}@keyframes kServ{0%,23%{opacity:1}24%,38%{opacity:0}39%,73%{opacity:1}74%,88%{opacity:0}89%,100%{opacity:1}}
.unpl{animation-name:kUnpl}@keyframes kUnpl{0%,23%{opacity:0}24%,30.5%{opacity:1}31%,73%{opacity:0}74%,80.5%{opacity:1}81%,100%{opacity:0}}
.ver{animation-name:kVer}@keyframes kVer{0%,30.5%{opacity:0}31%,38%{opacity:1}39%,80.5%{opacity:0}81%,88%{opacity:1}89%,100%{opacity:0}}
.emp{animation-name:kEmp}@keyframes kEmp{0%,26.5%{opacity:0}27%,28.8%{opacity:1}29.3%,76.5%{opacity:0}77%,78.8%{opacity:1}79.3%,100%{opacity:0}}
.c1{animation-name:kC1}@keyframes kC1{0%,23%{opacity:1}24%,32%{opacity:0;transform:translateY(4px)}33.5%,73%{opacity:1;transform:none}74%,82%{opacity:0;transform:translateY(4px)}83.5%,100%{opacity:1;transform:none}}
.c2{animation-name:kC2}@keyframes kC2{0%,23%{opacity:1}24%,34%{opacity:0;transform:translateY(4px)}35.5%,73%{opacity:1;transform:none}74%,84%{opacity:0;transform:translateY(4px)}85.5%,100%{opacity:1;transform:none}}
.c3{animation-name:kC3}@keyframes kC3{0%,23%{opacity:1}24%,36%{opacity:0;transform:translateY(4px)}37.5%,73%{opacity:1;transform:none}74%,86%{opacity:0;transform:translateY(4px)}87.5%,100%{opacity:1;transform:none}}
.ring{transform-box:fill-box;transform-origin:center;animation:kRing 1.4s ease-out infinite}@keyframes kRing{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.blink{animation:kBlink .9s ease-in-out infinite}@keyframes kBlink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){*{animation-play-state:paused!important}}
</style>

<rect class="cardbg" x="0.5" y="0.5" width="1279" height="589" rx="20"/>
<text x="36" y="46" class="m fnt" font-size="11.5" font-weight="600" letter-spacing="1.8">OPENNVR · HOW IT FITS TOGETHER</text>

<!-- ===== main wire (always flowing) ===== -->
<path class="wire" d="M185 150 H255 M405 150 H475 M625 150 H715 M865 150 H962"/>
<path class="flow" d="M185 150 H255 M405 150 H475 M625 150 H715 M865 150 H962"/>
<polygon class="arrow" points="960,140 980,150 960,160"/>

<!-- ===== AI branch: Watches -> KAI-C ===== -->
<path class="wire" d="M550 208 V317 Q550 332 565 332 H600"/>
<path class="flow tl aion" d="M550 208 V317 Q550 332 565 332 H600"/>
<text x="538" y="296" class="m fnt" font-size="11" text-anchor="end">asks for a task:</text>
<text x="538" y="311" class="m blu" font-size="11" text-anchor="end">object_detection</text>

<!-- ===== top row nodes ===== -->
<!-- Your cameras -->
<rect class="box" x="35" y="92" width="150" height="116" rx="14"/>
<g class="ico" transform="translate(110 128)"><rect x="-26" y="-15" width="36" height="30" rx="5"/><circle cx="-8" cy="0" r="6"/><path d="M10 -6 L26 -14 V14 L10 6"/></g>
<text x="110" y="184" class="ink" font-size="17" font-weight="600" text-anchor="middle">Your cameras</text>
<text x="110" y="240" class="mut" font-size="13.5" text-anchor="middle">on a network with no way out</text>

<!-- Records -->
<rect class="box" x="255" y="92" width="150" height="116" rx="14"/>
<g class="ico" transform="translate(330 128)"><ellipse cx="0" cy="-15" rx="21" ry="7"/><path d="M-21 -15 V15 A21 7 0 0 0 21 15 V-15"/><path d="M-21 0 A21 7 0 0 0 21 0"/></g>
<text x="330" y="184" class="ink" font-size="17" font-weight="600" text-anchor="middle">Records</text>
<circle cx="390" cy="106" r="6" class="grn"/>
<g class="tl unpl"><circle class="ring ringg" cx="390" cy="106" r="6"/></g>
<text x="330" y="240" class="mut" font-size="13.5" text-anchor="middle">always, never gated</text>

<!-- Watches -->
<rect class="box" x="475" y="92" width="150" height="116" rx="14"/>
<g class="ico" transform="translate(550 128)"><path d="M-28 0 Q0 -24 28 0 Q0 24 -28 0 Z"/><circle cx="0" cy="0" r="8"/></g>
<text x="550" y="184" class="ink" font-size="17" font-weight="600" text-anchor="middle">Watches</text>
<circle cx="610" cy="106" r="6" class="grn"/>
<rect class="knock" x="430" y="226" width="240" height="20"/>
<text x="550" y="240" class="mut" font-size="13.5" text-anchor="middle">every camera, all the time, cheaply</text>

<!-- Events -->
<rect class="box" x="715" y="92" width="150" height="116" rx="14"/>
<g class="ico" transform="translate(790 128)"><path d="M-30 0 H30"/><circle cx="-16" cy="0" r="6" class="boxf"/><circle cx="0" cy="0" r="6" class="boxf"/><circle cx="16" cy="0" r="6" class="boxf"/><path d="M-16 -14 V-6 M0 6 V14 M16 -14 V-6"/></g>
<text x="790" y="184" class="ink" font-size="17" font-weight="600" text-anchor="middle">Events</text>
<text x="790" y="240" class="mut" font-size="13.5" text-anchor="middle">one bus, everything listens</text>

<!-- Apps & assistant -->
<rect class="boxhi" x="980" y="75" width="220" height="150" rx="16"/>
<g class="ico" transform="translate(1048 122)"><rect x="-22" y="-22" width="18" height="18" rx="3"/><rect x="4" y="-22" width="18" height="18" rx="3"/><rect x="-22" y="4" width="18" height="18" rx="3"/><path d="M13 5 V21 M5 13 H21"/></g>
<g class="ico" transform="translate(1128 120)"><path d="M-24 -18 H24 A4 4 0 0 1 28 -14 V10 A4 4 0 0 1 24 14 H-8 L-18 22 V14 H-24 A4 4 0 0 1 -28 10 V-14 A4 4 0 0 1 -24 -18 Z"/><path d="M-16 -6 H16 M-16 4 H6"/></g>
<text x="1090" y="182" class="ink" font-size="19" font-weight="700" text-anchor="middle">Apps &amp; assistant</text>
<text x="1090" y="206" class="mut" font-size="13.5" text-anchor="middle">the use case you defined</text>

<!-- ===== KAI-C: the socket ===== -->
<rect class="kaic" x="600" y="282" width="200" height="100" rx="12"/>
<text x="622" y="320" class="m blu" font-size="15" font-weight="600" letter-spacing="0.5">KAI-C</text>
<text x="622" y="344" class="mut" font-size="13.5">the socket</text>
<text x="622" y="366" class="m fnt" font-size="10.5">audits every call</text>
<g class="tl serv"><circle cx="776" cy="302" r="6" class="grn"/></g>
<g class="tl unpl"><circle cx="776" cy="302" r="5" class="hollow"/></g>
<g class="tl ver"><circle class="blink amb" cx="776" cy="302" r="6"/></g>
<rect class="slot" x="786" y="312" width="16" height="40" rx="3"/>
<rect class="hole" x="790" y="320" width="9" height="6" rx="1.5"/>
<rect class="hole" x="790" y="338" width="9" height="6" rx="1.5"/>

<!-- status chip under KAI-C -->
<g class="tl serv">
  <rect class="okc" x="636.5" y="392.5" width="127" height="23" rx="11.5"/>
  <circle cx="652" cy="404" r="4" class="grn"/>
  <text x="662" y="408" class="m okt" font-size="11" font-weight="600">serving · live</text>
</g>
<g class="tl unpl">
  <rect class="chip" x="580.5" y="392.5" width="239" height="23" rx="11.5"/>
  <circle cx="596" cy="404" r="4" class="hollow"/>
  <text x="606" y="408" class="m mut" font-size="11" font-weight="600">unplugged · recording continues</text>
</g>
<g class="tl ver">
  <rect class="wrn" x="614.5" y="392.5" width="171" height="23" rx="11.5"/>
  <circle cx="630" cy="404" r="4" class="amb"/>
  <text x="640" y="408" class="m amb" font-size="11" font-weight="600">verifying new adapter</text>
</g>

<!-- empty slot outline (seen while a model is out) -->
<g class="tl emp">
  <rect class="empty" x="812" y="302" width="120" height="60" rx="12"/>
  <rect class="empty" x="962" y="262" width="288" height="140" rx="14"/>
  <text x="1106" y="337" class="m fnt" font-size="11.5" text-anchor="middle">no model plugged in</text>
</g>

<!-- ===== Model A: YOLOv8 ===== -->
<g class="tl mA">
  <rect class="prong" x="795" y="321" width="20" height="5" rx="1"/>
  <rect class="prong" x="795" y="339" width="20" height="5" rx="1"/>
  <rect class="plug" x="812" y="302" width="120" height="60" rx="12"/>
  <text x="872" y="336" class="m blu" font-size="11" text-anchor="middle">yolov8-adapter</text>
  <path class="wire" d="M932 332 H962"/>
  <path class="flow" d="M932 332 H962"/>
  <rect class="box" x="962" y="262" width="288" height="140" rx="14"/>
  <text x="984" y="288" class="m fnt" font-size="10" font-weight="600" letter-spacing="1.2">ADAPTER · object_detection</text>
  <text x="984" y="320" class="ink" font-size="24" font-weight="700">YOLOv8</text>
  <text x="1086" y="320" class="m blu" font-size="12">ships with it</text>
  <text x="984" y="343" class="mut" font-size="13">ONNX · CPU or GPU · reference image</text>
  <text x="984" y="364" class="m fnt" font-size="11">sha256:3f9a…7c21</text>
</g>

<!-- ===== Model B: your model ===== -->
<g class="tl mB">
  <rect class="prong" x="795" y="321" width="20" height="5" rx="1"/>
  <rect class="prong" x="795" y="339" width="20" height="5" rx="1"/>
  <rect class="plug" x="812" y="302" width="120" height="60" rx="12"/>
  <text x="872" y="336" class="m blu" font-size="11" text-anchor="middle">my-adapter</text>
  <path class="wire" d="M932 332 H962"/>
  <path class="flow" d="M932 332 H962"/>
  <rect class="box" x="962" y="262" width="288" height="140" rx="14"/>
  <text x="984" y="288" class="m fnt" font-size="10" font-weight="600" letter-spacing="1.2">ADAPTER · object_detection</text>
  <text x="984" y="320" class="ink" font-size="24" font-weight="700">Your model</text>
  <text x="1124" y="320" class="m blu" font-size="12">your choice</text>
  <text x="984" y="343" class="mut" font-size="13">fine-tuned weights · kept private</text>
  <text x="984" y="364" class="m fnt" font-size="11">sha256:b71c…e409</text>
</g>

<!-- checks (reset on unplug, pass one by one) -->
<g class="m" font-size="10" font-weight="600">
  <g class="tl c1"><rect class="okc" x="984.5" y="373.5" width="66" height="19" rx="9.5"/><text x="994" y="386.5" class="okt">✓ sha256</text></g>
  <g class="tl c2"><rect class="okc" x="1056.5" y="373.5" width="92" height="19" rx="9.5"/><text x="1066" y="386.5" class="okt">✓ permissions</text></g>
  <g class="tl c3"><rect class="okc" x="1154.5" y="373.5" width="86" height="19" rx="9.5"/><text x="1164" y="386.5" class="okt">✓ local_only</text></g>
</g>

<text x="915" y="450" class="mut" font-size="14" text-anchor="middle">every model plugs in here — and is checked before it is trusted</text>

<!-- ===== headline ===== -->
<text x="640" y="514" class="ink" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="-0.3">Swap the model. Nothing else on the wire changes.</text>
<text x="640" y="546" class="mut" font-size="15" text-anchor="middle">An app asks for a task — never a model by name — so the plug is the only thing that moves.</text>
</svg>
