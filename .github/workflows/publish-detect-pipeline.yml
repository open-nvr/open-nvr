#
# Build + publish workflow for the ghcr.io/open-nvr/detect-pipeline image
# (the always-on Tier-0 detect service). docker-compose references this
# image so a normal install pulls it from GHCR instead of building the
# ffmpeg + opencv layers locally.
#
# Mirrors publish-images.yml (opennvr-core):
#   - PR touching detect-pipeline/** → run tests + build only, no push,
#     plus a container smoke that proves the import graph + ffmpeg resolve
#     inside the real /app layout (the "green tests, crashes on deploy" class).
#   - Push to any branch → build + push :<branch> and :sha-<short>.
#   - Tag v* / default branch → also :latest + semver tags (compose pins :latest).

name: publish-detect-pipeline

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "detect-pipeline/**"
      - ".github/workflows/publish-detect-pipeline.yml"
  workflow_dispatch:

concurrency:
  group: publish-detect-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Never publish from untested code — run the unit + real-ffmpeg suite first.
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ffmpeg so the real-ffmpeg integration tests actually run (they skip if absent).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install package + pytest
        run: pip install ./detect-pipeline pytest
      - name: Run tests
        run: cd detect-pipeline && python -m pytest -q

  build-and-push:
    name: detect-pipeline image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/open-nvr/detect-pipeline
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=OpenNVR detect-pipeline
            org.opencontainers.image.description=Always-on Tier-0 detection (motion, region, detect, track) per camera. Additive consumer of MediaMTX; publishes to the OpenNVR inference event bus.
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=OpenNVR

      - name: Build${{ github.event_name != 'pull_request' && ' + push' || ' (no push)' }}
        uses: docker/build-push-action@v5
        with:
          context: ./detect-pipeline
          file: detect-pipeline/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'pull_request' && 'ghcr.io/open-nvr/detect-pipeline:local-smoke' || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=detect-pipeline
          cache-to: type=gha,scope=detect-pipeline,mode=max

      # Prove the container's import graph + entrypoint + ffmpeg resolve inside
      # the real /app layout (catches a module missing from COPY, or ffmpeg not
      # installed — neither of which unit tests would catch).
      - name: Smoke-test the built image (PR only)
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ghcr.io/open-nvr/detect-pipeline:local-smoke
        run: |
          set -euo pipefail
          echo "== ffmpeg present =="
          docker run --rm "$IMAGE" ffmpeg -version | head -1
          echo "== import graph + manager builds (service disabled) =="
          docker run --rm -e DETECT_PIPELINE_ENABLED=false "$IMAGE" python -c "
          import detect_pipeline.run as r, detect_pipeline.bus as b
          cfg = r.config_from_env({'DETECT_PIPELINE_ENABLED': 'false'})
          mgr = r.build_manager(cfg, b.EventSink(lambda s, d: None))
          mgr.reconcile()  # disabled -> no discovery, no workers
          assert mgr.running_ids() == set()
          print('boot-graph ok')
          "
          echo "== console entrypoint is installed =="
          docker run --rm "$IMAGE" sh -c "command -v opennvr-tier0"
