#
# Release-pin verification (issue #212's failure class).
#
# A fresh install is `docker compose pull` of whatever .env.example pins —
# if any pinned ghcr.io/open-nvr image:tag doesn't exist, the very first
# user command dies. This gate makes that unmergeable/untaggable: it
# resolves every image reference in the compose files against the
# .env.example pins and asks GHCR whether each one is pullable.
#
# Runs on: PRs touching pins/compose (catch drift before merge), release
# tags (the last line of defense — fails the release if an image is
# missing), pushes to main touching the same files, and manual dispatch.

name: release-pins

on:
  pull_request:
    paths:
      - ".env.example"
      - "docker-compose*.yml"
      - "scripts/verify_release_pins.py"
      - ".github/workflows/release-pins.yml"
  # NB: no ``paths`` filter on push — GitHub applies push path filters to
  # both branches AND tags (see publish-images.yml's identical warning), so
  # a release tag on a commit that doesn't touch the pins would silently
  # skip the exact run that matters most. The script takes seconds; running
  # it on every main push and every tag is cheaper than one broken install.
  push:
    branches: [main]
  # On a release tag the check used to race the publish it was checking:
  # it fired ten seconds after the tag and found the core images missing
  # (every release so far), then went green on a manual rerun. Run it
  # when the publishes that build those images have finished instead.
  workflow_run:
    workflows: [publish-images, publish-detect-pipeline]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pins:
    name: pinned images exist on GHCR
    runs-on: ubuntu-latest
    # After a publish: only a successful one, and at the commit it built.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify every pinned image is pullable
        run: python3 scripts/verify_release_pins.py
