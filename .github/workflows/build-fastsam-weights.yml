#
# Build + publish workflow for ghcr.io/open-nvr/fastsam-weights.
#
# The gold-bar-desk app segments bars with FastSAM-s on onnxruntime.
# Ultralytics publishes the .pt, never the ONNX, so the graph is exported
# here once rather than by every operator, for the same reasons as
# build-yolo-pose-weights.yml (which this is a copy of): nowhere to
# download the ONNX from, and filtered networks that cannot reach PyPI or
# ultralytics.com at boot.
#
# Triggered on:
#   - Pull request touching examples/fastsam-weights/* or this file →
#     build only, no push. Catches a broken export before merge.
#   - Push to main → build + push :v<weights-tag> and :sha-<short>.
#   - Tag matching v* → also :latest.
#
# Architecture: linux/amd64 + linux/arm64. An ONNX graph is the same
# file on both, so the multi-arch manifest costs nothing extra — and an
# amd64-only manifest would abort `docker compose pull` for the WHOLE
# stack on an Apple Silicon Mac or a Pi, not just skip this image.

name: build-fastsam-weights

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "examples/fastsam-weights/**"
      - ".github/workflows/build-fastsam-weights.yml"
  pull_request:
    paths:
      - "examples/fastsam-weights/**"
      - ".github/workflows/build-fastsam-weights.yml"
  # Manual lever, so the weights can be re-published after an
  # Ultralytics assets release without bumping OpenNVR's own version.
  workflow_dispatch:
    inputs:
      weights_tag:
        # The ultralytics/assets RELEASE tag the .pt comes from, NOT
        # the Python `ultralytics` package version. Keep it aligned
        # with the FASTSAM_WEIGHTS_IMAGE default in
        # docker-compose.apps.yml, or operators pull a tag their
        # compose file does not ask for.
        description: "Ultralytics assets release tag (e.g. 8.3.0)"
        required: false
        default: "8.3.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Free up GHA runner disk space
        # The ultralytics base is ~3 GB per arch and the runner has
        # 14 GB total, so a multi-arch build of it OOMs the disk
        # without this. Same reason as build-yolov8-weights.yml.
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          # buildx needs these.
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Not on pull_request: nothing is pushed there, and GHCR
        # rejects logins from forked-PR contexts anyway.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # The weights release drives the image tag, because that is
          # the operator-meaningful version: which checkpoint the graph
          # was exported from.
          WEIGHTS_TAG="${{ github.event.inputs.weights_tag || '8.3.0' }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            EXTRA="ghcr.io/${{ github.repository_owner }}/fastsam-weights:latest"
          else
            EXTRA=""
          fi
          PRIMARY="ghcr.io/${{ github.repository_owner }}/fastsam-weights:v${WEIGHTS_TAG}"
          SHA="ghcr.io/${{ github.repository_owner }}/fastsam-weights:sha-${GITHUB_SHA::8}"
          {
            echo "primary=${PRIMARY}"
            echo "extra=${EXTRA}"
            echo "sha=${SHA}"
            echo "weights_tag=${WEIGHTS_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build (and push if not PR)
        uses: docker/build-push-action@v5
        with:
          context: examples/fastsam-weights
          file: examples/fastsam-weights/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.tags.outputs.primary }}
            ${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.extra }}
          # Pinned so the exported graph is reproducible.
          build-args: |
            FASTSAM_PT_URL=https://github.com/ultralytics/assets/releases/download/v8.3.0/FastSAM-s.pt
          # The ultralytics base is ~3 GB and changes rarely; the cache
          # turns the second build into seconds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sanity-check the published image
        # Pull back what we just pushed and prove the graph is in it.
        # Cheap insurance against "the build succeeded but the COPY
        # didn't" — the failure this whole image exists to prevent.
        if: github.event_name != 'pull_request'
        run: |
          docker pull "${{ steps.tags.outputs.primary }}"
          docker run --rm --entrypoint sh "${{ steps.tags.outputs.primary }}" -c '
            set -e
            SIZE=$(wc -c < /FastSAM-s.onnx)
            echo "FastSAM-s.onnx: ${SIZE} bytes"
            # A 404 page or an LFS pointer is a few hundred bytes; the
            # real graph is ~12 MB. Anything under 1 MB is not a model.
            [ "$SIZE" -gt 1000000 ] || { echo "too small to be the model"; exit 1; }
          '
