# ==========================================
# OpenNVR — Attendly overlay
# ==========================================
#
# Attendly: classroom attendance on OpenNVR cameras. Students enrol their
# faces (photo or webcam), rooms are cameras, a weekly planner publishes
# classes, and during each class the app takes recognition snapshots that
# finalise into a PRESENT/ABSENT roster.
#
# It runs the way the Camera Agent runs: its own container on the internal
# network, its own web UI published on a host port, listed in the App
# Catalog with an "Open app" link (opens in a new tab), and OpenNVR login.
#
# OpenNVR does the lower layer: frames come from core's snapshot path,
# detection and recognition go through KAI-C to the InsightFace adapter —
# which this profile starts (the adapter services in docker-compose.apps.yml
# carry the ``attendly`` profile too). Both overlays are needed:
#
#     docker compose -f docker-compose.yml \
#                    -f docker-compose.apps.yml \
#                    -f docker-compose.attendly.yml \
#                    --profile attendly up -d
#
# or, in .env (what ./scripts/install.sh writes when you pick Attendly):
#
#     OPENNVR_EXAMPLE_COMPOSE=docker-compose.attendly.yml
#     OPENNVR_EXAMPLE_PROFILE=attendly
#
# Then open http://<host>:9300/ — or the Attendly card in the App Catalog.
# ==========================================

x-svc-logs: &svc-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  attendly:
    profiles: [attendly]
    # Same repo + release cadence as opennvr-core, so it shares CORE_TAG.
    image: ghcr.io/open-nvr/attendly:${CORE_TAG:-latest}
    build:
      context: .
      dockerfile: examples/attendly/Dockerfile
    container_name: opennvr_attendly
    # The hostname the app registers with the catalog = the service name
    # other containers resolve (core probes /health and /state on it).
    hostname: attendly
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      opennvr-core:
        condition: service_healthy
      insightface-adapter:
        condition: service_healthy
      insightface-register:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    ports:
      # LAN edge — bind host follows nginx; auth: OpenNVR login.
      - "${NGINX_BIND_HOST:-0.0.0.0}:9300:9300"
    environment:
      # Class windows are local times of day; must match core's TZ.
      - TZ=${TZ:-UTC}
      - ATTENDLY_TIMEZONE=${TZ:-UTC}
      # Platform wiring — the same names every app overlay uses.
      - OPENNVR_URL=http://opennvr-core:8000
      - KAIC_URL=http://opennvr-core:8100
      # Gate decisions go on the bus as access.decided.v1; the
      # gate-controller app (profile gate-controller) drives the barriers.
      - NATS_URL=nats://nats:4222
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Enrolment / listing go to the adapter directly (KAI-C does not
      # proxy /faces/*); its token is the site key in the apps overlay.
      - ATTENDLY_FACES_URL=http://insightface-adapter:9005
      - ATTENDLY_RECOGNITION_ADAPTER=insightface
      # Where the browser opens the app. Blank = the catalog's {host}
      # placeholder on :9300; set for a reverse proxy / public hostname,
      # e.g. ATTENDLY_PUBLIC_URL=https://attendance.school.example
      - ATTENDLY_PUBLIC_URL=${ATTENDLY_PUBLIC_URL:-}
      - ATTENDLY_AUTH_MODE=opennvr
      - ATTENDLY_LOG_LEVEL=${ATTENDLY_LOG_LEVEL:-INFO}
    volumes:
      - opennvr_attendly_data:/data
    networks:
      - opennvr_internal
      - opennvr_apps
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, sys; sys.exit(0 if httpx.get('http://127.0.0.1:9300/health', timeout=3).status_code == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

volumes:
  opennvr_attendly_data:
