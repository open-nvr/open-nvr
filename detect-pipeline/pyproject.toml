[project]
name = "detect-pipeline"
version = "0.0.1"
description = "OpenNVR Tier-0 detection pipeline (compute-gated inference)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["detect_pipeline"]

[tool.pytest.ini_options]
testpaths = ["test"]
