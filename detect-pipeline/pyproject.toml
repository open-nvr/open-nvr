[project]
name = "detect-pipeline"
version = "0.0.1"
description = "OpenNVR Tier-0 detection pipeline (compute-gated inference)"
requires-python = ">=3.11"
dependencies = [
    # Tier-0 CV: motion detection + (later) region math operate on numpy luma
    # arrays. Headless OpenCV — no GUI/GTK deps, correct for a server component.
    "numpy>=1.26",
    # Cap below 5.0 for now. OpenCV 5 moved the classic HOG/Haar detectors to
    # opencv_contrib (xobjdetect) — they're no longer in the -headless wheel —
    # because DNN detectors are faster/more accurate. Our default reference
    # detector is HOG, so 4.x keeps it available. EXIT PATH: replace HOG with a
    # small ONNX model via cv2.dnn.readNetFromONNX (present in the main wheel on
    # BOTH 4.x and 5.x) — then this cap can be lifted. Tracked as a follow-up
    # alongside the KAI-C accelerator detector adapter (same ONNX path).
    "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
# The container service also needs a NATS client to publish detections.
service = [
    "nats-py>=2.6",
]

[project.scripts]
opennvr-tier0 = "detect_pipeline.run:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["detect_pipeline"]

[tool.pytest.ini_options]
testpaths = ["test"]
