[project]
name = "detect-pipeline"
version = "0.0.1"
description = "OpenNVR Tier-0 detection pipeline (compute-gated inference)"
requires-python = ">=3.11"
dependencies = [
    # Tier-0 CV: motion detection + (later) region math operate on numpy luma
    # arrays. Headless OpenCV — no GUI/GTK deps, correct for a server component.
    "numpy>=1.26",
    # Cap below 5.0 for now. The default detector is now ONNX via
    # cv2.dnn.readNetFromONNX (in the main wheel on BOTH 4.x and 5.x), so the
    # detector itself is already forward-portable. The cap remains only until
    # cv2.dnn is validated against OpenCV 5's rewritten (CPU-only) DNN engine and
    # the rest of our cv2 usage is checked on 5.x — lifting it is a small,
    # separate follow-up. (OpenCV 5 also moved HOG to opencv_contrib, so the
    # optional 'hog' detector needs 4.x anyway.)
    "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
# The container service also needs a NATS client to publish detections.
service = [
    "nats-py>=2.6",
]

[project.scripts]
opennvr-tier0 = "detect_pipeline.run:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["detect_pipeline"]

[tool.pytest.ini_options]
testpaths = ["test"]
