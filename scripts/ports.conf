# OpenNVR published-port table — the single source of truth.
#
# Both launchers read this file (start.sh: load_port_table, start.ps1:
# Import-PortTable) and resolve every row before invoking docker compose.
# The resolved value is exported so compose interpolates it into the host
# side of the corresponding "ports:" entry.
#
# WHY A TABLE AND NOT LITERALS IN COMPOSE
# ---------------------------------------
# A published host port can be impossible to bind while nothing is
# listening on it:
#
#   Windows  WinNAT/Hyper-V reserves ranges (netsh interface ipv4 show
#            excludedportrange) that are RE-ROLLED AT EVERY BOOT. A host
#            that started fine yesterday fails today.
#   macOS    AirPlay Receiver (5000/7000) and other system agents hold
#            ports; Docker Desktop's vpnkit adds its own failures.
#   Linux    net.ipv4.ip_local_reserved_ports, systemd socket activation,
#            or simply another service already on 80/443.
#
# Docker's publishing is all-or-nothing per container, so ONE unbindable
# port aborts EVERY publication for that service — a reserved 9100 takes
# the whole camera-agent down, a reserved 8322 takes MediaMTX's carefully
# chosen ICE port with it. With the port hardcoded in compose there is no
# recovery that does not involve editing a tracked file. See #298, #368.
#
# FIELDS
# ------
#   VAR         env var compose interpolates on the HOST side. Container
#               ports never move: they are baked into nginx/opennvr.conf,
#               mediamtx.docker.yml, supervisord.conf and healthchecks.
#   DEFAULT     what a clean install uses. Changing these changes every
#               documented URL — don't, without updating docs/ARCHITECTURE.md.
#   PROTO       tcp | udp | both. Must match what compose actually
#               publishes: probing UDP for a TCP-only publication would
#               reject a good port whose UDP twin happens to be reserved.
#   CANDIDATES  ordered fallbacks, tried left to right. Spread ~10000 apart
#               ON PURPOSE: the reserved ranges are handed out as runs of
#               CONTIGUOUS 100-port blocks, so 9100 -> 9101 would land in
#               the same block that just rejected us. Kept short and fixed
#               (never "any free port") so the set of ports an operator may
#               need to allow through a firewall stays documentable.
#   POLICY      shift | pin
#                 shift  probe DEFAULT, then walk CANDIDATES, export the
#                        winner, warn loudly. Self-healing across reboots.
#                 pin    never auto-move. Diagnose and fail. Used only for
#                        the web edge, where a silent relocation would
#                        break every bookmark, doc URL and the cert story.
#   LABEL       human name used in warnings and the post-start URL banner.
#
# OPENNVR_PORT_POLICY=strict (in .env) promotes EVERY row to "pin". Use it
# on production sites: once a deployment is real the ports are load-bearing
# (firewall rules, router port-forwards, an upstream reverse proxy,
# monitoring checks, operator bookmarks), and a port that quietly moves
# after a reboot is worse than a start that refuses and says why.
#
# An operator value set in .env or the environment ALWAYS wins and is NEVER
# auto-overridden, on either policy — a pinned port usually has a firewall
# rule or router forward behind it, and drifting off it silently produces a
# break that is untraceable weeks later. If the operator's choice is
# unbindable the launcher fails loudly naming the variable.
#
# VAR|DEFAULT|PROTO|CANDIDATES|POLICY|LABEL

# ── Web edge (nginx) ──────────────────────────────────────────────────
# pin: see POLICY above. Overridable, but never automatically.
HTTPS_PORT|443|tcp|443|pin|Web UI (https)
HTTP_PORT|80|tcp|80|pin|HTTP redirect

# ── Media ─────────────────────────────────────────────────────────────
# ICE is the one row where host and container port must stay EQUAL (the
# port is advertised inside SDP candidates), so compose interpolates the
# same var on both sides. Everything else maps host -> fixed container port.
WEBRTC_ICE_PORT|8189|both|8189,18189,28189,38189|shift|WebRTC ICE media
RTSPS_PORT|8322|tcp|8322,18322,28322,38322|shift|RTSPS (VLC / ffmpeg)

# ── Core API (loopback only) ──────────────────────────────────────────
CORE_HOST_PORT|8000|tcp|8000,18000,28000,38000|shift|Core API (loopback)

# ── Opt-in: log viewer (COMPOSE_PROFILES=logs) ────────────────────────
LOGS_PORT|9999|tcp|9999,19999,29999,39999|shift|Log viewer (loopback)

# ── Opt-in: camera-agent example (voice / chat profiles) ──────────────
# The two profiles are mutually exclusive and share this one port.
AGENT_PORT|9100|tcp|9100,19100,29100,39100|shift|Camera Agent

# ── Opt-in: mediamtx host-side debug ports (OPENNVR_DEBUG_PORTS=1) ────
# Loopback only. Not published by default — browsers reach HLS/WHEP/
# playback through nginx and the healthcheck talks to the API from inside.
HLS_PORT|8888|tcp|8888,18888,28888,38888|shift|MediaMTX HLS (debug)
WEBRTC_HTTP_PORT|8889|tcp|8889,18889,28889,38889|shift|MediaMTX WHEP (debug)
PLAYBACK_PORT|9996|tcp|9996,19996,29996,39996|shift|MediaMTX playback (debug)
MEDIAMTX_API_PORT|9997|tcp|9997,19997,29997,39997|shift|MediaMTX API (debug)
