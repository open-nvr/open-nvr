[project]
name = "opennvr-example-smart-doorbell"
version = "1.0.0"
description = "OpenNVR smart-doorbell example app — face recognition at the front door via the InsightFace adapter through KAI-C"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }

# The SDK owns the runtime stack (httpx KAI-C + adapter calls +
# webhooks, PyYAML config, nats-py alert fan-out, the FrameApp poll
# loop and frame sources) — see docs/design/app-sdk-spec.html. The
# face-DB enrollment REST flow stays app-side (KAI-C doesn't proxy
# /faces/*, so neither does the SDK).
dependencies = [
    "opennvr-app-sdk",
    "Pillow>=10,<12",
]

[tool.uv.sources]
opennvr-app-sdk = { path = "../../sdk/opennvr-app-sdk", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

# Mirrors the optional-dependencies group so a plain ``uv sync`` gets a
# test-ready environment (uv installs the ``dev`` group by default).
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
