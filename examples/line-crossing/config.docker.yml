#
# line-crossing config consumed by docker-compose.apps.yml.
#
# Variables of the form ${VAR} are substituted by the
# line-crossing-config-init container at compose-up time (busybox
# sed, same pattern as the camera-agent overlay). Only the variables
# listed in the init container are replaced — everything else is left
# untouched.
#
# DO NOT edit the substituted values directly. To change the secret,
# update .env and re-run ``docker compose up`` so the init container
# re-templates the file.

# ── NATS endpoint (KAI-C's event bus, compose service ``nats``) ────
nats_url: "nats://nats:4222"
# The standard stack runs NATS with ``--auth INTERNAL_API_KEY``.
nats_token: "${INTERNAL_API_KEY}"

# Line-crossing needs per-object identity — a ``track_id`` on every
# detection. Tier-0, the stack's always-on detector, tracks natively and
# publishes on ``opennvr.inference.tier0.>``; the SDK bridges those events
# into the app when ``consume_tier0`` is on. Zero extra inference. To use
# a chained bytetrack adapter instead, subscribe to ``opennvr.inference.>``
# and set consume_tier0: false.
subject_pattern: "opennvr.inference.tier0.>"
consume_tier0: true

# ── What to count — edit in the App Catalog (applies live) ─────────
watch_labels:
  - "person"
track_ttl_seconds: 30

# ── Directions, alerts, filters — all editable live in the catalog ──
# A→B is the arrow you draw; call the two directions what they mean here.
label_a_to_b: "in"
label_b_to_a: "out"
# every = alert on each crossing (perimeter) · threshold = alert when
# today's count reaches passthrough_threshold · off = count only.
alert_mode: "every"
alert_severity: "high"
# Least seconds between two alerts per camera; crossings inside the
# window are counted, not alerted — a group at the gate is one alert.
alert_cooldown_seconds: 0
# Alerts only inside this daily window (counting runs all day). Leave the
# values empty for always. Cross-midnight ("22:00" → "06:00") is fine.
active_hours:
  start: ""
  end: ""
passthrough_threshold: 0
min_track_age_seconds: 0
min_bbox_height: 0
daily_reset_hour: 0
attach_snapshot: true
# Counts ride the platform's footfall history (90 days, hourly). Turn off
# if the occupancy app has an entry line on the same camera.
publish_footfall: true
footfall_period_seconds: 60

# ── Alert delivery ─────────────────────────────────────────────────
webhook_url: null
nats_alerts_url: "nats://nats:4222"
nats_alerts_token: "${INTERNAL_API_KEY}"

# ── Cameras ────────────────────────────────────────────────────────
# Empty: the app works on the cameras selected for it in the App Catalog
# (Configure → Cameras), follows changes live, and takes each camera's
# line from the catalog's tripwire editor. None selected means
# nothing counted and no compute. Listing cameras here pins the set
# (standalone use).
cameras: []

contract_port: 9202
contract_host: "line-crossing"
opennvr_url: "http://opennvr-core:8000"
