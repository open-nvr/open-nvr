#
# occupancy-counting config consumed by docker-compose.apps.yml.
#
# Variables of the form ${VAR} are substituted by the
# occupancy-counting-config-init container at compose-up time (busybox
# sed, same pattern as the camera-agent overlay). Only the variables
# listed in the init container are replaced — everything else is left
# untouched.
#
# DO NOT edit the substituted values directly. To change the secret,
# update .env and re-run ``docker compose up`` so the init container
# re-templates the file.

# ── NATS endpoint (KAI-C's event bus, compose service ``nats``) ────
nats_url: "nats://nats:4222"
# The standard stack runs NATS with ``--auth INTERNAL_API_KEY``.
nats_token: "${INTERNAL_API_KEY}"

# Tier-0 ONLY by default: the always-on detect-pipeline is the
# detection stream a standard install actually produces. Narrowing
# the subject (rather than the wildcard) means an adapter you add
# later cannot double-count the same object through both streams.
# Widen to "opennvr.inference.>" if you want adapter events too.
subject_pattern: "opennvr.inference.tier0.>"
# Bridge Tier-0 tracks into contract-shaped detections.
consume_tier0: true

# ── What to count / thresholds — EDIT for your scene ───────────────
watch_labels:
  - "person"
max_occupancy: 10
min_occupancy: null
# A new band must hold for this many consecutive frames before it commits
# (3 frames ≈ 1.5 s at Tier-0's 2 fps): a single noisy frame no longer
# flips a zone over and back.
debounce_frames: 3
clear_alerts: false
# Once a zone has alerted over (or under), the same alert is not repeated
# for this zone within this window however often the count flickers
# across the limit. The page still shows the live level. 0 disables.
alert_cooldown_seconds: 120

# ── Alert delivery ─────────────────────────────────────────────────
# Alerts always go to stdout (``docker compose logs occupancy-counting``).
webhook_url: null
# Fan alerts back onto the bus so the operator-UI alerts inbox and any
# other subscriber pick them up without per-app webhooks.
nats_alerts_url: "nats://nats:4222"
nats_alerts_token: "${INTERNAL_API_KEY}"

# ── Cameras ───────────────────────────────────────────────────────
# LEAVE EMPTY to watch every camera OpenNVR knows about, each with a
# whole-frame zone. If the camera settings page assigns the
# ``occupancy_counting`` skill to specific cameras, the app scopes to
# exactly those (re-checked every refresh); with no such assignment
# anywhere, nothing is restricted and every camera is watched — the app reads the live camera list from
# ``opennvr_url`` on boot, so the ids always match what Tier-0
# publishes (OpenNVR names them cam1, cam2 — NOT cam-1).
#
# Draw real zones in the App Catalog UI, or pin them here to override.
# Coordinates are in whatever space you choose: the detector's boxes
# are normalised before they are compared, so a zone drawn in a
# 1000x1000 space works on a 4K camera.
#
# cameras:
#   - camera_id: "cam1"
#     zone_name: "doorway"
#     frame_width: 1000
#     frame_height: 1000
#     max_occupancy: 3
#     zone: [[100, 100], [900, 100], [900, 900], [100, 900]]
cameras: []
contract_port: 9201
contract_bind_host: "0.0.0.0"
contract_host: "occupancy-counting"   # the compose service name
opennvr_url: "http://opennvr-core:8000"
