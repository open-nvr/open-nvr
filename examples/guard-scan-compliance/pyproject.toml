[project]
name = "opennvr-example-guard-scan-compliance"
version = "1.0.0"
description = "OpenNVR guard-scan-compliance example app (was every person wanded, and what did the scanner find)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
dependencies = [
    "opennvr-app-sdk",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
    "websockets>=13.0",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.9,<5.0",
]

[tool.uv.sources]
opennvr-app-sdk = { path = "../../sdk/opennvr-app-sdk", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
guard-scan-compliance = "guard_scan_compliance:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
