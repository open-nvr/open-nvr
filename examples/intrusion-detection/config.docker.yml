#
# intrusion-detection config consumed by docker-compose.apps.yml.
#
# Variables of the form ${VAR} are substituted by the
# intrusion-detection-config-init container at compose-up time (busybox
# sed, same pattern as the camera-agent overlay). Only the variables
# listed in the init container are replaced — everything else is left
# untouched.
#
# DO NOT edit the substituted values directly. To change the secret,
# update .env and re-run ``docker compose up`` so the init container
# re-templates the file.

# ── NATS endpoint (KAI-C's event bus, compose service ``nats``) ────
nats_url: "nats://nats:4222"
# The standard stack runs NATS with ``--auth INTERNAL_API_KEY``.
nats_token: "${INTERNAL_API_KEY}"

# Tier-0 publishes tracked detections (a stable track_id per object) on
# opennvr.inference.tier0.> — one detector, every app subscribes. The
# perimeter needs identity (one intruder is one alarm, not one per
# frame) and needs frames as they come rather than on a poll interval,
# so this is the stream to consume.
subject_pattern: "opennvr.inference.tier0.>"
consume_tier0: true

# ── The rule — every value below is also editable live in the App Catalog ──
watch_labels:
  - "person"
arm_mode: "schedule"           # schedule | always | manual | off
armed_hours:                   # with arm_mode=schedule; empty = always armed
  start: "19:00"
  end: "07:00"
exit_delay_seconds: 0          # grace after arming, to walk out
entry_delay_seconds: 0         # grace between breach and alarm, to disarm
min_presence_seconds: 1        # inside the zone this long before it is a breach
alert_severity: "high"
escalate_after_seconds: 0      # >0: second, higher alarm if still inside
alarm_cooldown_seconds: 30     # a group at the fence is one alarm
alarm_reset_seconds: 60        # zone clear this long → re-armed
min_bbox_height: 0             # ignore boxes shorter than this fraction of frame
override_minutes: 60           # how long a manual arm/disarm from the page holds
attach_snapshot: true
track_ttl_seconds: 5

# ── Alert delivery ─────────────────────────────────────────────────
# Alerts always go to stdout (``docker compose logs intrusion-detection``).
webhook_url: null
# Fan alerts back onto the bus so the operator-UI alerts inbox and any
# other subscriber pick them up without per-app webhooks.
nats_alerts_url: "nats://nats:4222"
nats_alerts_token: "${INTERNAL_API_KEY}"

# ── Cameras ────────────────────────────────────────────────────────
# None listed here, on purpose. Select the cameras this app protects in
# the App Catalog → Configure → Cameras; zones are drawn there too.
#
# (A `cameras:` list still works when running this app standalone,
# without opennvr_url — see config.example.yml.)

# ── App contract (spec §03) — powers the App Catalog ───────────────
contract_port: 9204
contract_bind_host: "0.0.0.0"
contract_host: "intrusion-detection"   # the compose service name
opennvr_url: "http://opennvr-core:8000"
