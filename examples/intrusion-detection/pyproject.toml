[project]
name = "opennvr-example-intrusion-detection"
version = "1.0.0"
description = "OpenNVR intrusion-detection example app"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }

# The SDK owns the whole runtime stack (KAI-C HTTP + WebSocket clients,
# webhooks, PyYAML config, nats-py alert fan-out, the FrameApp poll
# loop, frame sources, zone geometry) — see docs/APP_PLATFORM.md.
dependencies = [
    "opennvr-app-sdk",
]

[tool.uv.sources]
opennvr-app-sdk = { path = "../../sdk/opennvr-app-sdk", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

# Mirrors the optional-dependencies group so a plain ``uv sync`` gets a
# test-ready environment (uv installs the ``dev`` group by default).
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
intrusion-detection = "intrusion_detection:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
