#
# Intrusion-detection config template.
#
# Copy to ``config.yml``, fill in for your deployment, and run:
#
#   python intrusion_detection.py --config config.yml

# ── NATS endpoint (KAI-C's event bus) ──────────────────────────────
#
# This app SUBSCRIBES to the detection stream rather than driving its
# own inference: one detector on the box, every app fans out from it.
nats_url: "nats://nats:4222"
nats_token: null

# ── Tracking ───────────────────────────────────────────────────────
#
# A breach belongs to a tracked object, so one intruder raises one
# alarm. On the stock stack consume Tier-0, which already tracks:
#   subject_pattern: "opennvr.inference.tier0.>"
#   consume_tier0: true
# Without track ids the app falls back to one breach per (camera, label).
subject_pattern: "opennvr.inference.>"
consume_tier0: false

# ── Arming ─────────────────────────────────────────────────────────
#
# arm_mode:
#   schedule — armed inside armed_hours (the classic restricted hours)
#   always   — armed around the clock (a plant room, a roof)
#   manual   — only the arm/disarm actions move it
#   off      — watch and report, never alarm (a week of tuning)
#
# exit_delay_seconds:  grace after arming before the zone goes live.
# entry_delay_seconds: grace between the breach and the alarm, so
#                      someone authorised can disarm. Both 0 = instant
#                      perimeter, which is what a fence line wants.
# override_minutes:    how long a manual arm/disarm holds before the
#                      mode takes over again (0 = until cleared).
arm_mode: "schedule"
armed_hours:
  start: "19:00"
  end: "07:00"
exit_delay_seconds: 0
entry_delay_seconds: 0
override_minutes: 60

# ── The rule ───────────────────────────────────────────────────────
#
# watch_labels:          classes that count as an intruder.
# min_presence_seconds:  how long inside the zone before it is a breach.
#                        The best false-alarm filter there is — a box
#                        clipping the zone edge for one frame is not an
#                        intruder. 1–3 s suits most scenes.
# min_bbox_height:       ignore objects shorter than this fraction of
#                        the frame — the far road, birds.
# alarm_cooldown_seconds: least time between two alarms on one camera,
#                        so a group is one alarm.
# alarm_reset_seconds:   zone clear this long → the camera re-arms.
# escalate_after_seconds: >0 raises a second, higher-severity alarm if
#                        they are still inside.
watch_labels:
  - "person"
min_presence_seconds: 1
min_bbox_height: 0
alert_severity: "high"
alarm_cooldown_seconds: 30
alarm_reset_seconds: 60
escalate_after_seconds: 0
attach_snapshot: true
track_ttl_seconds: 5

# ── Alert delivery ─────────────────────────────────────────────────
webhook_url: null
nats_alerts_url: null
nats_alerts_token: null

# ── Cameras ────────────────────────────────────────────────────────
#
# Standalone, list them here with the zone in pixel coordinates.
# Connected to OpenNVR (opennvr_url set), leave this out: cameras are
# picked and zones drawn in the App Catalog, live.
cameras:
  - camera_id: "cam-yard"
    frame_width: 1920
    frame_height: 1080
    zone_name: "yard"
    zone:
      - [600, 300]
      - [1400, 300]
      - [1400, 800]
      - [600, 800]
