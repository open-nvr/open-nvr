[project]
name = "opennvr-example-attendance"
version = "1.0.0"
description = "OpenNVR attendance app — recognises enrolled people on the cameras of scheduled sessions and reports each look to core"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }

# The SDK owns the runtime stack: httpx for core and KAI-C, PyYAML for
# config, nats-py for the attempts, the FrameApp loop and the contract.
dependencies = [
    "opennvr-app-sdk",
    "PyYAML>=6.0,<7.0",
]

[tool.uv.sources]
opennvr-app-sdk = { path = "../../sdk/opennvr-app-sdk", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# Mirrors the optional-dependencies group so a plain ``uv sync`` gets a
# test-ready environment.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
