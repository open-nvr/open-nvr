# attendance-web (docker-compose.apps.yml): the attendance web UI on the
# LAN, over HTTPS with OpenNVR's own certificate. Everything goes to the
# app, which serves the page and passes the API to core as the signed-in
# user. Nothing here decides who may do what.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # http:// typed on this port (497): send the browser to https:// on
    # the same host and port, instead of nginx's "plain HTTP" error.
    error_page 497 =301 https://$http_host$request_uri;

    # Ten 8 MB photos in one enrolment (examples/attendance/attendance/webui.py).
    client_max_body_size 90m;

    # Docker's DNS, asked per request: the app can restart (new address)
    # without this nginx needing one too, and a stopped app is a 502
    # here, not an nginx that will not start.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $attendance http://attendance:9218;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $attendance;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Enrolment is the adapter's time per photo; a report is quick.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_request_buffering on;
    }
}
