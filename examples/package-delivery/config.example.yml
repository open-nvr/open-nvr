#
# Package Delivery — config template.
#
# Copy to ``config.yml``, fill in for your deployment, and run:
#
#   python package_delivery.py --config config.yml

# ── The bus ────────────────────────────────────────────────────────
#
# The app SUBSCRIBES to the detection stream Tier-0 already produces.
# People walking up to the door and leaving, and vehicles stopping
# outside, are the triggers; nothing is fetched or inferred while
# nobody comes.
nats_url: "nats://nats:4222"
nats_token: null
subject_pattern: "opennvr.inference.tier0.>"
consume_tier0: true

# ── The platform ───────────────────────────────────────────────────
#
# Snapshots, evidence photos, the site mode and — through KAI-C — the
# skill that counts parcels. With opennvr_url set and no cameras: list,
# the cameras and the porch zones come from the App Catalog.
opennvr_url: "http://opennvr-core:8000"
# opennvr_token: null            # or the OPENNVR_APP_KEY environment variable
# kaic_url: "http://opennvr-core:8100"   # or KAIC_URL
# kaic_api_key: null                     # or OPENNVR_INTERNAL_API_KEY

# ── Cameras (standalone only) ──────────────────────────────────────
#
# Each door: the camera handle and the porch zone, as fractions of the
# frame or in pixels with frame_width/frame_height. Draw it around the
# step where parcels are left, not the whole frame — the plant pot and
# the doormat would be counted too.
cameras:
  - camera_id: "cam1"
    frame_width: 1920
    frame_height: 1080
    zone: [[0.3, 0.55], [0.7, 0.55], [0.7, 0.95], [0.3, 0.95]]

# ── The rule (all live-editable from the catalog) ──────────────────
#
# delivery_hours: when deliveries are expected, local time. A pick-up
#   outside them by nobody known weighs towards theft. Empty = any time.
delivery_hours: {start: "08:00", end: "20:00"}

# recheck_minutes: while parcels wait, re-count this often — catches a
#   collection nobody walked past the camera for. 0 disables.
# idle_recheck_minutes: with nothing waiting, re-count this often to
#   catch a delivery Tier-0 missed. 0 disables.
recheck_minutes: 15
idle_recheck_minutes: 60

# reminder_minutes: remind about parcels still waiting this often until
#   acknowledged, snoozed or collected. 0 disables.
reminder_minutes: 60

# settle_seconds: wait this long after someone leaves before counting,
#   so the count is of the doorstep and not of their back.
settle_seconds: 4

# courier_grace_seconds: a parcel that vanishes this soon after arriving,
#   with the same person still about, was taken back by the courier.
# quick_grab_minutes: a parcel taken this soon after delivery by someone
#   ELSE is the classic follow-the-van theft, even inside the hours.
courier_grace_seconds: 120
quick_grab_minutes: 10

# known_face_window_seconds: a known face reported at this door (Smart
#   Doorbell's known_visitor alert) within this window makes a pick-up
#   an owner pick-up.
# vehicle_window_seconds: a vehicle that stopped outside within this
#   window is kept as context for the event.
known_face_window_seconds: 180
vehicle_window_seconds: 120

# What Tier-0 calls things. proxy_labels are the COCO classes that
# stand in for parcels when no package-capable skill is registered.
person_label: "person"
vehicle_labels: ["truck", "car", "bus"]
proxy_labels: ["suitcase", "backpack", "handbag"]

attach_snapshot: true            # before/after photos on every event
alert_cooldown_seconds: 20       # one alert per door per window (taken always fires)
track_ttl_seconds: 10            # a person unseen this long has left the frame

# ── Alert delivery ─────────────────────────────────────────────────
webhook_url: null
nats_alerts_url: "nats://nats:4222"
nats_alerts_token: null
nats_alerts_subject_prefix: "opennvr.alerts"

# ── App contract (the catalog) ─────────────────────────────────────
contract_port: 9207
contract_bind_host: "0.0.0.0"
contract_host: "package-delivery"
