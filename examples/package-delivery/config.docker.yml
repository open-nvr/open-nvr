#
# package-delivery config consumed by docker-compose.apps.yml.
#
# Variables of the form ${VAR} are substituted by the
# package-delivery-config-init container at compose-up time (busybox
# sed, same pattern as the camera-agent overlay). Only the variables
# listed in the init container are replaced — everything else is left
# untouched.
#
# DO NOT edit the substituted values directly. To change the secret,
# update .env and re-run ``docker compose up`` so the init container
# re-templates the file.

# ── The bus: Tier-0's tracked detections ──────────────────────────
nats_url: "nats://nats:4222"
nats_token: "${INTERNAL_API_KEY}"
subject_pattern: "opennvr.inference.tier0.>"
consume_tier0: true

# ── Cameras ──────────────────────────────────────────────────────
# None listed here, on purpose. Select the doors this app watches in
# the App Catalog → Configure → Cameras, and draw the porch zone there.
# Nothing selected means the app does nothing and uses no compute.

# ── The rule — EDIT from the catalog ──────────────────────────────
delivery_hours: {start: "08:00", end: "20:00"}
recheck_minutes: 15
idle_recheck_minutes: 60
reminder_minutes: 60
settle_seconds: 4
courier_grace_seconds: 120
quick_grab_minutes: 10
known_face_window_seconds: 180
vehicle_window_seconds: 120
person_label: "person"
vehicle_labels: ["truck", "car", "bus"]
proxy_labels: ["suitcase", "backpack", "handbag"]
attach_snapshot: true
alert_cooldown_seconds: 20
track_ttl_seconds: 10

# ── Alert delivery ─────────────────────────────────────────────────
# Alerts always go to stdout (``docker compose logs package-delivery``).
webhook_url: null
# Fan alerts back onto the bus so the operator-UI alerts inbox and the
# Home Assistant integration pick them up.
nats_alerts_url: "nats://nats:4222"
nats_alerts_token: "${INTERNAL_API_KEY}"

# ── App contract (spec §03) — powers the App Catalog ───────────────
# The SDK serves /health /manifest /state on contract_port and
# self-registers with the OpenNVR app registry on boot. The
# registration token comes from the OPENNVR_INTERNAL_API_KEY
# environment variable set by the overlay, so it is not templated here.
# Snapshots, evidence and the KAI-C skill that counts parcels go through
# opennvr_url (KAIC_URL is set by the overlay).
contract_port: 9207
contract_bind_host: "0.0.0.0"
contract_host: "package-delivery"   # the compose service name
opennvr_url: "http://opennvr-core:8000"
