#
# Footage-search example app — config template.
#
# Copy this file to ``config.yml``, fill in the values, and run:
#
#   python footage_search.py --config config.yml search "red truck yesterday"
#   python footage_search.py --config config.yml serve     # the app contract
#
# Upgrading from 1.x? db_path, nats_url, nats_token, subject_pattern,
# retention_days and coalesce_seconds are gone. This app no longer
# keeps an index of its own — see the README for why.

# ── The store it searches ─────────────────────────────────────────
#
# Required. Both the registry this app registers with and the event
# store it queries. Every other example app treats this as optional
# because it can still do its job standalone; this one cannot, and
# refuses to start rather than come up answering nothing.
opennvr_url: "http://opennvr-core:8000"
# opennvr_token: "oak_…"   # the app key, if not supplied by the env

# ── Search vocabulary ─────────────────────────────────────────────
#
# extra_labels: object classes beyond the built-in COCO-ish vocabulary
#   that your detectors emit (so the parser treats them as labels, not
#   free-text keywords). Everything else meaningful in a query becomes
#   search text matched against captions and attributes.
extra_labels:
  - "forklift"
  - "pallet"

# camera_aliases: words a user might say, mapped to a camera this app
#   has been given — by NAME as it appears in OpenNVR. "the dock" →
#   "Loading Dock", so "trucks at the dock" filters to that camera. An
#   id ("3") or a handle ("cam3") works too.
#
#   An alias naming a camera this app does not hold is REFUSED, not
#   widened: the operator asked about the gate, and answering with the
#   loading dock is worse than saying there is no gate here.
camera_aliases:
  dock: "Loading Dock"
  lobby: "Lobby"
  gate: "Front Gate"

# Max results returned by a search.
result_limit: 25

# ── Optional LLM query parsing (Ollama) ───────────────────────────
#
# When enabled, the natural-language query is parsed by a local Ollama
# model instead of the built-in heuristic parser — better at messy
# phrasing ("someone in a hoodie hanging around the gate after dark").
# Falls back to the heuristic parser automatically on any error, so
# enabling it never makes search worse. No cloud, no API keys.
#
# It parses the SENTENCE and nothing else. What the results mean is
# the store's answer, not the model's.
ollama:
  enabled: false
  url: "http://ollama:11434"
  model: "llama3.2"

# ── App contract (spec §03) ───────────────────────────────────────
#
# Serves /health /manifest /state and the POST /actions search surface,
# and self-registers with the app registry so the catalog shows a live
# status dot and the "Search footage" form. Omit contract_port to run
# CLI-only.
# contract_port: 9208
# contract_host: "footage-search"
