[project]
name = "opennvr-example-gold-bar-desk"
version = "1.0.0"
description = "OpenNVR gold-bar-desk example app (every bar on a weighing desk accounted for)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
dependencies = [
    "opennvr-app-sdk",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.9,<5.0",
    "onnxruntime>=1.18,<2.0",
]

[tool.uv.sources]
opennvr-app-sdk = { path = "../../sdk/opennvr-app-sdk", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
gold-bar-desk = "gold_bar_desk:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
