#
# gold-bar-desk config, consumed by docker-compose.apps.yml.
#
# ${VAR} is substituted by the config-init container at compose-up time.
# Do not edit substituted values here — change .env and re-run
# ``docker compose up`` so the init container re-templates the file.

# ── Video ──────────────────────────────────────────────────────────
# Frames come from the desk camera's stream, through a grant core mints
# for THIS app and THIS camera; pick the camera in the App Catalog.
# Full width: a bar must be ~30 px wide to be segmented.
fps: 2.0
frame_width: 1920

# ── The model ──────────────────────────────────────────────────────
# Copied into the weights volume by fastsam-weights-init.
model_path: "/weights/FastSAM-s.onnx"
inference_threads: 2

# ── The shift ──────────────────────────────────────────────────────
# 0 learns the count from the first 30 s; better to enter the issued
# count in the App Catalog.
bars_at_start: 0
missing_after_s: 25.0
missing_min_frames: 50
min_analysis_fps: 1.0
near_body_s: 1.0
near_body_cooldown_s: 60.0

# ── Where results go ───────────────────────────────────────────────
webhook_url: null
nats_alerts_url: "nats://nats-apps:4222"
nats_alerts_token: "${INTERNAL_API_KEY}"

# ── App contract (spec §03) ────────────────────────────────────────
contract_port: 9212
contract_bind_host: "0.0.0.0"
contract_host: "gold-bar-desk"
opennvr_url: "http://opennvr-core:8000"
