[project]
name = "opennvr-example-xray-screening"
version = "1.0.0"
description = "OpenNVR xray-screening example app (trays through a baggage X-ray counted, dense objects flagged)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
dependencies = [
    "opennvr-app-sdk",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.9,<5.0",
]

[tool.uv.sources]
opennvr-app-sdk = { path = "../../sdk/opennvr-app-sdk", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
xray-screening = "xray_screening:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
