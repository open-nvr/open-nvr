[project]
name = "opennvr-example-attendly"
version = "1.0.0"
description = "OpenNVR Attendly — classroom attendance from OpenNVR cameras: face enrolment and recognition through the InsightFace adapter, scheduled snapshot attendance, rooms, courses, planner and reports. Runs beside core like the Camera Agent, with its own web UI."
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }

dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "httpx>=0.27,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "apscheduler>=3.10,<4.0",
    "opennvr-app-sdk",
]

[tool.uv.sources]
opennvr-app-sdk = { path = "../../sdk/opennvr-app-sdk", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attendly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
