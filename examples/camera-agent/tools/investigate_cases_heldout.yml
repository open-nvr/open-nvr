- id: ho-morning-gate-opened-and-closed
  template: morning_site_report
  note: "The guard opened the gate and closed it again; nothing is left open."
  goal: *morning_goal
  instructions: *morning_instr
  site_facts: *depot_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: schedule, at: "2026-10-25T06:30:00+01:00"}
  options: [all_clear, review]
  tools: [search_history, describe_event, describe_camera]
  fixtures:
    search_history: "I remember 1 visit(s) between 19:00 and 06:00, all people: [#5401] 02:00–02:06 on camera gatehouse (photo kept). Faces matched: Chidi (staff) at 02:00."
    describe_event:
      - when: {event_id: 5401}
        result: "Event 5401: A guard in a high-visibility vest opening the gate for a minute, then closing and padlocking it."
      - result: "I don't have a stored photo for that event."
    describe_camera: "gatehouse: The gate is closed and padlocked; the yard is empty at dawn."
  expect:
    decision: all_clear
    needs: [search_history]

# ── investigate on request ──────────────────────────────────────────────

- id: ho-request-three-cars
  template: investigate_on_request
  goal: &request_goal >-
    An operator asked a question about the site. Find out, then answer yes,
    no, or unsure.
  site_facts: &depot_request_facts >-
    The depot has three cameras: car_park, warehouse and gatehouse. Vehicles
    enter only past the gatehouse.
  cameras: [car_park, warehouse, gatehouse]
  event: {type: operator_request, at: "2026-10-21T17:00:00+01:00", question: "Did more than two vehicles come in today?"}
  options: ["yes", "no"]
  tools: [search_history, recent_plates]
  fixtures:
    search_history: "I remember 3 car visit(s) between 00:00 and 17:00: [#6001] 08:10–08:11 on camera gatehouse, plate AB12 CDE; [#6002] 11:45–11:46 on camera gatehouse, plate FG34 HIJ; [#6003] 15:20–15:21 on camera gatehouse."
    recent_plates: "Plates on gatehouse in the last 600 minute(s):\n31800s ago — gatehouse: AB12 CDE (0.91)\n18900s ago — gatehouse: FG34 HIJ (0.88)"
  expect:
    decision: "yes"
    needs: [search_history]

- id: ho-request-was-chidi-on-shift
  template: investigate_on_request
  goal: *request_goal
  site_facts: *depot_request_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: operator_request, at: "2026-10-21T09:00:00+01:00", question: "Was Chidi on site last night?"}
  options: ["yes", "no"]
  tools: [search_history, recognize_faces]
  fixtures:
    search_history: "I remember 2 visit(s) between 19:00 and 06:00, all people: [#6101] 22:00–22:05 on camera warehouse (photo kept); [#6102] 03:30–03:34 on camera gatehouse (photo kept). Faces matched: Tunde (staff, relief guard) at 22:00, Tunde (staff, relief guard) at 03:30."
    recognize_faces: "gatehouse: no face detected"
  expect:
    decision: ["no", unsure]
    needs: [search_history]

- id: ho-request-plate-this-week
  template: investigate_on_request
  goal: *request_goal
  site_facts: *depot_request_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: operator_request, at: "2026-10-23T12:00:00+01:00", question: "Has the van with plate KX20 TRK been here this week?"}
  options: ["yes", "no"]
  tools: [search_history, recent_plates]
  fixtures:
    search_history: "I remember 1 car visit(s) with plate KX20 TRK this week: [#6201] Monday 10:15–10:16 on camera gatehouse, plate KX20 TRK."
    recent_plates: "No plates matching KX20 TRK on gatehouse in the last 120 minute(s)."
  expect:
    decision: "yes"
    needs: [search_history]

- id: ho-request-warehouse-offline
  template: investigate_on_request
  note: "The only camera that could answer is offline."
  goal: *request_goal
  site_facts: *depot_request_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: operator_request, at: "2026-10-23T20:00:00+01:00", question: "Is anyone in the warehouse right now?"}
  options: ["yes", "no"]
  tools: [camera_snapshot, describe_camera]
  fixtures:
    camera_snapshot:
      - when: {camera_id: warehouse}
        error: "warehouse appears to be offline"
      - result: "No people detected right now (from live detection 3s ago)."
    describe_camera:
      - when: {camera_id: warehouse}
        error: "warehouse appears to be offline"
      - result: "The car park and gate are empty."
  expect:
    decision: unsure
