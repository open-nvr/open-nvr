    fields: {cause: tamper}
    needs: [describe_camera]

# ── morning site report ─────────────────────────────────────────────────

- id: ho-morning-guard-and-a-fox
  template: morning_site_report
  goal: &morning_goal >-
    Write the morning check on last night (19:00 to 06:00). Decide whether the
    night was all clear or something needs a person to review it.
  instructions: &morning_instr >-
    Guards' patrols are normal. Anyone else on site at night, or anything
    left open, needs review.
  site_facts: *depot_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: schedule, at: "2026-10-21T06:30:00+01:00"}
  options: [all_clear, review]
  tools: [search_history, describe_event, describe_camera]
  fixtures:
    search_history:
      - when: {label: [car, vehicle, truck]}
        result: "No car visits remembered between 19:00 and 06:00."
      - result: "I remember 3 visit(s) between 19:00 and 06:00: [#5001] 21:30–21:36 person on camera warehouse (photo kept); [#5002] 01:10–01:11 dog on camera car_park (photo kept); [#5003] 03:40–03:46 person on camera gatehouse (photo kept). Faces matched: Chidi (staff) at 21:30, Chidi (staff) at 03:40."
    describe_event:
      - when: {event_id: 5002}
        result: "Event 5002: A fox trotting across the empty car park."
      - when: {event_id: [5001, 5003]}
        result: "A guard in a high-visibility vest checking doors with a torch."
      - result: "I don't have a stored photo for that event."
    describe_camera: "gatehouse: The gate is closed and padlocked at dawn."
  expect:
    decision: all_clear
    needs: [search_history]

- id: ho-morning-stranger-at-3am
  template: morning_site_report
  goal: *morning_goal
  instructions: *morning_instr
  site_facts: *depot_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: schedule, at: "2026-10-22T06:30:00+01:00"}
  options: [all_clear, review]
  tools: [search_history, describe_event, recognize_faces]
  fixtures:
    search_history:
      - when: {label: [car, vehicle, truck]}
        result: "No car visits remembered between 19:00 and 06:00."
      - result: "I remember 2 visit(s) between 19:00 and 06:00, all people: [#5101] 22:05–22:10 on camera warehouse (photo kept); [#5102] 03:12–03:15 on camera gatehouse (photo kept). Faces matched: Chidi (staff) at 22:05; 03:12 not recognised."
    describe_event:
      - when: {event_id: 5102}
        result: "Event 5102: A person in dark clothes trying the gatehouse door handle, then walking away."
      - when: {event_id: 5101}
        result: "A guard in a high-visibility vest on patrol."
      - result: "I don't have a stored photo for that event."
    recognize_faces: "gatehouse: no face detected"
  expect:
    decision: review
    needs: [search_history]

- id: ho-morning-shutter-half-open
  template: morning_site_report
  goal: *morning_goal
  instructions: *morning_instr
  site_facts: *depot_facts
  cameras: [car_park, warehouse, gatehouse]
