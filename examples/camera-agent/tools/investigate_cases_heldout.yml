# Held-out Investigate cases (RFC #620), written AFTER the rule tables in
# investigate_rules.yml were frozen: the rules never saw these cases. The
# order is in git (authored 22 Oct 2026, 10:23 UTC for the rules, 10:25 for
# this file): git log --follow --format='%ad %s' on both files. Same format and the same four templates as
# investigate_cases.yml, with new scenes, sites and wording. Scored the
# same way; see that file for the keys.
#
# Fixtures answer like the real tools: describe_event answers only the
# event ids the case's other results printed, "no stored photo" otherwise.

# ── night intrusion triage ──────────────────────────────────────────────

- id: ho-night-unregistered-vest
  template: night_intrusion_triage
  note: "A vest says guard, the face says nobody we know. Not settled either way."
  goal: &night_goal >-
    A person was detected on site after hours. Decide whether to ignore it,
    keep watching, or alert the night supervisor.
  instructions: &night_instr >-
    Guards on patrol are not intruders. Look at the camera before deciding.
    Alert only when someone who should not be there is on site.
  site_facts: &depot_facts >-
    The depot closes at 19:00. One night guard, Chidi, patrols from 21:00 to
    05:00 in a high-visibility vest. Nobody else is on site at night.
  cameras: [car_park, warehouse, gatehouse]
  event: {type: person_detected, camera: warehouse, at: "2026-10-20T01:32:00+01:00"}
  options: [ignore, watch, alert]
  fields: {who: [staff, visitor, intruder, animal, unknown]}
  tools: [describe_camera, recognize_faces]
  fixtures:
    describe_camera: "warehouse: One person in a high-visibility vest walking between the racks, carrying a toolbox."
    recognize_faces: "warehouse: a face is visible but not registered"
  expect:
    decision: [watch, alert]
    fields: {who: [unknown, intruder]}
    needs: [describe_camera, recognize_faces]

- id: ho-night-cat-on-wall
  template: night_intrusion_triage
  goal: *night_goal
  instructions: *night_instr
  site_facts: *depot_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: person_detected, camera: car_park, at: "2026-10-20T03:48:00+01:00", score: 0.37}
  options: [ignore, watch, alert]
  fields: {who: [staff, visitor, intruder, animal, unknown]}
  tools: [describe_camera, camera_snapshot]
  fixtures:
    describe_camera: "car_park: A cat walking along the top of the boundary wall. The car park is empty."
    camera_snapshot: "car_park: nothing detected right now"
  expect:
    decision: ignore
    fields: {who: animal}
    needs: [describe_camera]

- id: ho-night-bolt-cutters
  template: night_intrusion_triage
  goal: *night_goal
  instructions: *night_instr
  site_facts: *depot_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: person_detected, camera: car_park, at: "2026-10-20T02:05:00+01:00", zone: perimeter}
  options: [ignore, watch, alert]
  fields: {who: [staff, visitor, intruder, animal, unknown]}
  tools: [describe_camera, recognize_faces, recent_events]
  fixtures:
    describe_camera: "car_park: Two people in dark clothing cutting through the chain-link fence with bolt cutters."
    recognize_faces: "car_park: no face detected"
    recent_events: "Recent events:\n30s ago — car_park: person (0.93)\n31s ago — car_park: person (0.89)"
  expect:
    decision: alert
    fields: {who: intruder}
    needs: [describe_camera]

- id: ho-night-guard-in-the-dark
  template: night_intrusion_triage
  note: "No vest visible in the dark, but the face match is the guard."
  goal: *night_goal
  instructions: *night_instr
  site_facts: *depot_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: person_detected, camera: gatehouse, at: "2026-10-20T23:15:00+01:00"}
  options: [ignore, watch, alert]
  fields: {who: [staff, visitor, intruder, animal, unknown]}
  tools: [describe_camera, recognize_faces]
  fixtures:
    describe_camera: "gatehouse: A person shining a torch at the gate padlock; their clothing is hard to make out in the dark."
    recognize_faces: "gatehouse: recognised Chidi (staff, 91% match)"
  expect:
    decision: ignore
    fields: {who: staff}
    needs: [recognize_faces]

- id: ho-night-dog-walker-outside
  template: night_intrusion_triage
  note: "On the public pavement outside the fence, not on site."
  goal: *night_goal
  instructions: *night_instr
  site_facts: *depot_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: person_detected, camera: gatehouse, at: "2026-10-20T22:40:00+01:00"}
  options: [ignore, watch, alert]
  fields: {who: [staff, visitor, intruder, animal, unknown]}
  tools: [describe_camera, camera_snapshot]
  fixtures:
    describe_camera: "gatehouse: A person walking a dog along the public pavement outside the closed gate; they do not stop."
    camera_snapshot: "gatehouse: 1 person, 1 dog (from live detection 4s ago)"
  expect:
    decision: [ignore, watch]
    fields: {who: [visitor, unknown]}
    needs: [describe_camera]

- id: ho-night-too-dark
  template: night_intrusion_triage
  note: "The camera cannot settle it; neither can the face tool."
  goal: *night_goal
  instructions: *night_instr
  site_facts: *depot_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: person_detected, camera: car_park, at: "2026-10-20T04:10:00+01:00", score: 0.52}
  options: [ignore, watch, alert]
  fields: {who: [staff, visitor, intruder, animal, unknown]}
  tools: [describe_camera, recognize_faces]
  fixtures:
    describe_camera: "car_park: The image is too dark to make anything out; a faint shape near the far corner."
    recognize_faces: "car_park: no face detected"
  expect:
    decision: [unsure, watch]
    fields: {who: unknown}
    needs: [describe_camera]

# ── camera offline triage ───────────────────────────────────────────────

- id: ho-offline-firmware-reboot
  template: camera_offline_triage
  goal: &offline_goal >-
    A camera stopped sending video. Decide whether to wait, ask maintenance
    to look at it, or alert the supervisor, and say what most likely caused it.
  instructions: &offline_instr >-
    A short drop that has recovered needs nothing. A camera that is still
    down needs maintenance. Signs of tampering are an alert.
  site_facts: &depot_offline_facts >-
    Cameras are powered from the gatehouse switch. Updates install
    themselves overnight. Maintenance works weekdays.
  cameras: [car_park, warehouse, gatehouse]
  event: {type: camera_offline, camera: warehouse, at: "2026-10-20T03:00:30+01:00", down_for_seconds: 95}
  options: [wait, notify_maintenance, alert]
  fields: {cause: [network, power, tamper, obstruction, unknown]}
  tools: [describe_camera, recent_events]
  fixtures:
    describe_camera: "warehouse: The warehouse aisles under night lighting; nobody about."
    recent_events: "Recent events:\n20s ago — warehouse: stream reconnected\n95s ago — warehouse: firmware update applied, camera rebooting\n96s ago — warehouse: stream lost"
  expect:
    decision: wait
    fields: {cause: [power, network, unknown]}
    needs: [[describe_camera, recent_events]]

- id: ho-offline-cable-cut
  template: camera_offline_triage
  goal: *offline_goal
  instructions: *offline_instr
  site_facts: *depot_offline_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: camera_offline, camera: car_park, at: "2026-10-21T01:20:00+01:00", down_for_seconds: 600}
  options: [wait, notify_maintenance, alert]
  fields: {cause: [network, power, tamper, obstruction, unknown]}
  tools: [describe_camera, search_history, describe_event]
  fixtures:
    describe_camera: "car_park appears to be offline"
    search_history: "I remember 1 person visit(s) between 01:00 and 01:20: [#4410] 01:08–01:10 on camera car_park (photo kept)."
    describe_event:
      - when: {event_id: 4410}
        result: "Event 4410: A person in a hood at the foot of the camera pole, cutting a cable with pliers."
      - result: "I don't have a stored photo for that event."
  expect:
    decision: alert
    fields: {cause: tamper}
    needs: [describe_event]

- id: ho-offline-site-power-cut
  template: camera_offline_triage
  goal: *offline_goal
  instructions: *offline_instr
  site_facts: *depot_offline_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: camera_offline, camera: gatehouse, at: "2026-10-21T14:30:00+01:00", down_for_seconds: 1800}
  options: [wait, notify_maintenance, alert]
  fields: {cause: [network, power, tamper, obstruction, unknown]}
  tools: [describe_camera, recent_events]
  fixtures:
    describe_camera: "gatehouse appears to be offline"
    recent_events: "Recent events:\n1800s ago — gatehouse: stream lost\n1800s ago — warehouse: stream lost\n1800s ago — car_park: stream lost\n1802s ago — gatehouse switch: mains power lost, running on UPS battery"
  expect:
    decision: notify_maintenance
    fields: {cause: power}
    needs: [recent_events]

- id: ho-offline-fogged-dome
  template: camera_offline_triage
  goal: *offline_goal
  instructions: *offline_instr
  site_facts: *depot_offline_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: camera_view_lost, camera: car_park, at: "2026-10-21T06:15:00+01:00"}
  options: [wait, notify_maintenance, alert]
  fields: {cause: [network, power, tamper, obstruction, unknown]}
  tools: [describe_camera, search_history]
  fixtures:
    describe_camera: "car_park: The image is milky white; condensation has formed on the inside of the dome."
    search_history: "No person visits remembered between 05:00 and 06:15."
  expect:
    decision: notify_maintenance
    fields: {cause: obstruction}
    needs: [describe_camera]

- id: ho-offline-turned-to-the-sky
  template: camera_offline_triage
  goal: *offline_goal
  instructions: *offline_instr
  site_facts: *depot_offline_facts
  cameras: [car_park, warehouse, gatehouse]
  event: {type: camera_view_lost, camera: gatehouse, at: "2026-10-21T02:30:00+01:00"}
  options: [wait, notify_maintenance, alert]
  fields: {cause: [network, power, tamper, obstruction, unknown]}
  tools: [describe_camera, search_history, describe_event]
  fixtures:
    describe_camera: "gatehouse: The camera now shows only the night sky and the top of a lamp post."
    search_history: "I remember 1 person visit(s) between 02:00 and 02:30: [#4502] 02:14–02:17 on camera gatehouse (photo kept)."
    describe_event:
      - when: {event_id: 4502}
        result: "Event 4502: A person on a ladder twisting the camera housing upwards."
      - result: "I don't have a stored photo for that event."
  expect:
