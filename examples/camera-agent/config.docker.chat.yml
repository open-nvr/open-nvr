#
# Docker CHAT config — rendered by camera-agent-config-init-chat.
# Text chat (POST /ask) with scene description/VQA via the BLIP caption adapter.
# Runs detector + BLIP + small LLM — NO Whisper/Piper voice stack. The lighter
# way to run the same camera-agent (no microphone/speaker). ${...} placeholders
# are substituted from .env at boot.

text_mode: true

kaic_url: http://opennvr-core:8100

# Tier-0 best frame (detect-pipeline). When reachable, describe/VLM calls run
# on Tier-0's sharpest retained frame for the track instead of an arbitrary
# live grab — better answers, cheaper. Unreachable/404 falls back to the live
# grab automatically, so this is safe to leave on even if Tier-0 is disabled.
bestframe_base_url: http://detect-pipeline:9109
kaic_api_key: ${INTERNAL_API_KEY}

ollama_url: ${OLLAMA_URL}
ollama_token:
llm_model: ${OLLAMA_MODEL}
llm_think: false   # Qwen3 default: snappy non-thinking tool-calling
llm_temperature: 0.3
llm_max_tokens: 220
# See config.docker.yml — 13 tool schemas + the system prompt overflow the
# 4096 default, and Ollama truncates the system prompt first on overflow.
llm_num_ctx: 8192

# detect_objects -> YOLOv8 (name "default"); describe_camera -> the caption/VQA
# adapter selected by CAPTION_ADAPTER (auto-registered by caption-adapter-register
# once healthy). describe_camera falls back to the detector until it registers.
detection_adapter: default
caption_adapter: ${CAPTION_ADAPTER}   # moondream (default) — auto-registered by caption-adapter-register
recognition_adapter: insightface

enabled_tools:
  - detect_objects
  - describe_camera
  - recent_events
  # The NVR's memory (events store, backed by opennvr_api_url below —
  # already set for the app door): past-tense questions like "did anyone
  # come today / between 3 and 4?" and follow-ups on a remembered visit.
  - search_history
  - describe_event
  - describe_window
  - create_monitor
  - stop_monitor
  - create_alarm
  - stop_alarm
  # Reads the footage-search app's index (mounted read-only at /footage);
  # reports cleanly until the apps overlay has built it.
  - search_footage
  # The app door (read-only): answers about the default-on catalog apps.
  - list_apps
  - app_status
  - recent_app_alerts

# See config.docker.yml — same read-only mount, same self-healing reader.
footage_index_path: /footage/footage_index.sqlite3

frame_cache_ttl_seconds: 2.0
event_ring_size: 256

opennvr_cameras_url: http://opennvr-core:8000/api/v1/internal/camera-agent/cameras
opennvr_api_key: ${INTERNAL_API_KEY}

# Browser-facing OpenNVR origin — feeds opennvr_ui_url (deep-links to AI
# Adapters / App Catalog when a skill is greyed out). The HOST origin the
# operator's browser reaches OpenNVR at; defaults to http://localhost:8000.
# Override via OPENNVR_UI_URL in .env for LAN/remote installs.
opennvr_base_url: ${OPENNVR_UI_URL}

# App door (read-only): fetched FROM INSIDE the container — must be the
# compose-internal service name, NOT the browser-facing URL, or the app door
# silently never works under compose (localhost:8000 = the agent itself).
opennvr_api_url: http://opennvr-core:8000

# Require an OpenNVR sign-in before anyone can talk to the agent (bearer
# tokens validated against opennvr_api_url, mapped to viewer/operator/admin
# by role). The /demo page shows a branded login. Set "none" for an open
# throwaway demo only.
auth_mode: opennvr

# TLS: self-signed pair from camera-agent-certs-init (see config.docker.yml).
tls_certfile: /certs/server.crt
tls_keyfile: /certs/server.key

nats_inference_url: nats://nats:4222
nats_inference_token: ${INTERNAL_API_KEY}

host: ${CAMERA_AGENT_LISTEN_HOST}
port: 9100
cameras: []

system_prompt: |
  You are a concise camera assistant. Answer ONLY from tool results — call a
  tool before describing what any camera shows; never guess. Prefer
  describe_camera for "what's happening / what do you see" questions and
  detect_objects for counting. Questions in the PAST TENSE are about
  history, never the current scene: "did anyone come in the last N
  minutes?" → recent_events (window_seconds = N*60); "did you see a person
  today / between 3 and 4?" → search_history; "what was that person
  doing?" about a found visit → describe_event with its [#id]; searching
  by appearance ("did a red truck come by?") → search_footage. Keep
  replies to 1-2 short sentences.
