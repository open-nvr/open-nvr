[project]
name = "opennvr-example-camera-agent"
version = "1.0.0"
description = "OpenNVR camera-agent example — a voice agent that grounds its answers in live camera feeds via tool calling. Pipecat + Silero VAD + Whisper + Ollama + Piper, CPU-friendly."
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }

# Pipecat handles the conversational orchestration (VAD, turn
# detection, streaming, tool calling). httpx talks to our adapters.
# nats-py taps the inference event bus for the recent_events tool.
# Pillow re-encodes camera frames to JPEG for the vision adapters.
#
# Pipecat 1.8+: the universal LLMContext + LLMContextAggregatorPair,
# user-turn strategies (Silero VAD to start, Smart Turn v3 — the
# semantic end-of-turn model, bundled in the wheel and run on CPU with
# onnxruntime — to stop), and services under pipecat.services.*_service.
# The 0.0.5x API this agent was born on (FrameSerializerType,
# OpenAILLMContext, vad_analyzer on the transport) is gone; the port
# lives in serializer.py / services.py / build_pipeline_task.
dependencies = [
    "pipecat-ai[silero,websocket]>=1.8.1,<2.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
    "nats-py>=2.6",
    "Pillow>=10.0",
    # App SDK convergence (app-sdk-spec §07): create_monitor's count/
    # crossing watches instantiate SDK detectors (the occupancy-counting
    # and line-crossing example rule classes) via monitor_host.MonitorHost
    # instead of the bespoke poll loops.
    "opennvr-app-sdk",
]

[tool.uv.sources]
opennvr-app-sdk = { path = "../../sdk/opennvr-app-sdk", editable = true }

[project.optional-dependencies]
# Local capture-device cameras (device:0 / webcam / drone /dev/video) need
# OpenCV. Headless build = no GUI libs, right for servers/containers
# (test-report cross-cutting #3). Imported lazily so the rest works without it.
device = [
    "opencv-python-headless>=4.8",
]
# notify_apprise channels (email/Telegram/ntfy/Pushover/… — see
# NOTIFICATIONS.md). Imported lazily; configured URLs no-op without it.
notify = [
    "apprise>=1.7",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
