<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenNVR Camera Agent Lite</title>
<style>
  :root { --bg:#0f1420; --panel:#161d2b; --line:#26304a; --txt:#e6ebf5;
          --muted:#8a97b1; --accent:#4f8cff; --user:#243756; --bot:#1b2536; --rec:#e0574d; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:12px; background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:#3a4a66; }
  .pill { font-size:12px; color:var(--muted); border:1px solid var(--line);
          border-radius:999px; padding:2px 10px; }
  #chat { flex:1; overflow-y:auto; padding:22px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin:10px 0; display:flex; }
  .msg .bubble { padding:10px 14px; border-radius:14px; max-width:80%; white-space:pre-wrap; }
  .user { justify-content:flex-end; }
  .user .bubble { background:var(--user); border-bottom-right-radius:4px; }
  .bot .bubble { background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .who { font-size:11px; color:var(--muted); margin:0 6px 2px; }
  form { display:flex; gap:10px; padding:14px 22px; border-top:1px solid var(--line);
         max-width:820px; width:100%; margin:0 auto; background:var(--bg); align-items:center; }
  input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--txt);
          border-radius:10px; padding:12px 14px; font-size:15px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { border:0; border-radius:10px; cursor:pointer; font-weight:600; }
  #send { background:var(--accent); color:#fff; padding:0 18px; height:44px; }
  #mic { width:46px; height:46px; border-radius:50%; background:var(--panel);
         border:1px solid var(--line); font-size:20px; color:var(--txt); flex:0 0 auto;
         display:flex; align-items:center; justify-content:center; transition:.15s; }
  #mic.listening { background:var(--rec); border-color:var(--rec); animation:pulse 1.1s infinite; }
  #mic.thinking { opacity:.6; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(224,87,77,.5)} 100%{box-shadow:0 0 0 14px rgba(224,87,77,0)} }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--muted); font-size:13px; text-align:center; margin-top:8px; }
  .ex { display:inline-block; margin:4px; padding:5px 10px; border:1px solid var(--line);
        border-radius:999px; color:var(--muted); cursor:pointer; font-size:13px; }
  .ex:hover { border-color:var(--accent); color:var(--txt); }
  #vstat { font-size:12px; color:var(--muted); min-width:70px; }
</style></head>
<body>
  <header>
    <span class="dot" id="dot" style="background:#e0a33a"></span>
    <h1>OpenNVR Camera Agent Lite</h1>
    <span class="pill" id="stat">connecting…</span>
    <span style="flex:1"></span>
    <span class="pill">CPU · local · llama.cpp</span>
  </header>
  <div id="chat">
    <div class="bot msg"><div><div class="who">agent</div>
      <div class="bubble">Hi — type, or tap the mic and talk. I answer from your live OpenNVR cameras.</div></div></div>
    <div class="hint">
      <span class="ex">list cameras</span>
      <span class="ex">is camera one online</span>
      <span class="ex">what is happening on camera one</span>
      <span class="ex">what time is it</span>
    </div>
  </div>
  <form id="f">
    <button type="button" id="mic" title="Tap to talk">🎤</button>
    <span id="vstat"></span>
    <input id="q" placeholder="Ask about your cameras…" autocomplete="off" autofocus>
    <button id="send">Send</button>
  </form>
<script>
const chat=document.getElementById('chat'), f=document.getElementById('f'), q=document.getElementById('q'),
      send=document.getElementById('send'), stat=document.getElementById('stat'), dot=document.getElementById('dot'),
      mic=document.getElementById('mic'), vstat=document.getElementById('vstat');
let voiceReady=false;
function add(who,text,cls){const m=document.createElement('div');m.className='msg '+cls;
  m.innerHTML='<div><div class="who">'+who+'</div><div class="bubble"></div></div>';
  m.querySelector('.bubble').textContent=text;chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return m;}
async function refresh(){try{const s=await (await fetch('/api/status')).json();
  if(s.ready){const c=(s.cameras||[]).length; voiceReady=!!s.voice;
    stat.innerHTML=c+' cam'+(c==1?'':'s')+' · LLM '+(s.llm?'on':'off')+' · VLM '+(s.vlm?'on':'off')+' · voice '+(s.voice?'on':'off');
    dot.style.background=s.llm?'#43c06a':'#e0a33a'; mic.style.display=s.voice?'flex':'none';}
  else { stat.textContent='starting up… (warming adapters, ~1 min)'; dot.style.background='#e0a33a'; }}
  catch(e){stat.textContent='offline';dot.style.background='#d05a5a';}}
async function ask(text){add('you',text,'user');q.value='';send.disabled=true;
  const t=add('agent','…','bot');
  try{const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});
    const j=await r.json(); t.querySelector('.bubble').textContent=j.answer;}
  catch(e){t.querySelector('.bubble').textContent='(request failed)';}
  send.disabled=false;q.focus();}
f.addEventListener('submit',e=>{e.preventDefault();const v=q.value.trim();if(v)ask(v);});
document.addEventListener('click',e=>{if(e.target.classList.contains('ex'))ask(e.target.textContent);});

// ---- voice ----------------------------------------------------------------
// PRIMARY: live streaming over /ws — the server runs a Pipecat pipeline
// (Silero VAD turn detection, whisper.cpp STT, tool-calling LLM, sentence-
// streamed Piper TTS). Mic PCM (16k int16) streams up; reply PCM (22050)
// streams back and plays as it arrives. Raw-PCM protocol = audio only, so
// streamed turns don't render transcripts (type to see text).
// FALLBACK: if the WebSocket can't be established, the old record-one-
// utterance -> POST /voice path (which does show transcripts) takes over.
let live=false, ws=null, lctx=null, lsrc=null, lproc=null, lzero=null, lstream=null, playT=0;
const SPEECH_RMS=0.02, START_FRAMES=2, SILENCE_HANG=1.5, MIN_AFTER_SPEECH=1.0, MAX_REC=15.0;
let rec=false, actx, src, proc, zero, stream, chunks=[], preroll=[],
    hadSpeech=false, silence=0, speechRun=0, startAt=0, curAudio=null;
mic.addEventListener('click',()=>{
  if(live){ stopLive(); return; }
  if(rec){ stopVoice(true); return; }
  startLive();                       // falls back to startVoice() on ws failure
});
function setMic(s){ mic.className='';
  if(s==='live'){mic.classList.add('listening');vstat.textContent='live — speak anytime (tap to stop)';}
  else if(s==='listening'){mic.classList.add('listening');vstat.textContent='listening… (tap to send)';}
  else if(s==='thinking'){mic.classList.add('thinking');vstat.textContent='thinking…';} else {vstat.textContent='';} }

// ---- live streaming (/ws + Pipecat) ----
async function startLive(){
  if(curAudio){ try{curAudio.pause();}catch(e){} curAudio=null; }
  try{ lstream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ add('agent','Microphone access was denied.','bot'); return; }
  const proto=location.protocol==='https:'?'wss':'ws';
  let opened=false;
  try{ ws=new WebSocket(proto+'://'+location.host+'/ws'); }
  catch(e){ ws=null; startVoice(lstream); return; }
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{ opened=true; live=true; playT=0; setMic('live'); beginLiveCapture();
    add('agent','🎙 live voice on — answers are spoken. (Streamed turns don\'t show transcripts; type to chat in text.)','bot'); };
  ws.onmessage=(e)=>{ if(e.data instanceof ArrayBuffer) playPcm(e.data); };
  ws.onerror=()=>{ if(!opened){ const s=lstream; lstream=null; try{ws.close();}catch(_){} ws=null; startVoice(s); } };
  ws.onclose=()=>{ if(opened && live) stopLive(); };
}
function beginLiveCapture(){
  lctx=new (window.AudioContext||window.webkitAudioContext)();
  lsrc=lctx.createMediaStreamSource(lstream);
  lproc=lctx.createScriptProcessor(4096,1,1);
  lzero=lctx.createGain(); lzero.gain.value=0;
  lproc.onaudioprocess=(e)=>{
    if(!live||!ws||ws.readyState!==1) return;
    // Half-duplex gate: don't stream the mic while the reply is playing —
    // interruptions are off server-side, and this stops echo re-triggering VAD.
    if(lctx && playT>lctx.currentTime+0.05) return;
    const ds=downsample(new Float32Array(e.inputBuffer.getChannelData(0)), lctx.sampleRate, 16000);
    const i16=new Int16Array(ds.length);
    for(let i=0;i<ds.length;i++){ const x=Math.max(-1,Math.min(1,ds[i])); i16[i]=x<0?x*0x8000:x*0x7fff; }
    try{ ws.send(i16.buffer); }catch(_){}
  };
  lsrc.connect(lproc); lproc.connect(lzero); lzero.connect(lctx.destination);
}
function playPcm(ab){
  if(!lctx) return;
  const i16=new Int16Array(ab); if(!i16.length) return;
  const buf=lctx.createBuffer(1,i16.length,22050);       // ctx resamples on play
  const ch=buf.getChannelData(0);
  for(let i=0;i<i16.length;i++) ch[i]=i16[i]/32768;
  const node=lctx.createBufferSource(); node.buffer=buf; node.connect(lctx.destination);
  const start=Math.max(lctx.currentTime+0.06, playT);
  node.start(start); playT=start+buf.duration;
}
function stopLive(){
  live=false; setMic('idle');
  try{ if(ws) ws.close(); }catch(_){} ws=null;
  try{ lproc&&lproc.disconnect(); lsrc&&lsrc.disconnect(); }catch(_){}
  try{ lstream&&lstream.getTracks().forEach(t=>t.stop()); }catch(_){} lstream=null;
  try{ lctx&&lctx.close(); }catch(_){} lctx=null; playT=0;
}
async function startVoice(existing){
  if(curAudio){ try{curAudio.pause();}catch(e){} curAudio=null; }   // don't listen over the reply
  if(existing){ stream=existing; }
  else{
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
    catch(e){ add('agent','Microphone access was denied.','bot'); return; }
  }
  actx=new (window.AudioContext||window.webkitAudioContext)();
  src=actx.createMediaStreamSource(stream);
  proc=actx.createScriptProcessor(4096,1,1);
  zero=actx.createGain(); zero.gain.value=0;   // silent sink: keeps the graph alive, no feedback
  chunks=[]; preroll=[]; hadSpeech=false; silence=0; speechRun=0; rec=true; setMic('listening');
  proc.onaudioprocess=(e)=>{
    const d=e.inputBuffer.getChannelData(0), c=new Float32Array(d);
    let s=0; for(let i=0;i<d.length;i++) s+=d[i]*d[i]; const rms=Math.sqrt(s/d.length);
    const dt=d.length/actx.sampleRate, speech=rms>SPEECH_RMS; speechRun=speech?speechRun+1:0;
    if(!hadSpeech){
      preroll.push(c); if(preroll.length>4) preroll.shift();        // ~350ms preroll
      if(speechRun>=START_FRAMES){ hadSpeech=true; startAt=actx.currentTime; chunks=preroll.slice(); silence=0; }
      return;
    }
    chunks.push(c);
    if(speech) silence=0; else silence+=dt;
    const el=actx.currentTime-startAt;
    if(el>MIN_AFTER_SPEECH && silence>SILENCE_HANG) stopVoice(false);
    else if(el>MAX_REC) stopVoice(false);
  };
  src.connect(proc); proc.connect(zero); zero.connect(actx.destination);
}
async function stopVoice(manual){
  if(!rec) return; rec=false;
  try{ proc.disconnect(); src.disconnect(); stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  const from=actx.sampleRate; try{actx.close();}catch(e){}
  if(!hadSpeech && !manual){ setMic('idle'); return; }              // never heard you: ignore
  setMic('thinking');
  let n=0; chunks.forEach(c=>n+=c.length);
  if(n===0){ setMic('idle'); return; }
  const flat=new Float32Array(n); let o=0; chunks.forEach(c=>{flat.set(c,o);o+=c.length;});
  const ds=downsample(flat, from, 16000);
  if(ds.length < 16000*0.4){ vstat.textContent='too short'; setTimeout(()=>{vstat.textContent='';},1200); return; }
  const i16=new Int16Array(ds.length);
  for(let i=0;i<ds.length;i++){ let x=Math.max(-1,Math.min(1,ds[i])); i16[i]=x<0?x*0x8000:x*0x7fff; }
  const t=add('you','🎤 …','user');
  try{
    const r=await fetch('/voice',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:i16.buffer});
    const j=await r.json();
    t.querySelector('.bubble').textContent=j.transcript||'(couldn\'t make that out)';
    add('agent', j.answer||'…','bot');
    if(j.audio){ curAudio=new Audio('data:audio/wav;base64,'+j.audio); curAudio.play().catch(()=>{}); }
  }catch(e){ t.querySelector('.bubble').textContent='(voice request failed)'; }
  setMic('idle');
}
function downsample(buf, from, to){ if(to>=from) return buf; const r=from/to, nl=Math.round(buf.length/r), out=new Float32Array(nl);
  for(let i=0;i<nl;i++){ const idx=i*r, i0=Math.floor(idx), i1=Math.min(i0+1,buf.length-1), fr=idx-i0; out[i]=buf[i0]*(1-fr)+buf[i1]*fr; } return out; }

refresh(); setInterval(refresh,5000);
</script></body></html>
