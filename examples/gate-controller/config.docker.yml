#
# gate-controller config consumed by docker-compose.apps.yml.
# ${INTERNAL_API_KEY} is substituted by the config-init container at
# compose-up time (same pattern as the other shipped apps).
#
# The gate map is OPERATOR CONFIG: set it from the App Catalog's
# Configure form (applied live), or edit here and re-up. Dry run ships
# ON so a fresh install can never move hardware by surprise —
# commission the site, prove the wiring with the Test pulse button on
# the Gates page, then turn it off from the catalog.

nats_url: "nats://nats:4222"
nats_token: "${INTERNAL_API_KEY}"

# Which wiring opens which gate. Empty until you configure it; see
# HARDWARE.md for the transports and the per-vendor wiring.
gates: {}

pulse_cooldown_seconds: 5.0
dry_run: true

# Display and cadence.
assumed_open_seconds: 20.0
poll_seconds: 5.0
max_hold_minutes: 120.0

# Local guards — off by default; the plate reader is the decider.
min_confidence: 0.0
allowed_reasons: []
max_opens_per_plate: 0
max_opens_window_minutes: 10.0

webhook_url: null
nats_alerts_url: "nats://nats:4222"
nats_alerts_token: "${INTERNAL_API_KEY}"

contract_port: 9210
contract_bind_host: "0.0.0.0"
contract_host: "gate-controller"   # the compose service name
opennvr_url: "http://opennvr-core:8000"
