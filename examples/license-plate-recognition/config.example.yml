#
# Sample config for the license-plate-recognition example app.
# Copy to config.yml, edit, then:
#
#   python license_plate_recognition.py --config config.yml
#
# Required fields are marked `# REQUIRED`. Everything else has a
# documented default — drop the line to take it.
#
# v2 (RFC-0002 Phase 4): this app is a PURE CONSUMER of the platform's
# plate.recognized.v1 events. It never opens a camera stream and never
# calls an inference adapter — the detect→crop→OCR chain runs inside
# the platform (Tier-1 dispatch on assigned cameras, or core's
# per-visit enrichment), once per vehicle visit on the best frame.

# REQUIRED — the NATS bus plate.recognized.v1 flows on. On the compose
# stack this is nats://nats:4222; on a dev host, nats://127.0.0.1:4222.
nats_url: nats://127.0.0.1:4222
# The bus token, when your broker requires one (the compose stack uses
# INTERNAL_API_KEY).
nats_token: null

# Camera scope. Default: cameras assigned the license_plate_recognition
# skill in the assignment table (resolved via opennvr_url, refreshed
# live). An explicit list overrides; empty + no opennvr_url = alert on
# every camera's plate events.
cameras: []

# Plate-level dedup: don't re-fire the same plate within this window
# (per camera). 0 fires every read.
dedup_window_seconds: 60.0

# Drop reads below this OCR confidence (0 keeps all; reads without a
# reported confidence always pass).
min_confidence: 0.0

# Optional plate watchlists (case-insensitive). allowlist reads fire
# low-severity "expected vehicle" alerts; denylist reads fire
# high-severity "watchlist plate" alerts; unlisted plates fire
# info-severity reads.
allowlist: []
# allowlist: ["AB12CDE"]
denylist: []
# denylist: ["BAD001"]

# ── Alert delivery ──────────────────────────────────────────────────
# Alerts always print to stdout. Optionally also:
webhook_url: null                    # POST each alert as JSON
nats_alerts_url: null                # fan alerts back onto the bus
nats_alerts_token: null

# ── App contract (spec §03) ─────────────────────────────────────────
# Serve /health /manifest /state and self-register with the OpenNVR
# app registry. All optional for bare dev runs.
contract_port: null                  # e.g. 9205
contract_bind_host: null             # e.g. 0.0.0.0
contract_host: null                  # how core reaches this app
opennvr_url: null                    # e.g. http://127.0.0.1:8000
opennvr_token: null                  # registry + assignment-scope auth
