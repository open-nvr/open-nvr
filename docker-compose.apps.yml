    # <image>@sha256:<digest>, and compose then PULLS that exact ref
    # instead of using the build. See docs/APPS_INSTALL.md → Digest pinning.
    image: ${LINE_CROSSING_IMAGE:-opennvr/line-crossing:local-build}
    container_name: opennvr_line_crossing
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      line-crossing-config-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      opennvr-core:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    environment:
      # The SDK's registration/config-poll token rides this env var.
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NATS_URL=nats://nats:4222
      - OPENNVR_URL=http://opennvr-core:8000
      # Egress: apps sit on the internal opennvr_apps network; the only
      # way out is the egress proxy, which asks core whether THIS app may
      # reach the host (declared in its listing, or allowed by the
      # operator from the catalog). HTTP libraries honour these
      # automatically; NO_PROXY keeps the stack's own services direct.
      # Empty APPS_EGRESS_PROXY_URL in .env switches the proxy off.
      - HTTP_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - HTTPS_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,detect-pipeline,ollama,localhost,127.0.0.1
