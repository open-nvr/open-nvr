  # ──────────────────────────────────────────────────────────────
  # Intrusion detection — restricted-zone + restricted-hours alerts
  # for watched labels; drives inference through KAI-C (FrameApp).
  # Contract surface on :9204.
  # ──────────────────────────────────────────────────────────────
  intrusion-detection-config-init:
    profiles: [apps, intrusion-detection]
    image: alpine:3.20
    container_name: opennvr_intrusion_config_init
    logging: *svc-logs
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (intrusion-detection) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./examples/intrusion-detection:/template:ro
      - opennvr_intrusion_detection_config:/generated

  intrusion-detection:
    profiles: [apps, intrusion-detection]
    build:
      context: .
      dockerfile: examples/intrusion-detection/Dockerfile
    # Digest pin slot — see docs/APPS_INSTALL.md → Digest pinning.
    image: ${INTRUSION_DETECTION_IMAGE:-opennvr/intrusion-detection:local-build}
    container_name: opennvr_intrusion_detection
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      intrusion-detection-config-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      opennvr-core:
        # Core serves the app registry this app self-registers with, and
        # the camera/zone config and snapshots it reads. Detections come
        # off the bus (Tier-0), not from KAI-C — this app drives no
        # inference of its own.
        condition: service_healthy
      egress-proxy:
        condition: service_started
    environment:
      # The SDK's registration call reads the token from this env var
      # (cfg opennvr_token wins when set; the template leaves it unset).
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Informational — the effective values live in the generated
      # config.yml (see the config-init container above).
      - NATS_URL=nats://nats:4222
      - OPENNVR_URL=http://opennvr-core:8000
      # Egress: apps sit on the internal opennvr_apps network; the only
      # way out is the egress proxy, which asks core whether THIS app may
      # reach the host (declared in its listing, or allowed by the
      # operator from the catalog). HTTP libraries honour these
      # automatically; NO_PROXY keeps the stack's own services direct.
      # Empty APPS_EGRESS_PROXY_URL in .env switches the proxy off.
      - HTTP_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - HTTPS_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,detect-pipeline,ollama,localhost,127.0.0.1
    # Contract surface (/health /manifest /state) — internal-only; the
    # registry polls it over the compose network. Add a
    # ``127.0.0.1:9204:9204`` port mapping to poke it from the host.
    expose:
      - "9204"
    volumes:
      - opennvr_intrusion_detection_config:/app/config:ro
    command:
      - --config
      - /app/config/config.yml
    networks:
      - opennvr_apps

  # ──────────────────────────────────────────────────────────────
  # fast-plate-ocr adapter — the OCR half of the LPR chain. Shipped
  # WITH the app (RFC-0002 decision 7 / Phase 3 fast-track): before
  # this, `--profile apps up license-plate-recognition` succeeded and
  # produced an app that could never work — nothing ran or registered
  # its OCR dependency, so every plate read 404'd at KAI-C. An app's
  # required adapters install with the app; an already-present adapter
  # is reused, never duplicated.
  # Weights (~3 MB) download on first load() into /root/.cache; the
  # volume keeps that across container recreates (and can be pre-warmed
  # for air-gapped installs — see the adapter's Dockerfile notes).
  # ──────────────────────────────────────────────────────────────
  # Body keypoints. Rules about what a person is DOING — a hand
  # scanner sweeping an arm, a fall, a gesture — need joints, not
  # boxes, and no adapter in the default stack produced them.
  # ──────────────────────────────────────────────────────────────
  # Pose weights init — copies the pre-exported ONNX into the volume the
  # adapter reads. The pose model is the one weight in the stack with no
  # download: Ultralytics publishes the .pt, never the ONNX, so somebody
  # has to export it. Before this existed that somebody was the operator,
  # and a fresh install got an adapter that started, answered /health and
  # failed every /infer on a missing file — with nothing anywhere saying
  # why. Bring your own model by pointing YOLO_POSE_WEIGHTS_IMAGE at it.
  yolo-pose-weights-init:
    profiles: [apps, guard-scan-compliance]
    image: ${YOLO_POSE_WEIGHTS_IMAGE:-ghcr.io/open-nvr/yolo-pose-weights:v8.3.0}
    # Build it here if it cannot be pulled. Without this fallback a
    # fresh install is at the mercy of one registry: an unpublished
    # image, a private package, a blocked ghcr.io — any of them ends
    # with "error from registry: denied", no weights, and (because the
    # adapter waits on this) no pose adapter at all. The build needs
    # only Docker Hub, so the two failure modes do not overlap.
    #
    # It is a LAST resort, not the normal path. The export pulls the
    # ~7 GB ultralytics base (amd64-only, but a plain manifest rather
    # than an index, so it still runs under emulation elsewhere) and
    # then takes ~30 s — against ~5 s to pull the finished 17 MB
    # image. `pull_policy: missing` keeps the published image first
    # whenever it can be had.
    build:
      context: examples/yolo-pose-weights
      dockerfile: Dockerfile
    pull_policy: missing
    container_name: opennvr_yolo_pose_weights_init
    logging: *svc-logs
    restart: "no"
    # List-form command, as yolov8-weights-init explains at length:
    # compose word-splits a STRING command, so `sh -c set -e ...` would
    # run only `set`, exit 0, and copy nothing — leaving an empty volume
    # and an adapter that 503s every request.
    entrypoint: ["sh", "-ec"]
    command:
      - |
        WEIGHTS=/weights/yolo11n-pose.onnx
        if [ -s "$$WEIGHTS" ]; then
          echo "yolo11n-pose.onnx already present at $$WEIGHTS (size: $$(wc -c < $$WEIGHTS) bytes); skipping."
          exit 0
        fi
        echo "Copying pre-baked yolo11n-pose.onnx into volume..."
        cp /yolo11n-pose.onnx "$$WEIGHTS"
        echo "Wrote $$(wc -c < $$WEIGHTS) bytes to $$WEIGHTS."
    volumes:
      - opennvr_yolo_pose_weights:/weights

  yolo-pose-adapter:
    profiles: [apps, guard-scan-compliance]
    # YOLO_POSE_ADAPTER_TAG lets the pose image ride a different tag
    # than the rest, exactly as CAPTION_ADAPTER_TAG does for captions
    # and for the same reason: ADAPTER_TAG is ONE tag applied to every
    # adapter, and the pose adapter is not in the releases it names.
    # There is no yolo-pose-adapter:0.1.5 — the only tags that image has
    # are a branch and two shas — so a fresh install pinned to the
    # tested release could not pull it at all, and the whole app died on
    # a tag that never existed.
    # ...which is also why ADAPTER_TAG is NOT the fallback here. An
    # operator upgrading into this branch has ADAPTER_TAG=0.1.5 already
    # in their .env and no YOLO_POSE_ADAPTER_TAG, so the chain resolved
    # to exactly the tag the paragraph above says does not exist — and
    # unlike yolo-pose-weights-init this service has no build context to
    # fall back to (the image is built in the ai-adapter repo), so the
    # pull fails and takes the whole `--profile apps up` down with it,
    # including the loitering / intrusion / LPR apps that were running
    # perfectly well before.
    image: ghcr.io/open-nvr/yolo-pose-adapter:${YOLO_POSE_ADAPTER_TAG:-latest}
    depends_on:
      # Start only once the graph is on disk. Without this the adapter
      # races the copier, loses, and reports itself healthy anyway —
      # because /health answers before a model is ever loaded.
      yolo-pose-weights-init:
        condition: service_completed_successfully
    container_name: opennvr_yolo_pose_adapter
    logging: *svc-logs
    restart: unless-stopped
    environment:
      - OPENNVR_ADAPTER_TOKEN=${INTERNAL_API_KEY}
      # Smaller input is the CPU lever: an app watching a doorway wants
      # frame RATE, and the wrist-to-torso geometry survives the loss.
      - OPENNVR_POSE_IMGSZ=${OPENNVR_POSE_IMGSZ:-448}
      # The image ships without weights; yolo-pose-weights-init above
      # puts them in the volume, which is why this is normally empty.
      # Set it only to host the exported .onnx yourself and have the
      # adapter fetch it at first boot instead. Empty means "never
      # download" — the sovereignty=local_only posture.
      - YOLO_POSE_MODEL_URL=${YOLO_POSE_MODEL_URL:-}
    volumes:
      - opennvr_yolo_pose_weights:/weights
      - opennvr_yolo_pose_cache:/root/.cache
    networks:
      - opennvr_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, sys; sys.exit(0 if httpx.get('http://127.0.0.1:9009/health', timeout=2).status_code == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20

  yolo-pose-register:
    profiles: [apps, guard-scan-compliance]
    image: alpine:3.20
    container_name: opennvr_yolo_pose_register
    logging: *svc-logs
    restart: "no"
    depends_on:
      opennvr-core:
        condition: service_healthy
      yolo-pose-adapter:
        condition: service_healthy
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command:
      - sh
      - -c
      - |
        set -e
        name="yolo-pose"
        url="http://yolo-pose-adapter:9009"
        echo "Auto-registering '$$name' -> $$url with KAI-C…"
        i=0
        while [ $$i -lt 30 ]; do
          if wget -q -O- \
               --header="Content-Type: application/json" \
               --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
               --post-data="{\"name\":\"$$name\",\"url\":\"$$url\"}" \
               http://opennvr-core:8100/api/v1/adapters/register >/dev/null 2>&1; then
            echo "Registered '$$name'."
            if wget -q -O- \
                 --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
                 --header="X-Actor: install" \
                 --post-data="" \
                 "http://opennvr-core:8100/api/v1/adapters/$$name/permissions/approve-all" >/dev/null 2>&1; then
              echo "Approved '$$name' declared permissions (install-time grant, audited)."
            else
              echo "WARN: could not approve '$$name' permissions — if OCR 403s, grant them via the AI models page." >&2
            fi
            exit 0
          fi
          i=$$((i+1)); echo "register attempt $$i/30 failed (adapter warming up?); retry in 5s"; sleep 5
        done
        echo "WARN: could not register '$$name' after retries — screening checks will 404 until it is registered via the AI models page." >&2
        exit 0
    networks:
      - opennvr_internal

  # ──────────────────────────────────────────────────────────────
  fast-plate-ocr-adapter:
    profiles: [apps, license-plate-recognition]
    image: ghcr.io/open-nvr/fast-plate-ocr-adapter:${ADAPTER_TAG:-latest}
    container_name: opennvr_fast_plate_ocr_adapter
    logging: *svc-logs
    restart: unless-stopped
    environment:
      - OPENNVR_ADAPTER_TOKEN=${INTERNAL_API_KEY}
      # Read quality knobs (see .env.example "Plate OCR quality"):
      # the OCR weights (cct-s-v2-global-model is the current best
      # general model; european-plates-mobile-vit-v2-model for EU
      # plates), and the smallest localised plate worth OCR-ing — a
      # plate narrower than this has ~5px characters and the model
      # guesses; a distant car should produce NO read, not a wrong one.
      - OPENNVR_LPR_MODEL=${OPENNVR_LPR_MODEL:-cct-s-v2-global-model}
      - OPENNVR_LPR_MIN_PLATE_PX=${OPENNVR_LPR_MIN_PLATE_PX:-80}
      - OPENNVR_LPR_MIN_CONFIDENCE=${OPENNVR_LPR_MIN_CONFIDENCE:-0.45}
    volumes:
      - opennvr_fast_plate_ocr_cache:/root/.cache
    networks:
      - opennvr_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, sys; sys.exit(0 if httpx.get('http://127.0.0.1:9004/health', timeout=2).status_code == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20

  # One-shot KAI-C registration for the OCR adapter — same pattern as
  # the camera-agent overlay's caption-adapter-register. The name MUST
  # be ``fast_plate_ocr``: it becomes KAI-C's route
  # /api/v1/infer/fast_plate_ocr, which is what the app's
  # ``ocr_adapter`` config names. Registration also puts the adapter on
  # the AI Adapters page (60s health + metrics poll), so a dead OCR
  # becomes a red row instead of a mystery. Always exits 0: a failed
  # registration degrades to a WARN + the app's own KAI-C 404 handling,
  # never a wedged compose up.
  fast-plate-ocr-register:
    profiles: [apps, license-plate-recognition]
    image: alpine:3.20
    container_name: opennvr_fast_plate_ocr_register
    logging: *svc-logs
    restart: "no"
    depends_on:
      opennvr-core:
        condition: service_healthy
      fast-plate-ocr-adapter:
        condition: service_healthy
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command:
      - sh
      - -c
      - |
        set -e
        name="fast_plate_ocr"
        url="http://fast-plate-ocr-adapter:9004"
        echo "Auto-registering '$$name' -> $$url with KAI-C…"
        i=0
        while [ $$i -lt 30 ]; do
          if wget -q -O- \
               --header="Content-Type: application/json" \
               --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
               --post-data="{\"name\":\"$$name\",\"url\":\"$$url\"}" \
               http://opennvr-core:8100/api/v1/adapters/register >/dev/null 2>&1; then
            echo "Registered '$$name'."
            if wget -q -O- \
                 --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
                 --header="X-Actor: install" \
                 --post-data="" \
                 "http://opennvr-core:8100/api/v1/adapters/$$name/permissions/approve-all" >/dev/null 2>&1; then
              echo "Approved '$$name' declared permissions (install-time grant, audited)."
            else
              echo "WARN: could not approve '$$name' permissions — if OCR 403s, grant them via the AI models page." >&2
            fi
            exit 0
          fi
          i=$$((i+1)); echo "register attempt $$i/30 failed (adapter warming up?); retry in 5s"; sleep 5
        done
        echo "WARN: could not register '$$name' after retries — plate reads will 404 until it is registered via the AI models page." >&2
        exit 0
    networks:
      - opennvr_internal


  # ──────────────────────────────────────────────────────────────
  # License plate recognition — YOLOv8 → crop → fast-plate-ocr chain
  # via KAI-C, with allow/deny watchlist severity routing. Contract
  # surface on :9205.
  # ──────────────────────────────────────────────────────────────
  license-plate-recognition-config-init:
    profiles: [apps, license-plate-recognition]
    image: alpine:3.20
    container_name: opennvr_license_plate_recognition_config_init
    logging: *svc-logs
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (license-plate-recognition) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./examples/license-plate-recognition:/template:ro
      - opennvr_license_plate_recognition_config:/generated

  license-plate-recognition:
    profiles: [apps, license-plate-recognition]
    build:
      context: .
      dockerfile: examples/license-plate-recognition/Dockerfile
    # Digest pin slot — see docs/APPS_INSTALL.md → Digest pinning.
    image: ${LICENSE_PLATE_RECOGNITION_IMAGE:-opennvr/license-plate-recognition:local-build}
    container_name: opennvr_license_plate_recognition
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      license-plate-recognition-config-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      opennvr-core:
        condition: service_healthy
      egress-proxy:
        condition: service_started
      # RFC-0002 decision 7: the app starts only once its required OCR
      # adapter is up and its (best-effort) registration has run.
      fast-plate-ocr-adapter:
        condition: service_healthy
      fast-plate-ocr-register:
        condition: service_completed_successfully
    environment:
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NATS_URL=nats://nats:4222
      - OPENNVR_URL=http://opennvr-core:8000
      # Egress: apps sit on the internal opennvr_apps network; the only
      # way out is the egress proxy, which asks core whether THIS app may
      # reach the host (declared in its listing, or allowed by the
      # operator from the catalog). HTTP libraries honour these
      # automatically; NO_PROXY keeps the stack's own services direct.
      # Empty APPS_EGRESS_PROXY_URL in .env switches the proxy off.
      - HTTP_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - HTTPS_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,detect-pipeline,ollama,localhost,127.0.0.1
    # Contract surface (/health /manifest /state) — internal-only.
    expose:
      - "9205"
    volumes:
      - opennvr_license_plate_recognition_config:/app/config:ro
    command:
      - --config
      - /app/config/config.yml
    networks:
      - opennvr_apps

  # ──────────────────────────────────────────────────────────────
  # Alert notifier — the guard's phone: pushes contracted
  # alert.fired.v1 events at/above min_severity to Telegram and/or a
  # generic webhook (SMS gateways, Slack, sirens). Flood-safe.
  # Contract surface on :9211.
  # ──────────────────────────────────────────────────────────────
  alert-notifier-config-init:
    profiles: [apps, alert-notifier]
    image: alpine:3.20
    container_name: opennvr_alert_notifier_config_init
    logging: *svc-logs
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        set -e
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (alert-notifier) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./examples/alert-notifier:/template:ro
      - opennvr_alert_notifier_config:/generated

  alert-notifier:
    profiles: [apps, alert-notifier]
    build:
      context: .
      dockerfile: examples/alert-notifier/Dockerfile
    # Digest pin slot — see docs/APPS_INSTALL.md → Digest pinning.
    image: ${ALERT_NOTIFIER_IMAGE:-opennvr/alert-notifier:local-build}
    container_name: opennvr_alert_notifier
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      alert-notifier-config-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      opennvr-core:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    environment:
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NATS_URL=nats://nats:4222
      - OPENNVR_URL=http://opennvr-core:8000
      # Egress: apps sit on the internal opennvr_apps network; the only
      # way out is the egress proxy, which asks core whether THIS app may
      # reach the host (declared in its listing, or allowed by the
      # operator from the catalog). HTTP libraries honour these
      # automatically; NO_PROXY keeps the stack's own services direct.
      # Empty APPS_EGRESS_PROXY_URL in .env switches the proxy off.
      - HTTP_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - HTTPS_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,detect-pipeline,ollama,localhost,127.0.0.1
    # Contract surface (/health /manifest /state) — internal-only.
    expose:
      - "9211"
    volumes:
      - opennvr_alert_notifier_config:/app/config:ro
    command:
      - --config
      - /app/config/config.yml
    networks:
      - opennvr_apps

  # ──────────────────────────────────────────────────────────────
  # Gate controller — barrier actuation for access.decided.v1: pulses
  # an HTTP relay per gate camera when the LPR app (barrier mode)
  # publishes an allow; deny and unknown decisions actuate nothing.
  # Ships with dry_run: true — commission from the catalog, then turn
  # it off. Contract surface on :9210.
  # ──────────────────────────────────────────────────────────────
  gate-controller-config-init:
    profiles: [apps, gate-controller]
    image: alpine:3.20
    container_name: opennvr_gate_controller_config_init
    logging: *svc-logs
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        set -e
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (gate-controller) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./examples/gate-controller:/template:ro
      - opennvr_gate_controller_config:/generated

  gate-controller:
    profiles: [apps, gate-controller]
    build:
      context: .
      dockerfile: examples/gate-controller/Dockerfile
    # Digest pin slot — see docs/APPS_INSTALL.md → Digest pinning.
    image: ${GATE_CONTROLLER_IMAGE:-opennvr/gate-controller:local-build}
    container_name: opennvr_gate_controller
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      gate-controller-config-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      opennvr-core:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    environment:
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NATS_URL=nats://nats:4222
      - OPENNVR_URL=http://opennvr-core:8000
      # Egress: apps sit on the internal opennvr_apps network; the only
      # way out is the egress proxy, which asks core whether THIS app may
      # reach the host (declared in its listing, or allowed by the
      # operator from the catalog). HTTP libraries honour these
      # automatically; NO_PROXY keeps the stack's own services direct.
      # Empty APPS_EGRESS_PROXY_URL in .env switches the proxy off.
      - HTTP_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - HTTPS_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,detect-pipeline,ollama,localhost,127.0.0.1
    # Contract surface (/health /manifest /state) — internal-only.
    expose:
      - "9210"
    volumes:
      - opennvr_gate_controller_config:/app/config:ro
    command:
      - --config
      - /app/config/config.yml
    # Transports and this network, in one place (examples/gate-controller/
    # HARDWARE.md → Running in the shipped compose):
    #   http / onvif — allow the relay's host for this app in the App
    #     Catalog; the egress proxy carries them.
    #   modbus / mqtt — raw TCP, which an HTTP CONNECT proxy cannot
    #     carry. They need APPS_EGRESS_ENFORCED=false (deployment-wide).
    #   dry_contact — no network at all, but the GPIO device has to come
    #     in. Add it in a docker-compose.override.yml rather than here,
    #     so installs without that device still start:
    #       services: { gate-controller: { devices:
    #         ["/dev/gpiochip0:/dev/gpiochip0"], group_add: ["997"] } }
    networks:
      - opennvr_apps

  # ──────────────────────────────────────────────────────────────
  # InsightFace adapter — the face-recognition capability behind the
  # Smart Doorbell. The listing declares requires_adapters: [insightface]
  # (RFC-0002 decision 7) and the app's config.docker.yml already named
  # http://insightface-adapter:9005, but no service existed: the
  # validator warned "installs but that capability stays degraded", and
  # a one-click install produced a doorbell that could recognise nobody.
  # Same shape as the fast-plate-ocr pair above. The ~280 MB buffalo_l
  # weights download on first start into a named cache volume; the
  # enrolled-faces DB lives on its own volume so re-pulling the image
  # never forgets a family member.
  # ──────────────────────────────────────────────────────────────
  insightface-adapter:
    profiles: [apps, smart-doorbell]
    image: ghcr.io/open-nvr/insightface-adapter:${ADAPTER_TAG:-latest}
    container_name: opennvr_insightface_adapter
    logging: *svc-logs
    restart: unless-stopped
    environment:
      - OPENNVR_ADAPTER_TOKEN=${INTERNAL_API_KEY}
      - OPENNVR_INSIGHTFACE_FACE_DB=/data/faces.json
    volumes:
      - opennvr_insightface_faces:/data
      - opennvr_insightface_cache:/root/.insightface
    networks:
      # opennvr_internal for KAI-C's /infer calls; opennvr_apps because
      # the doorbell's enrol / list / delete actions call the adapter's
      # /faces/* routes directly — KAI-C does not proxy those.
      - opennvr_internal
      - opennvr_apps
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, sys; sys.exit(0 if httpx.get('http://127.0.0.1:9005/health', timeout=2).status_code == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 20

  # One-shot KAI-C registration, name MUST be ``insightface``: it becomes
  # the route /api/v1/infer/insightface, which the app's
  # ``recognition_adapter`` config names. Always exits 0 (see
  # fast-plate-ocr-register).
  insightface-register:
    profiles: [apps, smart-doorbell]
    image: alpine:3.20
    container_name: opennvr_insightface_register
    logging: *svc-logs
    restart: "no"
    depends_on:
      opennvr-core:
        condition: service_healthy
      insightface-adapter:
        condition: service_healthy
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command:
      - sh
      - -c
      - |
        set -e
        name="insightface"
        url="http://insightface-adapter:9005"
        echo "Auto-registering '$$name' -> $$url with KAI-C…"
        i=0
        while [ $$i -lt 30 ]; do
          if wget -q -O- \
               --header="Content-Type: application/json" \
               --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
               --post-data="{\"name\":\"$$name\",\"url\":\"$$url\"}" \
               http://opennvr-core:8100/api/v1/adapters/register >/dev/null 2>&1; then
            echo "Registered '$$name'."
            if wget -q -O- \
                 --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
                 --header="X-Actor: install" \
                 --post-data="" \
                 "http://opennvr-core:8100/api/v1/adapters/$$name/permissions/approve-all" >/dev/null 2>&1; then
              echo "Approved '$$name' declared permissions (install-time grant, audited)."
            else
              echo "WARN: could not approve '$$name' permissions — if face recognition 403s, grant them via the AI models page." >&2
            fi
            exit 0
          fi
          i=$$((i+1)); echo "register attempt $$i/30 failed (adapter warming up?); retry in 5s"; sleep 5
        done
        echo "WARN: could not register '$$name' after retries — face recognition will 404 until it is registered via the AI models page." >&2
        exit 0
    networks:
      - opennvr_internal

  # ──────────────────────────────────────────────────────────────
  # Smart doorbell — face recognition at the door via InsightFace
  # through KAI-C (FrameApp); known visitors low-severity, strangers
  # high with a snapshot. Contract surface on :9206.
  # The insightface-adapter pair above is provisioned with it.
  # ──────────────────────────────────────────────────────────────
  smart-doorbell-config-init:
    profiles: [apps, smart-doorbell]
    image: alpine:3.20
    container_name: opennvr_doorbell_config_init
    logging: *svc-logs
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (smart-doorbell) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./examples/smart-doorbell:/template:ro
      - opennvr_smart_doorbell_config:/generated

  smart-doorbell:
    profiles: [apps, smart-doorbell]
    build:
      context: .
      dockerfile: examples/smart-doorbell/Dockerfile
    # Digest pin slot — see docs/APPS_INSTALL.md → Digest pinning.
    image: ${SMART_DOORBELL_IMAGE:-opennvr/smart-doorbell:local-build}
    container_name: opennvr_smart_doorbell
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      smart-doorbell-config-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      opennvr-core:
        # opennvr-core also hosts KAI-C on :8100 — the same
        # service_healthy gate covers the inference proxy too.
        condition: service_healthy
      egress-proxy:
        condition: service_started
      insightface-adapter:
        condition: service_healthy
      insightface-register:
        condition: service_completed_successfully
    environment:
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NATS_URL=nats://nats:4222
      - OPENNVR_URL=http://opennvr-core:8000
      # Egress: apps sit on the internal opennvr_apps network; the only
      # way out is the egress proxy, which asks core whether THIS app may
      # reach the host (declared in its listing, or allowed by the
      # operator from the catalog). HTTP libraries honour these
      # automatically; NO_PROXY keeps the stack's own services direct.
      # Empty APPS_EGRESS_PROXY_URL in .env switches the proxy off.
      - HTTP_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - HTTPS_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,detect-pipeline,ollama,insightface-adapter,localhost,127.0.0.1
    expose:
      - "9206"
    volumes:
      - opennvr_smart_doorbell_config:/app/config:ro
    # ``--config`` is a global option of this CLI and argparse requires
    # it BEFORE the ``daemon`` subcommand (``daemon --config …`` exits 2
    # with "the following arguments are required: --config") — verified
    # against the image's ENTRYPOINT ["python", "smart_doorbell.py"].
    command:
      - --config
      - /app/config/config.yml
      - daemon
    networks:
      - opennvr_apps

  # ──────────────────────────────────────────────────────────────
  # Package delivery — porch ROI package arrivals / lingering /
  # pick-ups with owner-vs-stranger severity. FrameApp: fetches
  # camera snapshots itself and drives YOLOv8 through KAI-C.
  # Contract surface on :9207.
  # ──────────────────────────────────────────────────────────────
  # Weights for the detector below. Pre-baked into a ~19 MB image the
  # same way yolov8-weights and yolo-pose-weights are, because the
  # reason those exist applies here exactly: an operator on a filtered
  # network cannot fetch a model at first boot, and an adapter that
  # starts, answers /health and fails every /infer on a missing file is
  # the silent kind of broken. Here it is worse than silent — the app
  # grades itself "fair" and looks like it is rating its own model
  # poorly.
  #
  # Override PACKAGE_DETECTION_WEIGHTS_IMAGE to ship a fine-tune of
  # your own doorsteps, or skip the image and put the .onnx straight
  # into the volume (examples/package-delivery/README.md).
  package-detection-weights-init:
    profiles: [apps, package-delivery]
    image: ${PACKAGE_DETECTION_WEIGHTS_IMAGE:-ghcr.io/open-nvr/package-detection-weights:v1.0.0}
    # Build it here if it cannot be pulled — same last-resort fallback
    # as yolo-pose-weights-init, and for the same reason: an
    # unpublished image, a private package or a blocked ghcr.io
    # otherwise ends with "denied", no weights, and an app that
    # silently counts "fair" for ever.
    build:
      context: examples/package-detection-weights
      dockerfile: Dockerfile
    pull_policy: missing
    container_name: opennvr_package_detection_weights_init
    logging: *svc-logs
    restart: "no"
    # List-form command, as yolov8-weights-init explains at length:
    # compose word-splits a STRING command, so `sh -c set -e ...` would
    # run only `set`, exit 0, and copy nothing.
    entrypoint: ["sh", "-ec"]
    command:
      - |
        WEIGHTS=/weights/yolov8n-package.onnx
        if [ -s "$$WEIGHTS" ]; then
          echo "yolov8n-package.onnx already present at $$WEIGHTS (size: $$(wc -c < $$WEIGHTS) bytes); skipping."
          exit 0
        fi
        echo "Copying pre-baked yolov8n-package.onnx into volume..."
        cp /yolov8n-package.onnx "$$WEIGHTS"
        echo "Wrote $$(wc -c < $$WEIGHTS) bytes to $$WEIGHTS."
    volumes:
      - opennvr_package_detection_weights:/weights

  # ──────────────────────────────────────────────────────────────
  # Package-detection adapter — the parcel class COCO does not have.
  #
  # Without this, Package Delivery falls back to whatever else KAI-C
  # has registered: a VQA model (counts "fair") or, with nothing at
  # all, the COCO bag classes as a stand-in ("proxy"). The Deliveries
  # page names the skill it used and grades it, so a deployment that
  # meant to run the real detector and silently did not is visible —
  # but it has to be RUN for the grade to change, and a catalog entry
  # is not a running container.
  #
  # The weights come from package-detection-weights-init above, so this
  # boots with a model and no network. A site fine-tune on its OWN
  # doorstep footage replaces them, either by overriding
  # PACKAGE_DETECTION_WEIGHTS_IMAGE or by hand:
  #
  #   docker compose cp ./yolov8n-package.onnx \
  #     package-detection-adapter:/app/model_weights/yolov8n-package.onnx
  # ──────────────────────────────────────────────────────────────
  package-detection-adapter:
    profiles: [apps, package-delivery]
    image: ghcr.io/open-nvr/package-detection-adapter:${ADAPTER_TAG:-latest}
    container_name: opennvr_package_detection_adapter
    logging: *svc-logs
    restart: unless-stopped
    environment:
      - OPENNVR_ADAPTER_TOKEN=${INTERNAL_API_KEY}
      # The adapter reads PACKAGE_DETECTION_WEIGHTS_DIR — a DIRECTORY,
      # not a file path — and looks for yolov8n-package.onnx inside it
      # (service.py: WEIGHTS_FILENAME). Naming the variable after the
      # image rather than after what the code reads is how the yolov8
      # block earned its warning comment and a run of 503s.
      - PACKAGE_DETECTION_WEIGHTS_DIR=/app/model_weights
      # Empty by default and it should stay that way: the weights-init
      # above has already put the model in the volume, so there is
      # nothing to fetch. This is the escape hatch for a site that
      # would rather pull its own fine-tune at boot than bake an image.
      - PACKAGE_DETECTION_MODEL_URL=${PACKAGE_DETECTION_MODEL_URL:-}
      # Optional: the class names the model emits, if you fine-tuned it
      # with a different label order.
      - PACKAGE_DETECTION_LABELS=${PACKAGE_DETECTION_LABELS:-}
    depends_on:
      package-detection-weights-init:
        condition: service_completed_successfully
    volumes:
      - opennvr_package_detection_weights:/app/model_weights
    networks:
      - opennvr_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx, sys; sys.exit(0 if httpx.get('http://127.0.0.1:9010/health', timeout=2).status_code == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 10

  # One-shot KAI-C registration — same pattern as fast-plate-ocr and
  # yolo-pose. The name MUST be ``package_detection``: it becomes
  # KAI-C's route and it is the task string the app's picker matches on
  # to grade its counts "good". Always exits 0: a failed registration
  # degrades to the VQA fallback and a WARN, never a wedged compose up.
  package-detection-register:
    profiles: [apps, package-delivery]
    image: alpine:3.20
    container_name: opennvr_package_detection_register
    logging: *svc-logs
    restart: "no"
    depends_on:
      opennvr-core:
        condition: service_healthy
      package-detection-adapter:
        condition: service_healthy
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    command:
      - sh
      - -c
      - |
        set -e
        name="package_detection"
        url="http://package-detection-adapter:9010"
        echo "Auto-registering '$$name' -> $$url with KAI-C…"
        i=0
        while [ $$i -lt 30 ]; do
          if wget -q -O- \
               --header="Content-Type: application/json" \
               --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
               --post-data="{\"name\":\"$$name\",\"url\":\"$$url\"}" \
               http://opennvr-core:8100/api/v1/adapters/register >/dev/null 2>&1; then
            echo "Registered '$$name'."
            if wget -q -O- \
                 --header="X-Internal-Api-Key: $${INTERNAL_API_KEY}" \
                 --header="X-Actor: install" \
                 --post-data="" \
                 "http://opennvr-core:8100/api/v1/adapters/$$name/permissions/approve-all" >/dev/null 2>&1; then
              echo "Approved '$$name' declared permissions (install-time grant, audited)."
            else
              echo "WARN: could not approve '$$name' permissions — grant them via the AI models page." >&2
            fi
            exit 0
          fi
          i=$$((i+1)); echo "register attempt $$i/30 failed (adapter warming up?); retry in 5s"; sleep 5
        done
        echo "WARN: could not register '$$name' after retries — Package Delivery will fall back to a VQA model or the COCO stand-in, and the Deliveries page will say which." >&2
        exit 0
    networks:
      - opennvr_internal

  package-delivery-config-init:
    profiles: [apps, package-delivery]
    image: alpine:3.20
    container_name: opennvr_package_delivery_config_init
    logging: *svc-logs
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (package-delivery) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./examples/package-delivery:/template:ro
      - opennvr_package_delivery_config:/generated

  package-delivery:
    profiles: [apps, package-delivery]
    build:
      context: .
      dockerfile: examples/package-delivery/Dockerfile
    # Digest pin slot — see docs/APPS_INSTALL.md → Digest pinning.
    image: ${PACKAGE_DELIVERY_IMAGE:-opennvr/package-delivery:local-build}
    container_name: opennvr_package_delivery
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      package-delivery-config-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      opennvr-core:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    environment:
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NATS_URL=nats://nats:4222
      - OPENNVR_URL=http://opennvr-core:8000
      # Parcels are counted by a KAI-C skill (a package detector, a box-capable
      # detector or a VQA model — whichever is registered), on demand.
      - KAIC_URL=http://opennvr-core:8100
      # Egress: apps sit on the internal opennvr_apps network; the only
      # way out is the egress proxy, which asks core whether THIS app may
      # reach the host (declared in its listing, or allowed by the
      # operator from the catalog). HTTP libraries honour these
      # automatically; NO_PROXY keeps the stack's own services direct.
      # Empty APPS_EGRESS_PROXY_URL in .env switches the proxy off.
      - HTTP_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - HTTPS_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,detect-pipeline,ollama,localhost,127.0.0.1
    expose:
      - "9207"
    volumes:
      - opennvr_package_delivery_config:/app/config:ro
    command:
      - --config
      - /app/config/config.yml
    networks:
      - opennvr_apps

  # ──────────────────────────────────────────────────────────────
  # Footage search — natural-language search over recorded footage,
  # answered from the platform's event store. Queried from the App
  # Catalog (the manifest-declared "search" action) or ``docker
  # compose exec``. Contract surface on :9208 (health/state/actions
  # + registration).
  #
  # As of 2.0.0 it keeps no index of its own: no NATS subscription
  # and no data volume, because a second copy of the same footage
  # with its own retention policy was the problem, not the feature.
  # ──────────────────────────────────────────────────────────────
  footage-search-config-init:
    # In BOTH profiles: ``apps`` (the everything-on profile / the
    # reconciler's) and ``default-apps`` — the profile start.sh/start.ps1
    # enable on every stock install, because these apps ride the Tier-0
    # stream that is always on and need no extra adapter, model, or GPU.
    # Opt out with OPENNVR_DEFAULT_APPS=off in .env.
    profiles: [apps, default-apps, footage-search]
    image: alpine:3.20
    container_name: opennvr_footage_search_config_init
    logging: *svc-logs
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (footage-search) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./examples/footage-search:/template:ro
      - opennvr_footage_search_config:/generated

  footage-search:
    # In BOTH profiles: ``apps`` (the everything-on profile / the
    # reconciler's) and ``default-apps`` — the profile start.sh/start.ps1
    # enable on every stock install. It qualifies for a different reason
    # than the others now: not that it rides the always-on Tier-0 stream,
    # but that it rides nothing at all and costs a container.
    # Opt out with OPENNVR_DEFAULT_APPS=off in .env.
    profiles: [apps, default-apps, footage-search]
    build:
      context: .
      dockerfile: examples/footage-search/Dockerfile
    # Digest pin slot — see docs/APPS_INSTALL.md → Digest pinning.
    image: ${FOOTAGE_SEARCH_IMAGE:-opennvr/footage-search:local-build}
    container_name: opennvr_footage_search
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      footage-search-config-init:
        condition: service_completed_successfully
      # No `nats` here any more: nothing is subscribed to. core is the
      # only dependency that matters, and it is the one it searches.
      opennvr-core:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    environment:
      # Informational — this app reads everything from the generated
      # config.yml (no contract/registration keys in its config surface).
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - OPENNVR_URL=http://opennvr-core:8000
      # Egress: apps sit on the internal opennvr_apps network; the only
      # way out is the egress proxy, which asks core whether THIS app may
      # reach the host (declared in its listing, or allowed by the
      # operator from the catalog). HTTP libraries honour these
      # automatically; NO_PROXY keeps the stack's own services direct.
      # Empty APPS_EGRESS_PROXY_URL in .env switches the proxy off.
      - HTTP_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - HTTPS_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,detect-pipeline,ollama,localhost,127.0.0.1
    expose:
      - "9208"
    volumes:
      - opennvr_footage_search_config:/app/config:ro
      # No data volume: the app is stateless between restarts. Anything
      # it can tell you, it reads from core when asked.
    command:
      - --config
      - /app/config/config.yml
      - serve
    networks:
      - opennvr_apps

  # ──────────────────────────────────────────────────────────────
  # Home Assistant relay — bridges the opennvr.alerts.* fan-out
  # into HA entities (MQTT discovery, or the HA REST API). Boots
  # cleanly without HA configured; set HA_MQTT_HOST (or switch the
  # template to backend: rest with HA_URL + HA_TOKEN) in .env to
  # start forwarding. Contract surface on :9209.
  # Deprecated: use the Home Assistant integration or the MQTT
  # integration's built-in discovery instead (docs/HOME_ASSISTANT.md).
  # ──────────────────────────────────────────────────────────────
  home-assistant-relay-config-init:
    profiles: [apps, home-assistant-relay]
    image: alpine:3.20
    container_name: opennvr_home_assistant_relay_config_init
    logging: *svc-logs
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        mhost=$$(sed_esc "$${HA_MQTT_HOST}")
        haurl=$$(sed_esc "$${HA_URL}")
        hatok=$$(sed_esc "$${HA_TOKEN}")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            -e "s/[$$][{]HA_MQTT_HOST[}]/$$mhost/g" \
            -e "s/[$$][{]HA_URL[}]/$$haurl/g" \
            -e "s/[$$][{]HA_TOKEN[}]/$$hatok/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (home-assistant-relay) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Operator-set in .env — the relay's Home Assistant endpoint.
      # HA_MQTT_HOST for the default mqtt backend; HA_URL + HA_TOKEN
      # only if you switch the template to backend: rest. Unset ⇒ the
      # relay still boots and counts alerts, forwards fail with a
      # logged warning.
      - HA_MQTT_HOST=${HA_MQTT_HOST:-}
      - HA_URL=${HA_URL:-}
      - HA_TOKEN=${HA_TOKEN:-}
    volumes:
      - ./examples/home-assistant-relay:/template:ro
      - opennvr_home_assistant_relay_config:/generated

  home-assistant-relay:
    profiles: [apps, home-assistant-relay]
    build:
      context: .
      dockerfile: examples/home-assistant-relay/Dockerfile
    # Digest pin slot — see docs/APPS_INSTALL.md → Digest pinning.
    image: ${HOME_ASSISTANT_RELAY_IMAGE:-opennvr/home-assistant-relay:local-build}
    container_name: opennvr_home_assistant_relay
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      home-assistant-relay-config-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      opennvr-core:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    environment:
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NATS_URL=nats://nats:4222
      - OPENNVR_URL=http://opennvr-core:8000
      # Egress: apps sit on the internal opennvr_apps network; the only
      # way out is the egress proxy, which asks core whether THIS app may
      # reach the host (declared in its listing, or allowed by the
      # operator from the catalog). HTTP libraries honour these
      # automatically; NO_PROXY keeps the stack's own services direct.
      # Empty APPS_EGRESS_PROXY_URL in .env switches the proxy off.
      - HTTP_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - HTTPS_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,detect-pipeline,ollama,localhost,127.0.0.1
    expose:
      - "9209"
    volumes:
      - opennvr_home_assistant_relay_config:/app/config:ro
    command:
      - --config
      - /app/config/config.yml
    networks:
      - opennvr_apps

  guard-scan-compliance-config-init:
    profiles: [apps, guard-scan-compliance]
    image: alpine:3.20
    container_name: opennvr_guard_scan_config_init
    logging: *svc-logs
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (guard-scan-compliance) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./examples/guard-scan-compliance:/template:ro
      - opennvr_guard_scan_config:/generated

  guard-scan-compliance:
    profiles: [apps, guard-scan-compliance]
    build:
      context: .
      dockerfile: examples/guard-scan-compliance/Dockerfile
    # Digest pin slot — see docs/APPS_INSTALL.md → Digest pinning.
    image: ${GUARD_SCAN_COMPLIANCE_IMAGE:-opennvr/guard-scan-compliance:local-build}
    container_name: opennvr_guard_scan_compliance
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      guard-scan-compliance-config-init:
        condition: service_completed_successfully
      nats-apps:
        condition: service_healthy
      opennvr-core:
        condition: service_healthy
      egress-proxy:
        condition: service_started
      # RFC-0002 decision 7, the same as license-plate-recognition and
      # its OCR adapter: the app starts only once the adapter it cannot
      # work without is up, and its (best-effort) registration has run.
      #
      # This app is the pose adapter's only consumer, and it never said
      # so. Starting guard-scan therefore did not start the adapter —
      # so a one-click install, or `up -d guard-scan-compliance`,
      # brought up an app whose every inference call was going to fail,
      # with no pose container anywhere on the box to hint at why.
      yolo-pose-adapter:
        condition: service_healthy
      yolo-pose-register:
        condition: service_completed_successfully
    environment:
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - OPENNVR_URL=http://opennvr-core:8000
      - KAIC_URL=http://opennvr-core:8100
      - HTTP_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - HTTPS_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,detect-pipeline,ollama,localhost,127.0.0.1
    expose:
      - "9210"
    volumes:
      - opennvr_guard_scan_config:/app/config:ro
      # The per-frame keypoint logs this collects as it runs — the
      # training set for a learned model later. Its own volume so a
      # prune can find it: the evidence store's sweep only deletes JPEGs.
      - opennvr_guard_scan_sessions:/data/sessions
    command:
      - --config
      - /app/config/config.yml
    networks:
      - opennvr_apps

volumes:
  # Generated config.yml files (mounted read-only by each app).
  opennvr_loitering_config:
  opennvr_occupancy_config:
  opennvr_line_crossing_config:
  opennvr_abandoned_object_config:
  opennvr_intrusion_detection_config:
  opennvr_license_plate_recognition_config:
  opennvr_gate_controller_config:
  opennvr_alert_notifier_config:
  opennvr_fast_plate_ocr_cache:
  opennvr_insightface_faces:
  opennvr_insightface_cache:
  opennvr_smart_doorbell_config:
  opennvr_package_delivery_config:
  # Package-detection weights: fetched once from
  # PACKAGE_DETECTION_MODEL_URL, or filled by hand for a site
  # fine-tune. Kept out of the image so it stays small.
  opennvr_package_detection_weights:
  opennvr_footage_search_config:
  # opennvr_footage_search_data is gone — footage-search 2.0.0 keeps no
  # index. An upgraded install still has the old volume on disk with
  # nothing attached to it; `docker volume rm opennvr_footage_search_data`
  # reclaims the space (the app's README says so too). Left for the
  # operator to remove rather than pruned here: deleting somebody's data
  # during an upgrade is not this file's business.
  opennvr_home_assistant_relay_config:
  opennvr_guard_scan_config:
  opennvr_guard_scan_sessions:
  opennvr_yolo_pose_cache:
  opennvr_yolo_pose_weights:
