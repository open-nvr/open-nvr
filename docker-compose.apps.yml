      - /app/config/config.yml
    networks:
      - opennvr_apps

  # ──────────────────────────────────────────────────────────────
  # Abandoned object — unattended-item alerts when a watched object
  # sits stationary in a zone with no person nearby. Contract surface
  # on :9203 (health/state + registration → catalog dot + agent skill).
  # ──────────────────────────────────────────────────────────────
  abandoned-object-config-init:
    profiles: [apps, abandoned-object]
    image: alpine:3.20
    container_name: opennvr_abandoned_object_config_init
    logging: *svc-logs
    restart: "no"
