      dockerfile: examples/occupancy-counting/Dockerfile
    # A digest-pinned ref set by the one-click installer overrides the
    # local build: the reconciler exports OCCUPANCY_COUNTING_IMAGE=
    # <image>@sha256:<digest>, and compose then PULLS that exact ref
    # instead of using the build. Unset (the copy-paste / dev path) →
    # this resolves to the :local-build tag and the build block above is
    # used. See docs/APPS_INSTALL.md → Digest pinning.
    image: ${OCCUPANCY_COUNTING_IMAGE:-opennvr/occupancy-counting:local-build}
    container_name: opennvr_occupancy_counting
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      occupancy-counting-config-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      opennvr-core:
        condition: service_healthy
    environment:
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NATS_URL=nats://nats:4222
      - OPENNVR_URL=http://opennvr-core:8000
    expose:
      - "9201"
    volumes:
      - opennvr_occupancy_config:/app/config:ro
    command:
      - --config
      - /app/config/config.yml
    networks:
      - opennvr_internal

  # ──────────────────────────────────────────────────────────────
  # Line crossing — tripwire alerts when a tracked object crosses
  # an oriented line in a counted direction. Contract surface on
  # :9202 (health/state + registration → catalog dot + agent skill).
  # ──────────────────────────────────────────────────────────────
  line-crossing-config-init:
    profiles: [apps]
    image: alpine:3.20
