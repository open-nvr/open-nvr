# ==========================================
# OpenNVR — SDK detector apps overlay
# ==========================================
#
# Runs the migrated opennvr-app-sdk detector apps against a deployed
# stack. Each app subscribes to KAI-C's NATS inference broadcast
# (zero extra GPU cost — it rides the stream the stack is already
# producing), serves the §03 contract endpoints (/health /manifest
# /state) on its contract port, and self-registers with the OpenNVR
# app registry on boot — so it appears in the App Catalog
# (Settings → App Catalog, backed by GET /api/v1/apps) with a live
# status dot and an auto-generated config form.
#
# Run (from the repo root, on top of the standard stack):
#
#     docker compose -f docker-compose.yml -f docker-compose.apps.yml --profile apps up -d
#
# Stop just the apps:
#
#     docker compose -f docker-compose.yml -f docker-compose.apps.yml --profile apps down
#
# One app (and only its adapters), by profile -- what scripts/install.sh
# persists in OPENNVR_EXAMPLE_PROFILE when an operator picks apps at
# install time, and what start.sh replays on every ``up``:
#     docker compose -f docker-compose.yml -f docker-compose.apps.yml --profile license-plate-recognition up -d
# Every service an app needs carries that app's id as a profile: the app,
# its config-init, its dedicated adapters, and the shared egress-proxy.
# The ``apps`` profile stays the everything-on switch the reconciler uses.
#
# Registration auth: the apps authenticate to POST /api/v1/apps/register
# with the deployment's INTERNAL_API_KEY (X-Internal-Api-Key header) —
# the same secret NATS and the adapters use. No user JWT is involved.
#
# Config: each app's config.yml is generated at ``up`` time from
# examples/<app>/config.docker.yml by a one-shot init container
# (busybox sed substitution — same pattern as the camera-agent
# overlay), so secrets come from .env, not the repo. Edit the
# template's cameras/zones for your scene, then re-run ``up``.
# ==========================================

# Bounded per-container logs (see docs/OBSERVABILITY.md "Logs"): every
# service keeps a rolling ~30MB of its own history (3 x 10MB json files), so
# `docker logs --since 1h <name>` always has the recent story after an
# incident, and a chatty container can never fill the disk. Opt-in central
# viewer: `COMPOSE_PROFILES=logs` adds a localhost-only Dozzle at :9999.
x-default-logging: &svc-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ──────────────────────────────────────────────────────────────
  # Egress proxy — the only door out of the apps network. Apps live on
  # ``opennvr_apps`` (internal: no LAN, no internet); this service sits
  # on that network AND the platform network, and every app gets it as
  # HTTP_PROXY / HTTPS_PROXY. Per destination it asks core whether the
  # calling app may open the host — core answers from the listing's
  # declared ``network_egress`` plus the operator's allow list, and
  # raises a refusal in the inbox. Holds no policy of its own; stdlib
  # only. See docs/APP_NETWORK.md.
  # ──────────────────────────────────────────────────────────────
  egress-proxy:
    profiles: [apps, default-apps, loitering-detection, occupancy-counting, line-crossing, abandoned-object, intrusion-detection, guard-scan-compliance, license-plate-recognition, gate-controller, alert-notifier, smart-doorbell, package-delivery, footage-search, home-assistant-relay]
    build:
      context: .
      dockerfile: scripts/egress-proxy/Dockerfile
    image: ${EGRESS_PROXY_IMAGE:-opennvr/egress-proxy:local-build}
    container_name: opennvr_egress_proxy
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      opennvr-core:
        condition: service_healthy
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - OPENNVR_URL=http://opennvr-core:8000
      - LOG_LEVEL=${EGRESS_PROXY_LOG_LEVEL:-INFO}
    expose:
      - "3128"
    networks:
      - opennvr_apps
      - opennvr_internal

  # ──────────────────────────────────────────────────────────────
  # Loitering detection — dwell-time alerts for watched labels in
  # operator-defined zones. Contract surface on :9200.
  # ──────────────────────────────────────────────────────────────
  loitering-detection-config-init:
    profiles: [apps, loitering-detection]
    image: alpine:3.20
    container_name: opennvr_loitering_config_init
    logging: *svc-logs
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        # busybox sed substitutes only INTERNAL_API_KEY, leaving other
        # ``$`` sigils untouched (no envsubst / apk fetch, which some
        # operator ISPs filter). Same pattern as the camera-agent overlay.
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (loitering-detection) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./examples/loitering-detection:/template:ro
      - opennvr_loitering_config:/generated

  loitering-detection:
    profiles: [apps, loitering-detection]
    build:
      context: .
      dockerfile: examples/loitering-detection/Dockerfile
    # A digest-pinned ref set by the one-click installer overrides the
    # local build: the reconciler exports LOITERING_DETECTION_IMAGE=
    # <image>@sha256:<digest>, and compose then PULLS that exact ref
    # instead of using the build. Unset (the copy-paste / dev path) →
    # this resolves to the :local-build tag and the build block above is
    # used. See docs/APPS_INSTALL.md → Digest pinning.
    image: ${LOITERING_DETECTION_IMAGE:-opennvr/loitering-detection:local-build}
    container_name: opennvr_loitering_detection
    logging: *svc-logs
    restart: unless-stopped
    depends_on:
      loitering-detection-config-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      opennvr-core:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    environment:
      # The SDK's registration call reads the token from this env var
      # (cfg opennvr_token wins when set; the template leaves it unset).
      - OPENNVR_INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Informational — the effective values live in the generated
      # config.yml (see the config-init container above).
      - NATS_URL=nats://nats:4222
      - OPENNVR_URL=http://opennvr-core:8000
      # Egress: apps sit on the internal opennvr_apps network; the only
      # way out is the egress proxy, which asks core whether THIS app may
      # reach the host (declared in its listing, or allowed by the
      # operator from the catalog). HTTP libraries honour these
      # automatically; NO_PROXY keeps the stack's own services direct.
      # Empty APPS_EGRESS_PROXY_URL in .env switches the proxy off.
      - HTTP_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - HTTPS_PROXY=${APPS_EGRESS_PROXY_URL-http://egress-proxy:3128}
      - NO_PROXY=opennvr-core,nats,nats-apps,egress-proxy,mediamtx,detect-pipeline,ollama,localhost,127.0.0.1
    # Contract surface (/health /manifest /state) — internal-only; the
    # registry polls it over the compose network. Add a
    # ``127.0.0.1:9200:9200`` port mapping to poke it from the host.
    expose:
      - "9200"
    volumes:
      - opennvr_loitering_config:/app/config:ro
    command:
      - --config
      - /app/config/config.yml
    networks:
      - opennvr_apps

  # ──────────────────────────────────────────────────────────────
  # Occupancy counting — over/under-occupancy alerts per camera ×
  # zone. Contract surface on :9201.
  # ──────────────────────────────────────────────────────────────
  occupancy-counting-config-init:
    # In BOTH profiles: ``apps`` (the everything-on profile / the
    # reconciler's) and ``default-apps`` — the profile start.sh/start.ps1
    # enable on every stock install, because these apps ride the Tier-0
    # stream that is always on and need no extra adapter, model, or GPU.
    # Opt out with OPENNVR_DEFAULT_APPS=off in .env.
    profiles: [apps, default-apps, occupancy-counting]
    image: alpine:3.20
    container_name: opennvr_occupancy_config_init
    logging: *svc-logs
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        sed_esc() { printf '%s' "$$1" | sed -e 's/\\/\\\\/g; s/&/\\&/g; s/\//\\\//g'; }
        ikey=$$(sed_esc "$${INTERNAL_API_KEY}")
        sed -e "s/[$$][{]INTERNAL_API_KEY[}]/$$ikey/g" \
            < /template/config.docker.yml > /generated/config.yml
        echo "Wrote /generated/config.yml (occupancy-counting) from template."
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./examples/occupancy-counting:/template:ro
      - opennvr_occupancy_config:/generated

  occupancy-counting:
    # In BOTH profiles: ``apps`` (the everything-on profile / the
    # reconciler's) and ``default-apps`` — the profile start.sh/start.ps1
    # enable on every stock install, because these apps ride the Tier-0
    # stream that is always on and need no extra adapter, model, or GPU.
    # Opt out with OPENNVR_DEFAULT_APPS=off in .env.
    profiles: [apps, default-apps, occupancy-counting]
    build:
