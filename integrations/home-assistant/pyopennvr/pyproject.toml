[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyopennvr"
version = "0.0.1"
description = "Async Python client for the OpenNVR API (REST, event websocket v2, WHEP)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "OpenNVR" }]
dependencies = [
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/open-nvr/open-nvr"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyopennvr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
