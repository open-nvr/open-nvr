# Home Assistant integration quality scale, tracked from day one (design §7.1).
# HA-305 takes every rule to done or exempt for Gold.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner:
    status: todo
    comment: >
      codeowners in manifest.json needs the maintainers' GitHub handles:
      the owner's decision, made when the repository is split (HA-306).
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: 97% (CI fails under 95%).

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: >
      The mDNS record is unauthenticated; letting it rewrite a configured
      entry's URL would let anyone on the LAN redirect where the token is sent.
      A moved server is handled by the reconfigure flow instead.
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: exempt
    comment: >
      Most entities are described by the OpenNVR server and its AI apps
      (design section 6.10), which name them; an integration release cannot
      know the names of descriptors a newer server or app adds. The
      hand-written entities (site mode panel, server update) are translated.
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
