ptz:
  fields:
    camera:
      required: true
      selector:
        entity:
          integration: opennvr
          domain: camera
    action:
      required: true
      selector:
        select:
          translation_key: ptz_action
          options:
            - move
            - zoom
            - stop
            - preset
    argument:
      required: false
      example: "up"
      selector:
        text:
    speed:
      required: false
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 1
          step: 0.1

create_event:
  fields:
    camera:
      required: true
      selector:
        entity:
          integration: opennvr
          domain: camera
    label:
      required: false
      default: manual
      selector:
        text:
    sub_label:
      required: false
      selector:
        text:
    duration:
      required: false
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s

end_event:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: opennvr
    event_id:
      required: true
      selector:
        number:
          min: 1
          max: 2147483647
          mode: box

export_recording:
  fields:
    camera:
      required: true
      selector:
        entity:
          integration: opennvr
          domain: camera
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    with_hash:
      required: false
      default: false
      selector:
        boolean:

protect_recording:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: opennvr
    event_id:
      required: true
      selector:
        number:
          min: 1
          max: 2147483647
          mode: box
    pre_s:
      required: false
      default: 10
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    post_s:
      required: false
      default: 10
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s

ack_alerts:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: opennvr
    alert_ids:
      required: false
      selector:
        object:
    source:
      required: false
      selector:
        text:
    severity:
      required: false
      selector:
        select:
          translation_key: severity
          options:
            - low
            - medium
            - high
            - critical

search_events:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: opennvr
    query:
      required: false
      selector:
        text:
    camera:
      required: false
      selector:
        entity:
          integration: opennvr
          domain: camera
    label:
      required: false
      selector:
        text:
    zone:
      required: false
      selector:
        text:
    plate:
      required: false
      selector:
        text:
    start:
      required: false
      selector:
        datetime:
    end:
      required: false
      selector:
        datetime:
    limit:
      required: false
      default: 25
      selector:
        number:
          min: 1
          max: 100
          mode: box
