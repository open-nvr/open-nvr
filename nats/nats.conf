# OpenNVR event bus — the platform server (core, detect-pipeline, KAI-C,
# the Agent). Authenticated with the deployment's INTERNAL_API_KEY as a
# token, exactly as before; the only addition is the leaf-node port the
# apps bus (nats/apps.conf) connects through.
#
# Apps do NOT connect here (SDK >= 0.6 with a core >= api_version 1.3):
# they join nats-apps as their own user, with their own key, under
# permissions derived from their manifest. Older apps still may, with
# the site token, until they upgrade.

server_name: opennvr-nats

authorization {
  token: $INTERNAL_API_KEY
}

leafnodes {
  port: 7422
  authorization {
    user: opennvr-apps-bus
    password: $INTERNAL_API_KEY
  }
}

http_port: 8222
