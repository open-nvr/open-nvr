# OpenNVR apps bus — the leaf server every SDK app joins with ITS OWN key.
#
# One NATS user per installed app (user = app id, password = bcrypt of
# the app key), each with publish/subscribe permissions derived from its
# manifest: the platform's inference broadcasts and the alert stream to
# read; its own alert subjects to write; a domain-event family only when
# the manifest declared the scope. Core renders that list into
# /var/lib/opennvr/nats/users.conf (server/services/nats_users.py) on
# every key issue / rotate / revoke; apps-entrypoint.sh reloads this
# server when the file changes.
#
# Subjects flow both ways over the leaf link to the platform server, so
# an app's alert reaches the inbox and the platform's detections reach
# the app — but only the subjects each app's permissions allow.
#
# THIS FILE IS A TEMPLATE. nats-server expands ``$VAR`` only where a
# whole value is the variable (``token: $INTERNAL_API_KEY`` in
# nats.conf); inside a URL it is left as the literal text
# "$INTERNAL_API_KEY", so the leaf link would present that string as its
# password and the platform server would refuse it forever — with both
# buses up, every app "connected", and no alert ever crossing to the
# inbox. apps-entrypoint.sh renders @@INTERNAL_API_KEY_URL@@ (the key,
# percent-encoded for a URL) into /var/lib/opennvr/nats/apps.conf — the
# users file's own directory — and starts from that.
#
# The include below MUST stay relative: nats-server joins EVERY include
# path onto the config file's directory, an absolute one included
# ("/var/lib/opennvr/nats/users.conf" from /etc/nats/apps.conf opened
# /etc/nats/var/lib/opennvr/nats/users.conf, and the server never
# started — a restart loop, and "nats-apps" resolving for no app).

server_name: opennvr-nats-apps

include "users.conf"

leafnodes {
  remotes: [
    { url: "nats://opennvr-apps-bus:@@INTERNAL_API_KEY_URL@@@nats:7422" }
  ]
}

http_port: 8222
