# Relevance-labelled search cases for the Ventuno Q (camera 23, the office
# CP Plus camera), labelled 2026-11-10 from the captions of the 400 most
# recent captioned visits (ids 17763–18165, 2026-11-05 11:36 → 11-10 11:34)
# with a look at the evidence frame where a caption was ambiguous. The
# window pins every search to that labelled pool, so a right answer from
# an older visit is not counted as a wrong one.
#
# `relevant` is strict: a visit is listed when its caption (or frame) shows
# what the query asks for, not when it is merely of the same class. `kind`
# groups the cases: caption (the words are near the captioner's own),
# paraphrase (the words are not), attribute (a colour/garment the
# descriptors may also claim), typo (a misspelling the parser should
# correct), negative (nothing on the site answers it).
#
# Run: python3 tools/search_eval.py --cases bench/search-eval-cases-ventuno-q-2026-11-10.yml --login

window:
  from: "2026-11-05T11:30:00Z"

cases:
  - query: man in a yellow shirt
    kind: attribute
    note: three visitors, Nov 7 11:47–11:50
    relevant: [17932, 17929, 17928, 17924, 17923, 17921, 17920, 17919, 17918, 17917, 17916]
  - query: person wearing a plaid shirt
    kind: attribute
    relevant: [17931, 17929, 17924, 17923, 17921, 17920, 17918, 17913, 17908]
  - query: light blue kurta
