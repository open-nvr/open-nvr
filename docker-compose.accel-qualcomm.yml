# ==========================================
# OpenNVR Accelerate — Qualcomm flavour (Tier-0 detector on the Hexagon NPU)
# ==========================================
# start.sh adds this overlay when OPENNVR_ACCEL=qualcomm, or on `auto` when it
# finds the Hexagon compute DSP's fastrpc node (/dev/fastrpc-cdsp) on an arm64
# host: Qualcomm Dragonwing (IQ8 / QCS8275, QCS6490 …) and Snapdragon boards
# running Qualcomm's Ubuntu. It swaps detect-pipeline for the ``-qualcomm``
# image (same code; carries the ONNX Runtime QNN plugin provider, which
# bundles the Qualcomm AI Runtime user-space), lends it the DSP, and points
# the detector at the HTP.
#
# What the host provides and why (measured on an Arduino Ventuno Q, QCS8275):
#   /dev/fastrpc-cdsp        the compute DSP (the NPU) — one node, no /dev/dri
#   /dev/dma_heap/system,    the DMA-BUF heaps the fastrpc client allocates
#   /dev/dma_heap/qcom,system  shared buffers from; without them device
#                            creation fails with QNN_DEVICE_ERROR_INVALID_CONFIG
#   libcdsprpc.so            the fastrpc client the QNN HTP stub dlopens — by
#                            that UNVERSIONED name, so the host's .so.1.0.0 is
#                            mounted under it; libdmabufheap.so.0 is its one
#                            dependency (both from Qualcomm's qcom-fastrpc1
#                            package; not in Debian, so bind-mounted rather
#                            than installed)
#   groups fastrpc, dmaheap  the nodes are group-owned — FASTRPC_GID and
#                            DMAHEAP_GID in .env if yours are not 125 / 989
#                            (`getent group fastrpc dmaheap`; start.sh fills
#                            them in on auto)
# The DSP firmware and the fastrpc daemon (cdsprpcd) are the host's job, like
# the Intel NPU firmware is on x86. Check: `ls /dev/fastrpc-cdsp /dev/dma_heap`
# and `systemctl is-active cdsprpcd`.
#
# Running compose by hand instead of start.sh? Export the DETECT_* values
# below (or set them in .env) — an .env that still says DETECT_ONNX_BACKEND=
# cvdnn wins over the defaults here, by compose's rules.
#
#   docker compose -f docker-compose.yml -f docker-compose.accel-qualcomm.yml up -d
#
# Decode stays in software: the Qualcomm video core is reachable only through
# the vendor GStreamer stack, which ffmpeg does not use.
services:
  detect-pipeline:
    image: ${DETECT_PIPELINE_IMAGE:-ghcr.io/open-nvr/detect-pipeline:${CORE_TAG:-latest}-qualcomm}
    devices:
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp
      - /dev/dma_heap/system:/dev/dma_heap/system
      - /dev/dma_heap/qcom,system:/dev/dma_heap/qcom,system
    group_add:
      - "${FASTRPC_GID:-125}"
      - "${DMAHEAP_GID:-989}"
    volumes:
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libcdsprpc.so.1.0.0:/usr/lib/aarch64-linux-gnu/libcdsprpc.so:ro
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libdmabufheap.so.0:/usr/lib/aarch64-linux-gnu/libdmabufheap.so.0:ro
    environment:
      - DETECT_ONNX_BACKEND=${DETECT_ONNX_BACKEND:-ort}
      # The Hexagon Tensor Processor. ``QNNExecutionProvider:cpu`` is the
      # QNN reference CPU backend (slower than plain onnxruntime; debugging
      # only). Per-provider knobs (htp_performance_mode, vtcm_mb …) go in
      # DETECT_ONNX_PROVIDER_OPTIONS=key=value,key=value.
      - DETECT_ONNX_PROVIDERS=${DETECT_ONNX_PROVIDERS:-QNNExecutionProvider:htp}
      - DETECT_ONNX_PROVIDER_OPTIONS=${DETECT_ONNX_PROVIDER_OPTIONS:-}
  # ── ONNX adapters (ai-adapter -qualcomm flavours): QNN on the Hexagon NPU ──
  # Each adapter follows <NAME>_ONNX_PROVIDERS, then the shared
  # ADAPTER_ONNX_PROVIDERS, then a default that is the NPU only where the
  # model is measured on it (docs/HARDWARE.md, 'what runs where'). The
  # HTP is one device shared by everything on it;
  # the Tier-0 detector has first claim. Each keeps the profiles of the
  # service it overrides, so this overlay never activates an adapter the
  # operator did not enable. Same host bits as detect-pipeline above.
  yolov8-adapter:
    image: ghcr.io/open-nvr/yolov8-adapter:${ADAPTER_TAG:-latest}-qualcomm
    devices:
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp
      - /dev/dma_heap/system:/dev/dma_heap/system
      - /dev/dma_heap/qcom,system:/dev/dma_heap/qcom,system
    group_add:
      - "${FASTRPC_GID:-125}"
      - "${DMAHEAP_GID:-989}"
    volumes:
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libcdsprpc.so.1.0.0:/usr/lib/aarch64-linux-gnu/libcdsprpc.so:ro
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libdmabufheap.so.0:/usr/lib/aarch64-linux-gnu/libdmabufheap.so.0:ro
    environment:
      - ADAPTER_ONNX_PROVIDERS=${YOLOV8_ONNX_PROVIDERS:-${ADAPTER_ONNX_PROVIDERS:-QNNExecutionProvider:htp}}
      - ADAPTER_ONNX_PROVIDER_OPTIONS=${ADAPTER_ONNX_PROVIDER_OPTIONS:-}
  yolo-pose-adapter:
    profiles: [apps, guard-scan-compliance]
    image: ghcr.io/open-nvr/yolo-pose-adapter:${YOLO_POSE_ADAPTER_TAG:-latest}-qualcomm
    devices:
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp
      - /dev/dma_heap/system:/dev/dma_heap/system
      - /dev/dma_heap/qcom,system:/dev/dma_heap/qcom,system
    group_add:
      - "${FASTRPC_GID:-125}"
      - "${DMAHEAP_GID:-989}"
    volumes:
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libcdsprpc.so.1.0.0:/usr/lib/aarch64-linux-gnu/libcdsprpc.so:ro
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libdmabufheap.so.0:/usr/lib/aarch64-linux-gnu/libdmabufheap.so.0:ro
    environment:
      - ADAPTER_ONNX_PROVIDERS=${YOLO_POSE_ONNX_PROVIDERS:-${ADAPTER_ONNX_PROVIDERS:-QNNExecutionProvider:htp}}
      - ADAPTER_ONNX_PROVIDER_OPTIONS=${ADAPTER_ONNX_PROVIDER_OPTIONS:-}
  # Speech to text for the camera agent. The image is whatever STT_ADAPTER
  # resolved to (docker-compose.camera-agent.yml): with the default `auto`
  # that is Whisper-Small as QNN context binaries on the Hexagon here
  # (whisper_qnn, 361 ms an utterance on a Ventuno Q against parakeet's
  # 774 ms, bench/), parakeet only when the NPU image is not available or
  # STT_ADAPTER names it. The device, groups and libraries are lent either
  # way (parakeet never asks for QNN, so they are inert for it); only the
  # providers variable start.sh fills decides.
  whisper-adapter:
    profiles: [camera-agent]
    devices:
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp
      - /dev/dma_heap/system:/dev/dma_heap/system
      - /dev/dma_heap/qcom,system:/dev/dma_heap/qcom,system
    group_add:
      - "${FASTRPC_GID:-125}"
      - "${DMAHEAP_GID:-989}"
    volumes:
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libcdsprpc.so.1.0.0:/usr/lib/aarch64-linux-gnu/libcdsprpc.so:ro
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libdmabufheap.so.0:/usr/lib/aarch64-linux-gnu/libdmabufheap.so.0:ro
  insightface-adapter:
    profiles: [apps, smart-doorbell]
    image: ghcr.io/open-nvr/insightface-adapter:${ADAPTER_TAG:-latest}-qualcomm
    devices:
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp
      - /dev/dma_heap/system:/dev/dma_heap/system
      - /dev/dma_heap/qcom,system:/dev/dma_heap/qcom,system
    group_add:
      - "${FASTRPC_GID:-125}"
      - "${DMAHEAP_GID:-989}"
    volumes:
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libcdsprpc.so.1.0.0:/usr/lib/aarch64-linux-gnu/libcdsprpc.so:ro
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libdmabufheap.so.0:/usr/lib/aarch64-linux-gnu/libdmabufheap.so.0:ro
    environment:
      - ADAPTER_ONNX_PROVIDERS=${INSIGHTFACE_ONNX_PROVIDERS:-${ADAPTER_ONNX_PROVIDERS:-QNNExecutionProvider:htp}}
      - ADAPTER_ONNX_PROVIDER_OPTIONS=${ADAPTER_ONNX_PROVIDER_OPTIONS:-}
  package-detection-adapter:
    profiles: [apps, package-delivery]
    image: ghcr.io/open-nvr/package-detection-adapter:${ADAPTER_TAG:-latest}-qualcomm
    devices:
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp
      - /dev/dma_heap/system:/dev/dma_heap/system
      - /dev/dma_heap/qcom,system:/dev/dma_heap/qcom,system
    group_add:
      - "${FASTRPC_GID:-125}"
      - "${DMAHEAP_GID:-989}"
    volumes:
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libcdsprpc.so.1.0.0:/usr/lib/aarch64-linux-gnu/libcdsprpc.so:ro
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libdmabufheap.so.0:/usr/lib/aarch64-linux-gnu/libdmabufheap.so.0:ro
    environment:
      - ADAPTER_ONNX_PROVIDERS=${PACKAGE_DETECTION_ONNX_PROVIDERS:-${ADAPTER_ONNX_PROVIDERS:-QNNExecutionProvider:htp}}
      - ADAPTER_ONNX_PROVIDER_OPTIONS=${ADAPTER_ONNX_PROVIDER_OPTIONS:-}
  fast-plate-ocr-adapter:
    profiles: [apps, license-plate-recognition]
    image: ghcr.io/open-nvr/fast-plate-ocr-adapter:${ADAPTER_TAG:-latest}-qualcomm
    devices:
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp
      - /dev/dma_heap/system:/dev/dma_heap/system
      - /dev/dma_heap/qcom,system:/dev/dma_heap/qcom,system
    group_add:
      - "${FASTRPC_GID:-125}"
      - "${DMAHEAP_GID:-989}"
    volumes:
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libcdsprpc.so.1.0.0:/usr/lib/aarch64-linux-gnu/libcdsprpc.so:ro
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libdmabufheap.so.0:/usr/lib/aarch64-linux-gnu/libdmabufheap.so.0:ro
    environment:
      # Measured on the HTP: 79 ms a plate end-to-end vs 276 ms on CPU
      # (single crop per call). The QNN GPU backend hung at load.
      - ADAPTER_ONNX_PROVIDERS=${FAST_PLATE_OCR_ONNX_PROVIDERS:-${ADAPTER_ONNX_PROVIDERS:-QNNExecutionProvider:htp}}
      - ADAPTER_ONNX_PROVIDER_OPTIONS=${ADAPTER_ONNX_PROVIDER_OPTIONS:-}
  # ── The captioner: Gemma on the Hexagon NPU through LiteRT-LM ──
  # start.sh fills CAPTION_ADAPTER=litertlm and CAPTION_ADAPTER_TAG=
  # <tag>-qualcomm on this flavour (only when .env still held a CPU
  # captioner and no tag of its own), so the camera-agent file's image
  # expression resolves to ghcr.io/open-nvr/litertlm-adapter:…-qualcomm.
  # What is added here is the same host bits as above plus two volumes: the
  # 2.7 GB NPU-compiled model, downloaded once from Hugging Face, and the
  # six Qualcomm AI Runtime libraries fetched once from Qualcomm (their
  # terms do not allow redistribution in the image). Inert for moondream /
  # ollamavlm (extra device nodes, unused volumes). Measured on a Ventuno Q
  # (2026-11-05): 2.5 s a photo warm, 4.3 s cold, the detector sharing the
  # NPU 38 → 44 ms an inference; qwen3-vl 2B via Ollama on the same CPU
  # took 60–90 s and outran every deadline. Keeps the profiles of the
  # service it overrides.
  caption-adapter:
    profiles: [camera-agent, camera-agent-chat, enrichment, descriptions]
    devices:
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp
      - /dev/dma_heap/system:/dev/dma_heap/system
      - /dev/dma_heap/qcom,system:/dev/dma_heap/qcom,system
    group_add:
      - "${FASTRPC_GID:-125}"
      - "${DMAHEAP_GID:-989}"
    volumes:
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libcdsprpc.so.1.0.0:/usr/lib/aarch64-linux-gnu/libcdsprpc.so:ro
      - ${QCOM_LIB_DIR:-/usr/lib/aarch64-linux-gnu}/libdmabufheap.so.0:/usr/lib/aarch64-linux-gnu/libdmabufheap.so.0:ro
      - opennvr_litertlm_models:/models
      - opennvr_litertlm_npu:/opt/npu/lib
    environment:
      # Read by the litertlm adapter only. The model download runs once
      # into the volume; set LITERTLM_MODEL_URL= (empty) in .env to mount
      # the file yourself instead.
      - OPENNVR_LITERTLM_MODEL_URL=${LITERTLM_MODEL_URL:-https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it_Qualcomm_QCS8275.litertlm}
      - OPENNVR_LITERTLM_MAX_IMAGE_PX=${LITERTLM_MAX_IMAGE_PX:-768}

volumes:
  opennvr_litertlm_models:
  opennvr_litertlm_npu:
